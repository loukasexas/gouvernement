/* Salaires par département */
function payCanEdit(key){const d=S.paie[key];if(payGlobal())return true;const u=ME();return can("pay.dept")&&deptKey(u.dept)==key&&!(d&&d.st=="soumise")}
function payTouch(key){const u=ME();return {updNom:u.nom,updT:Date.now()}}
function paySetPeriod(key,v){if(!payCanEdit(key))return;DBX.update("paie/"+key,Object.assign({periode:String(v).trim()},payTouch(key)))}
function paySetLine(key,uid,f,v){if(!payCanEdit(key))return;let val;if(typeof v=="boolean")val=v||null;else if(f=="note"||f=="st")val=String(v).trim()||null;else val=String(v).trim()===""?null:Math.max(0,num(v));
 const up=payTouch(key);up["lines/"+uid+"/"+f.replace(".","/")]=val;if(!S.paie[key]||!S.paie[key].st)up.st="brouillon";DBX.update("paie/"+key,up)}
function paySubmit(key,nm){if(!payCanEdit(key))return;const d=S.paie[key]||{};if(!d.periode)return say("Indiquez la période de paie.");const tot=draftTotal(key);
 ask(`Soumettre la paie « ${d.periode} » du département ${nm} (${money(tot)}) pour validation ?`,()=>{const u=ME();DBX.update("paie/"+key,{st:"soumise",subNom:u.nom,subT:Date.now(),retour:null});log(`Paie ${d.periode} soumise pour validation (${money(tot)})`,nm,"Salaires");toast("Paie soumise pour validation.")},"Soumettre")}

function payValidate(key,nm){if(!payGlobal())return;const d=S.paie[key]||{};if(!d.periode)return say("Indiquez la période de paie.");const L=deptStaff(key).filter(u=>payCalc(u,(d.lines||{})[u.id]).total>0);if(!L.length)return say("Aucun montant à verser.");
 const tot=L.reduce((s,u)=>s+payCalc(u,d.lines[u.id]).total,0);
 ask(`Valider et verser la paie « ${d.periode} » du département ${nm} : ${money(tot)} à ${L.length} agent(s) ? Les montants seront débités du Trésor et la paie archivée.`,()=>{
  const me=ME(),now=Date.now(),aid=nid(),lines={};
  L.forEach(u=>{const l=d.lines[u.id],r=payCalc(u,l),t=r.total;lines[u.id]={nom:u.nom,grade:gname(u),h:r.h,q:Math.round(r.q*100),av:num(l.av),det:payDet(u,l),x:l.x||{},montant:r.sal,prime:t-r.sal,total:t,note:l.note||""};
   DBX.update("users/"+u.id,{paidAt:now,bonus:0});const tid=nid();
   DBX.set("transactions/"+tid,{id:tid,t:now,type:"out",cat:"Salaires",dept:key=="_dir"?"":(u.dept||""),user:u.id,paie:aid,montant:t,label:`Salaire ${d.periode} — ${u.nom}`,by:me.id,byNom:me.nom})});
  DBX.set("paiearch/"+aid,{id:aid,dept:key,deptNom:nm,periode:d.periode,t:now,by:me.id,byNom:me.nom,subNom:d.subNom||d.updNom||"",total:tot,lines});
  DBX.set("paie/"+key,{st:"brouillon",lines:{},periode:""});
  log(`Paie ${d.periode} versée : ${money(tot)} à ${L.length} agent(s)`,nm,"Salaires");toast("Paie versée et archivée.");filt.pst="arch"},"Valider et verser")}

  log(`Patrouilles archivées : ${P.length} rapport(s) du ${fdd(from)} au ${fdd(to)}`,"Sécurité","Sécurité");toast("Période archivée.")},"Archiver")}
function patArchDel(id){if(!isDir())return;const a=S.patarch[id],P=vals(S.patrouilles).filter(p=>p.arch==id);ask(`Supprimer définitivement l'archive du ${fdd(a.from)} au ${fdd(a.to)} et ses ${P.length} rapport(s) ?`,()=>{P.forEach(p=>DBX.remove("patrouilles/"+p.id));DBX.remove("patarch/"+id);log(`Archive de patrouilles supprimée (${fdd(a.from)} → ${fdd(a.to)})`,"Sécurité","Sécurité");modal=null},"Supprimer")}
function patArchCSV(id){const a=S.patarch[id],q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';const P=vals(S.patrouilles).filter(p=>p.arch==id).sort((x,y)=>(x.date+x.heure).localeCompare(y.date+y.heure));
 const rows=[["N°","Type","Date","Heure","Agent","Matricule","Problèmes"]].concat(P.map(p=>[p.num,(PATL[p.type]||["",""])[1],fdd(p.date),p.heure,p.byNom,p.matricule,p.problemes||"RAS"]));
 const csv="﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n"),b=new Blob([csv],{type:"text/csv;charset=utf-8"}),l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="patrouilles-"+a.from+"_"+a.to+".csv";document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(l.href);l.remove()},500)}

/* Archives fiscales */
function closePeriod(){if(!can("fin.archive"))return;const name=tval("arn");if(!name)return say("Donnez un nom à la période (ex. : Semaine 41 — 2026).");
 const P=curPeriod();if(!P.D.length&&!P.F.length)return say("Aucune déclaration ni impôt dans la période en cours.");
 ask(`Clôturer « ${name} » ? ${P.D.length} déclaration(s) et ${P.F.length} impôt(s) seront archivés.${P.impaye?` ${money(P.impaye)} d'impôts impayés resteront à recouvrer.`:""}`,()=>{
  const u=ME(),now=Date.now(),id=nid(),per={};const E=vals(S.users).filter(x=>x.role=="entreprise");
  const ent=(uid,nom)=>{if(!per[uid]){const x=S.users[uid];per[uid]={nom:x?x.nom:nom,type:x?taxCatName(x):"—",taux:x?taxRate(x):0,ca:0,impot:0,paye:0,reste:0}}return per[uid]};
  P.D.forEach(d=>{const e=ent(d.ent,d.entNom);e.ca+=num(d.ca);e.impot+=num(d.impot)});
  P.F.forEach(f=>{const e=ent(f.ent||("x_"+f.entNom),f.entNom);if(f.st=="payee")e.paye+=num(f.montant);else e.reste+=num(f.montant)});
  const clean=k=>String(k).replace(/[.#$\/\[\]]/g,"_");const perE={};Object.entries(per).forEach(([k,v])=>perE[clean(k)]=v);
  DBX.set("archives/"+id,{id,name,note:tval("arno"),from:P.from,to:now,by:u.id,byNom:u.nom,nDecl:P.D.length,nFact:P.F.length,ca:P.ca,emis:P.emis,paye:P.paye,impaye:P.impaye,perEnt:perE});
  DBX.set("archdata/"+id,{bareme:{cats:TCATS().map(c=>({name:c.name,rate:num(c.rate)})),def:num(S.config.tax),ents:E.map(x=>({nom:x.nom,type:taxCatName(x),taux:taxRate(x),own:hasOwnRate(x)}))},
   decls:P.D.map(d=>({t:d.t,ent:d.ent,entNom:d.entNom,periode:d.periode,ca:num(d.ca),taux:num(d.taux),impot:num(d.impot),st:d.st})).sort((a,b)=>a.t-b.t),
   facts:P.F.map(f=>({num:f.num,ent:f.ent||"",entNom:f.entNom,motif:f.motif,montant:num(f.montant),st:f.st}))});
  const ud={},uf={};P.D.forEach(d=>ud[d.id+"/arch"]=id);P.F.filter(f=>f.st=="payee").forEach(f=>uf[f.id+"/arch"]=id);
  if(Object.keys(ud).length)DBX.update("declarations",ud);if(Object.keys(uf).length)DBX.update("factures",uf);
  log(`Période fiscale clôturée : ${name} (${P.D.length} déclarations, ${money(P.emis)} d'impôts)`,"Finances","Archives");clr("arn","arno");toast("Période archivée.")},"Clôturer")}
function delArchive(id){if(!isDir())return;const a=S.archives[id];const D=vals(S.declarations).filter(d=>d.arch==id),F=vals(S.factures).filter(f=>f.arch==id);
 ask(`Supprimer définitivement l'archive « ${a.name} » ? Ses ${D.length} déclaration(s) et ${F.length} impôt(s) réglé(s) seront supprimés avec elle. Les encaissements déjà comptés au Trésor ne sont pas modifiés.`,()=>{
 D.forEach(d=>DBX.remove("declarations/"+d.id));F.forEach(f=>{if(f.proof)DBX.remove("preuves/"+f.id);DBX.remove("factures/"+f.id)});DBX.remove("archives/"+id);DBX.remove("archdata/"+id);delete archCache[id];
 log(`Archive fiscale supprimée : ${a.name} (${D.length} déclaration(s), ${F.length} impôt(s))`,"Finances","Archives");modal=null},"Supprimer")}
function archText(a){const E=Object.values(a.perEnt||{}).sort((x,y)=>num(y.impot)-num(x.impot));
 return [`# Bilan fiscal — ${a.name}`,`Du ${a.from?fd(a.from):"début"} au ${fd(a.to)}`,"",`- Déclarations : ${a.nDecl}`,`- CA déclaré : ${money(a.ca)}`,`- Impôts déclarés : ${money(a.emis)}`,`- Impôts encaissés : ${money(a.paye)}`,`- Impayés : ${money(a.impaye)}`,"","## Détail par entreprise"].concat(E.map(e=>`- ${e.nom} (${num(e.taux)} %) : ${money(e.impot)}${num(e.reste)>0?` — reste dû ${money(e.reste)}`:""}`)).join("\n")}
function archCopy(id){const t=archText(S.archives[id]),done=()=>toast("Bilan copié : collez-le dans Discord.");if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));else fallbackCopy(t,done)}
function archCSV(id){const a=S.archives[id],q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
 const rows=[["Entreprise","Type","Taux (%)","CA déclaré","Impôt","Payé","Reste dû"]].concat(Object.values(a.perEnt||{}).map(e=>[e.nom,e.type,num(e.taux),num(e.ca),num(e.impot),num(e.paye),num(e.reste)]));
 rows.push([],["Total","","",a.ca,a.emis,a.paye,a.impaye]);
 const csv="\ufeff"+rows.map(r=>r.map(q).join(";")).join("\r\n"),b=new Blob([csv],{type:"text/csv;charset=utf-8"}),l=document.createElement("a");
 l.href=URL.createObjectURL(b);l.download="archive-fiscale-"+a.name.replace(/[^\w\-]+/g,"_")+".csv";document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(l.href);l.remove()},500)}

 DBX.set("annonces/"+id,{id,titre:t,txt:x,cible:val("at3"),pin:!!val("at4"),t:Date.now(),by:u.id,nom:u.nom+" — "+gname(u)});log("Annonce publiée : "+t,u.dept,"Communication");clr("at1","at2","at4");toast("Annonce publiée.")}

/* Personnel */
async function addUser(){const dir=isDir(),nom=tval("cn"),l=tval("cl"),p=val("cp"),r=val("cr");
 if(!nom||!l||!p)return say("Nom, identifiant et mot de passe requis.");if(!/^[\w.\-@]{3,32}$/.test(l))return say("Identifiant : 3 à 32 caractères (lettres, chiffres, . - _ @).");
 if(vals(S.users).some(u=>u.login.toLowerCase()==l.toLowerCase()))return say("Cet identifiant existe déjà.");
 if(!dir&&!["entreprise","fonctionnaire"].includes(r))return say("Rôle non autorisé.");
 const dept=(r=="fonctionnaire"||r=="encadrement")?(dir?val("cd"):ME().dept):"";if((r=="fonctionnaire"||r=="encadrement")&&!dept)return say("Choisissez un département.");
 const id=nid();await DBX.set("users/"+id,{id,login:l,hash:await hashPw(l,p),nom,role:r,dept,gradeId:r=="entreprise"?"":val("cg"),taxCat:r=="entreprise"?val("ctc"):"",taxRate:r=="entreprise"&&tval("ctr")!==""?Math.min(100,Math.max(0,num(val("ctr")))):null,matricule:r=="entreprise"?"":tval("cm"),tel:tval("ct"),active:true,mustChange:true,created:Date.now(),createdBy:meId});
 log(`Compte créé : ${nom} (${ROLES[r]}${dept?", "+dept:""})`,dept,"Comptes");clr("cn","cl","cp","cm","ct");toast("Compte créé. Identifiant : "+l)}
async function saveUser(id){const u=S.users[id],dir=isDir(),nom=tval("en");if(!nom)return say("Nom requis.");
 const role=dir?val("er"):u.role,up={nom,tel:tval("et"),active:val("ea")=="1"};up.role=role;
 if(role=="fonctionnaire"||role=="encadrement"){up.dept=dir?val("ed"):u.dept;if(!up.dept)return say("Choisissez un département.")}else up.dept="";
 if(role!="entreprise"){up.gradeId=val("eg");up.matricule=tval("em")}else{up.gradeId="";up.taxCat=val("etc")||"";up.taxRate=tval("etr")!==""?Math.min(100,Math.max(0,num(val("etr")))):null;}
 const np=val("ep");if(np){up.hash=await hashPw(u.login,np);up.mustChange=true}
 if(dir&&(role=="fonctionnaire"||role=="encadrement"))up.xperms=finalPerms(null,false);
 DBX.update("users/"+id,up);log(`Compte modifié : ${nom}${up.active===false?" (suspendu)":""}${np?" — mot de passe réinitialisé":""}`,up.dept,"Comptes");toast("Compte mis à jour.");closeM()}
function delUser(id){const u=S.users[id];ask(`Supprimer le compte de ${u.nom} (${u.login}) ? Son historique reste dans le journal.`,()=>{DBX.remove("users/"+id);log("Compte supprimé : "+u.nom,u.dept,"Comptes")},"Supprimer")}
function saveGrade(id){const dir=isDir(),name=tval("gn");if(!name)return say("Intitulé requis.");const old=id?S.grades[id]:null;
 const role=dir?val("gr"):"fonctionnaire",dept=dir?val("gd"):ME().dept;
 const g={name,role,dept,color:val("gc"),rank:num(val("grk")),perms:role=="direction"?{}:finalPerms(old&&old.perms,!dir)};
 if(dir){const pb=String(val("gpb")).trim();if(pb===""){g.pBase=null;g.pMax=null;g.pRate=null}else{g.pBase=Math.max(0,num(pb));g.pMax=num(val("gpm"))>g.pBase?num(val("gpm")):0;g.pRate=g.pMax?Math.max(0,num(val("gpr"))):0}}
 if(id)DBX.update("grades/"+id,g);else{id=nid();g.id=id;Object.keys(g).forEach(k=>g[k]==null&&delete g[k]);DBX.set("grades/"+id,g)}
 log(`Grade ${old?"modifié":"créé"} : ${name}`,dept,"Grades");toast("Grade enregistré.");closeM()}
function delGrade(id){const g=S.grades[id],n=vals(S.users).filter(u=>u.gradeId==id);ask(`Supprimer le grade « ${g.name} » ?${n.length?` ${n.length} agent(s) perdront ce grade.`:""}`,()=>{n.forEach(u=>DBX.update("users/"+u.id,{gradeId:""}));DBX.remove("grades/"+id);log("Grade supprimé : "+g.name,g.dept,"Grades");modal=null},"Supprimer")}
/* Administration */
function saveBanner(){DBX.update("config",{banner:{txt:tval("bt"),lvl:val("bl"),on:val("bo")=="1"}});log("Bandeau d'information mis à jour","Communication","Administration");toast("Bandeau mis à jour.")}
function saveSettings(){const dp=val("sdp").split("\n").map(s=>s.trim()).filter(Boolean);if(!dp.length)return toast("Il faut au moins un département.",1);
 DBX.update("config",{siteName:tval("sn")||"Gouvernement de Los Santos",subtitle:tval("ss"),accent:val("sa"),logo:tval("slg")||"logo.png",treasuryStart:num(val("st0")),depts:[...new Set(dp)]});applyTheme();log("Paramètres du site modifiés","","Administration");toast("Paramètres enregistrés.")}

function exportData(){const data={config:S.config};COLS.forEach(c=>data[c]=S[c]);const b=new Blob([JSON.stringify(data,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="sauvegarde-intranet-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);log("Sauvegarde exportée","","Administration")}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){return toast("Fichier invalide.",1)}if(!d||!d.users)return toast("Ce fichier n'est pas une sauvegarde de l'intranet.",1);
 ask("Restaurer cette sauvegarde ? Toutes les données actuelles seront remplacées.",()=>{DBX.replaceAll(d).then(()=>{toast("Sauvegarde restaurée.");setTimeout(()=>log("Sauvegarde restaurée","","Administration"),500)})},"Restaurer")};r.readAsText(f);inp.value=""}
function wipeAll(){ask("Tout effacer définitivement ? Cette action est irréversible.",()=>{DBX.replaceAll({}).then(()=>{meId=null;lsSet("lsgov_session",null);ready=false;S={config:{}};COLS.forEach(c=>S[c]={});setTimeout(boot,600)})},"Tout effacer")}


/* Grille salariale : création des grades manquants */
function gridSync(){if(!isDir())return;const todo=[];
 Object.entries(GRILLE).forEach(([dc,[nm,R]])=>{const dept=dc=="_dir"?"":DEPTS().find(d=>dcode(d)==dc);if(dept===undefined)return;
  const ex=vals(S.grades).filter(g=>dc=="_dir"?g.role=="direction":g.role!="direction"&&g.dept==dept);
  R.forEach((r,i)=>{if(!ex.some(g=>gridRow(g)===r))todo.push({dc,dept,r,i,ex})})});
 if(!todo.length)return toast("Tous les grades de la grille existent déjà.");
 ask(`Créer ${todo.length} grade(s) manquant(s) d'après la grille salariale (${[...new Set(todo.map(t=>GRILLE[t.dc][0]))].join(", ")}) ? Ils recevront les permissions de base : complétez-les ensuite.`,()=>{
  const P=(...a)=>Object.fromEntries(a.map(k=>[pk(k),true])),base=P("annuaire","dos.view","dos.treat");
  todo.forEach(t=>{const min=t.ex.find(g=>gridRow(g)===GRILLE[t.dc][1][0]),enc=t.dc!="_dir"&&t.i<2,role=t.dc=="_dir"?"direction":enc?"encadrement":"fonctionnaire";
   const id=nid()+t.i;DBX.set("grades/"+id,{id,name:t.r[0],role,dept:t.dept,color:(min&&min.color)||"#c9a24a",rank:t.i*10,perms:role=="direction"?{}:enc&&min?Object.assign({},min.perms||{}):base})});
  log(`Grille salariale : ${todo.length} grade(s) créé(s)`,"","Grades");toast(todo.length+" grade(s) créé(s).")},"Créer")}
