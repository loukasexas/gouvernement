<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intranet — Gouvernement de Los Santos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#09101e;--bg2:#0d1628;--cd:#111c31;--cd2:#16243e;--tx:#e7ecf6;--mu:#8b98b4;--bd:#223252;--gold:#c9a24a;--gold2:#e5c97a;--on-gold:#1a1405;--blue:#4c7fe0;--ok:#35c27b;--no:#ef6363;--wa:#e3aa3d;--sh:0 8px 30px rgba(0,0,0,.35);color-scheme:dark}
:root[data-theme="light"]{--bg:#eef1f6;--bg2:#e4e8f0;--cd:#ffffff;--cd2:#f5f7fb;--tx:#121a2b;--mu:#5b6782;--bd:#d6dce8;--gold:#9c7a24;--gold2:#7d6018;--on-gold:#fff;--blue:#2f5fc4;--ok:#17834f;--no:#c43030;--wa:#a86f0b;--sh:0 6px 24px rgba(20,30,60,.10);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
a{color:var(--gold2)}
h1,h2,h3,h4{margin:0 0 10px;line-height:1.25}
h2{font-size:20px}h3{font-size:16px}h4{font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.serif{font-family:Cinzel,Georgia,serif;letter-spacing:.04em}
.mu{color:var(--mu);font-size:13px}.sm{font-size:12px}.b{font-weight:600}.r{text-align:right}.nw{white-space:nowrap}
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:var(--bg2);border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:30}
.brand{display:flex;gap:10px;align-items:center;padding:16px 16px 14px;border-bottom:1px solid var(--bd)}
.brand svg,.brand .logo{width:48px;height:48px;flex:none;object-fit:contain}
.logo{display:block;width:100%;height:100%;object-fit:contain}
.brand .t1{font-family:Cinzel,serif;font-weight:700;font-size:13px;color:var(--gold2);line-height:1.2}
.brand .t2{font-size:11px;color:var(--mu)}
.nav{padding:10px 8px;flex:1}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--mu);padding:9px 10px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer;text-align:left}
.nav button:hover{background:var(--cd);color:var(--tx)}
.nav button.on{background:var(--cd2);color:var(--gold2);box-shadow:inset 3px 0 0 var(--gold)}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;background:var(--no);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.side-foot{padding:12px 16px;border-top:1px solid var(--bd);font-size:12px;color:var(--mu)}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--cd);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20}
.top .who{margin-left:auto;text-align:right;line-height:1.25}

.ticker{overflow:hidden;white-space:nowrap;padding:7px 0;font-size:13px;font-weight:500;border-bottom:1px solid var(--bd)}
.ticker span{display:inline-block;padding-left:100%;animation:tk 28s linear infinite;animation-delay:-5s}
.ticker.info{background:rgba(76,127,224,.14);color:var(--tx)}.ticker.warn{background:rgba(227,170,61,.16)}.ticker.alert{background:rgba(239,99,99,.18)}
@keyframes tk{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:16px}}
main{padding:20px;max-width:1240px;width:100%;margin:0 auto}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h2{margin:0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--gold)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.kpi .l{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v.gold{color:var(--gold2)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 14px}
.form .full{grid-column:1/-1}
label.f{display:block;font-size:12px;color:var(--mu);font-weight:500}
input,select,textarea{width:100%;padding:9px 10px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px}
input[type=checkbox]{width:auto;margin:0}
input[type=color]{padding:2px;height:38px}
textarea{resize:vertical;min-height:70px}
.inl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inl input,.inl select{width:auto;margin:0;min-width:150px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:var(--on-gold);border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--cd2);color:var(--tx);border:1px solid var(--bd)}
.btn.ok{background:var(--ok);color:#fff}.btn.no{background:var(--no);color:#fff}.btn.bl{background:var(--blue);color:#fff}
.btn.gh{background:transparent;color:var(--mu);border:1px solid var(--bd)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn svg{width:16px;height:16px}
.bdg{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.bdg.ok{color:var(--ok)}.bdg.no{color:var(--no)}.bdg.wa{color:var(--wa)}.bdg.bl{color:var(--blue)}.bdg.mu{color:var(--mu)}.bdg.gd{color:var(--gold2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mu);margin-right:6px}.dot.ok{background:var(--ok)}.dot.no{background:var(--no)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;font-weight:600;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--cd2)}
td.r{white-space:nowrap}
td input,td select{margin:0;width:110px;padding:5px 8px}
.empty{color:var(--mu);text-align:center;padding:26px 10px}
.pl{display:flex;flex-wrap:wrap;gap:4px 14px}
.ck{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:3px 0;cursor:pointer}
.ck input:disabled+span{opacity:.45}
.pgrp{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.pgrp h4{margin-bottom:6px}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:16px}
.tl .it{position:relative;padding:0 0 14px}
.tl .it:before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.tl .it.note:before{background:var(--blue)}.tl .it.decision:before{background:var(--ok)}.tl .it.audition:before{background:var(--wa)}
.msgs{display:grid;grid-template-columns:280px 1fr;gap:14px;min-height:60vh}
.conv{background:var(--cd);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.conv .ci{padding:10px 14px;border-bottom:1px solid var(--bd);cursor:pointer}
.conv .ci.on{background:var(--cd2);box-shadow:inset 3px 0 0 var(--gold)}
.thread{background:var(--cd);border:1px solid var(--bd);border-radius:12px;display:flex;flex-direction:column;min-height:60vh}
.thread .body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;max-height:62vh}
.bub{max-width:75%;padding:8px 12px;border-radius:12px;background:var(--cd2);border:1px solid var(--bd);white-space:pre-wrap;word-wrap:break-word}
.bub.me{align-self:flex-end;background:rgba(201,162,74,.16);border-color:rgba(201,162,74,.4)}
.thread .send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd)}
.thread .send textarea{margin:0;min-height:42px;height:42px}
.ann{border-left:3px solid var(--gold)}.ann.pin{border-left-color:var(--no)}
.pre{white-space:pre-wrap;word-wrap:break-word}
.modal-bg{position:fixed;inset:0;background:rgba(3,6,14,.7);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow-y:auto}
.modal{background:var(--cd);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:760px;box-shadow:var(--sh)}
.modal.sm{max-width:440px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--bd)}
.modal .mh h3{margin:0}
.modal .mb{padding:16px 18px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--bd)}
.x{background:none;border:0;color:var(--mu);font-size:22px;cursor:pointer;line-height:1}
.toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--cd2);border:1px solid var(--bd);border-left:3px solid var(--gold);padding:10px 14px;border-radius:10px;box-shadow:var(--sh);max-width:340px;animation:fi .2s}
.toast.err{border-left-color:var(--no)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at top,#16264a 0%,var(--bg) 60%)}
:root[data-theme="light"] .login{background:radial-gradient(ellipse at top,#dfe6f5 0%,var(--bg) 60%)}
.login .box{width:100%;max-width:400px;text-align:center}
.login .seal{width:150px;height:150px;margin:0 auto 12px}
.login .card{text-align:left;margin-top:18px;padding:22px}
.err{color:var(--no);min-height:1.3em;font-size:13px;margin:6px 0 0}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 14px;font-size:14px}
.kv .k{color:var(--mu)}
.svc{text-align:center;padding:28px 16px}
.svc .clk{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;margin:10px 0}
.photo{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;background:var(--gold)}
.bar i.over{background:var(--no)}
.conn{font-size:12px;color:var(--mu)}
.scrim{display:none}
@media(max-width:900px){
 .side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--sh)}
 .side.open{transform:none}
 .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}
 .burger{display:inline-block}
 main{padding:14px 16px}
 .top{padding:10px 16px}
 .msgs{grid-template-columns:1fr}
 .kv{grid-template-columns:1fr}
 .top .who .mu{display:none}
}
</style></head>
<body><div id="root"></div><div class="toasts" id="toasts"></div>
<script>
"use strict";
/* =========================================================
   CONFIGURATION — colle ici l'URL de ta Realtime Database Firebase
   (laisser vide = mode local, données propres à chaque navigateur)
   ========================================================= */
const DB_URL = "https://gouvernement-6e3dd-default-rtdb.europe-west1.firebasedatabase.app";
const ROOT = "lsgov";

/* ---------- Constantes ---------- */
const DEF_DEPTS=["Finances","État-Civil","Justice","Intérieur","Communication","Sécurité"];
const ROLES={entreprise:"Entreprise",fonctionnaire:"Fonctionnaire",encadrement:"Corps d'encadrement",direction:"Direction"};
const COLS=["users","grades","dossiers","affaires","entreprises","identites","casier","avis","transactions","factures","declarations","annonces","messages","logs"];
const DOS_TYPES={
 "Finances":["Déclaration fiscale","Demande de subvention","Contestation d'amende","Échéancier de paiement"],
 "État-Civil":["Enregistrement d'identité","Changement d'adresse","Acte de mariage","Acte de décès"],
 "Justice":["Dépôt de plainte","Demande d'audience","Recours","Médiation commerciale"],
 "Intérieur":["Licence d'exploitation","Renouvellement de licence","Permis de construire","Autorisation d'événement"],
 "Communication":["Communiqué de presse","Demande de partenariat","Accréditation presse"],
 "Sécurité":["Licence de port d'arme","Agrément sécurité privée","Demande d'escorte"]
};
const DST={attente:["En attente","wa"],cours:["En cours","bl"],ok:["Acceptée","ok"],no:["Refusée","no"]};
const AST={ouverte:["Ouverte","bl"],instruction:["En instruction","wa"],audience:["Audience fixée","gd"],jugee:["Jugée","ok"],classee:["Classée sans suite","mu"]};
const PERMS=[
 ["Général",[["dash","Tableau de bord global"],["annuaire","Annuaire des agents"]]],
 ["Dossiers administratifs",[["dos.view","Consulter les dossiers"],["dos.treat","Accepter / refuser"],["dos.assign","Assigner aux agents"],["dos.all","Tous les départements"],["dos.delete","Supprimer un dossier"]]],
 ["Justice",[["jus.view","Consulter les affaires"],["jus.open","Ouvrir une affaire"],["jus.instruct","Instruire (pièces, auditions, notes)"],["jus.status","Statut, juge, audience, clôture / réouverture"],["jus.verdict","Rendre un jugement"],["jus.secret","Voir les affaires confidentielles"],["jus.delete","Supprimer une affaire"]]],
 ["Registres",[["reg.ent.view","Entreprises — consulter"],["reg.ent.edit","Entreprises — modifier"],["reg.civ.view","État civil — consulter"],["reg.civ.edit","État civil — modifier"],["reg.cas.view","Casier — consulter"],["reg.cas.edit","Casier — modifier"],["reg.avis.view","Avis de recherche — consulter"],["reg.avis.edit","Avis de recherche — modifier"]]],
 ["Finances",[["fin.view","Consulter la trésorerie"],["fin.edit","Saisir des opérations"],["fin.bill","Émettre factures et amendes"],["fin.decl","Valider les déclarations fiscales"],["fin.budget","Budgets et taux d'imposition"]]],
 ["Communication",[["com.post","Publier des annonces"],["com.banner","Gérer le bandeau d'information"]]],
 ["Personnel",[["rh.view","Voir les comptes"],["rh.create","Créer des comptes"],["rh.edit","Modifier / suspendre des comptes"],["rh.delete","Supprimer des comptes"],["rh.grades","Gérer les grades"],["rh.pay.view","Voir les salaires"],["rh.pay.edit","Modifier les primes"],["rh.pay.do","Verser les salaires"]]],
 ["Journal",[["log.dept","Journal du département"],["log.all","Journal complet"]]],
 ["Administration",[["adm.site","Paramètres du site, maintenance, sauvegarde"]]]
];
const ALLP=PERMS.flatMap(g=>g[1].map(p=>p[0]));
const PL=Object.fromEntries(PERMS.flatMap(g=>g[1]));
const pk=k=>String(k).replace(/\./g,"_"); // Firebase interdit les points dans les clés

/* ---------- État ---------- */
let S={config:{}};COLS.forEach(c=>S[c]={});
let ready=false,meId=null,view="accueil",sub="",modal=null,keep={},filt={},convWith=null,lastUnread=-1,connected=!DB_URL,bootErr="";
let pendingCb=null;

/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const val=id=>{const e=document.getElementById(id);return e?(e.type=="checkbox"?e.checked:e.value):""};
const tval=id=>String(val(id)).trim();
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vals=o=>Object.values(o||{}).filter(x=>x&&typeof x=="object");
const fd=t=>t?new Date(t).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}):"—";
const fdd=s=>{if(!s)return"—";const d=new Date(s.length==10?s+"T12:00":s);return isNaN(d)?esc(s):d.toLocaleDateString("fr-FR")};
const dur=ms=>{ms=Math.max(0,ms||0);const m=Math.floor(ms/6e4);return Math.floor(m/60)+" h "+String(m%60).padStart(2,"0")};
const clock=ms=>{ms=Math.max(0,ms||0);const s=Math.floor(ms/1e3);return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,"0")).join(":")};
const money=n=>Math.round(+n||0).toLocaleString("fr-FR")+" $";
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isNaN(n)?0:n};
const opts=(a,sel)=>a.map(x=>Array.isArray(x)?`<option value="${esc(x[0])}" ${x[0]==sel?"selected":""}>${esc(x[1])}</option>`:`<option ${x==sel?"selected":""}>${esc(x)}</option>`).join("");
const bdg=(m,s)=>{const x=m[s]||[s,"mu"];return `<span class="bdg ${x[1]}">${esc(x[0])}</span>`};
const nid=()=>DB_URL&&window.firebase?firebase.database().ref().push().key:(Date.now().toString(36)+Math.random().toString(36).slice(2,9));
const DEPTS=()=>(S.config.depts&&S.config.depts.length?S.config.depts:DEF_DEPTS);
const U=id=>S.users[id];
const ME=()=>meId?S.users[meId]:null;
const G=u=>u&&u.gradeId?S.grades[u.gradeId]:null;
const uname=id=>{const u=U(id);return u?u.nom:"—"};
const gname=u=>{const g=G(u);return g?g.name:ROLES[u.role]||""};
const isAgent=u=>u&&u.role!="entreprise";
const nextNum=(col,prefix)=>{const y=new Date().getFullYear();let mx=0;vals(S[col]).forEach(x=>{const m=String(x.num||"").match(/(\d+)$/);if(m)mx=Math.max(mx,+m[1])});return `${prefix}-${y}-${String(mx+1).padStart(4,"0")}`};
async function sha(s){if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return "x"+h}
const hashPw=(login,pw)=>sha("lsgov|"+login.toLowerCase()+"|"+pw);
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}

/* ---------- Permissions ---------- */
function can(p){const u=ME();if(!u||u.role=="entreprise")return false;if(u.role=="direction")return true;
 const g=G(u);return !!((g&&g.perms&&g.perms[pk(p)])||(u.xperms&&u.xperms[pk(p)]))}
const isDir=()=>{const u=ME();return u&&u.role=="direction"};
function myDepts(){const u=ME();return (isDir()||can("dos.all"))?DEPTS():(u&&u.dept?[u.dept]:[])}
function manageable(u){const m=ME();if(!m||!u||u.id==m.id)return false;if(isDir())return true;
 return u.role=="entreprise"||(u.role=="fonctionnaire"&&u.dept&&u.dept==m.dept)}
function gradeEditable(g){if(isDir())return true;const m=ME();return can("rh.grades")&&g.role=="fonctionnaire"&&g.dept==m.dept}

/* ---------- Couche de données (Firebase ou local) ---------- */
function setAt(path,v){const p=path.split("/");let o=S;for(let i=0;i<p.length-1;i++){if(!o[p[i]]||typeof o[p[i]]!="object")o[p[i]]={};o=o[p[i]]}
 const k=p[p.length-1];if(v===null||v===undefined)delete o[k];else o[k]=JSON.parse(JSON.stringify(v))}
const LKEY="lsgov_local_v2";
let db=null;
const DBX={
 set(path,v){setAt(path,v);persist();schedule();if(db)return db.ref(ROOT+"/"+path).set(v===undefined?null:v).catch(fbErr);return Promise.resolve()},
 update(path,obj){for(const k in obj)setAt(path+"/"+k,obj[k]);persist();schedule();if(db)return db.ref(ROOT+"/"+path).update(obj).catch(fbErr);return Promise.resolve()},
 remove(path){return DBX.set(path,null)},
 replaceAll(data){if(db)return db.ref(ROOT).set(data).catch(fbErr);S={config:{}};COLS.forEach(c=>S[c]={});Object.assign(S,data||{});S.config=S.config||{};COLS.forEach(c=>S[c]=S[c]||{});persist();schedule();return Promise.resolve()}
};
function persist(){if(!db)lsSet(LKEY,JSON.stringify(S))}
function fbErr(e){console.error(e);toast("Erreur de synchronisation : "+(e&&e.message||e),1)}
function startData(){
 if(DB_URL&&window.firebase){
  try{firebase.initializeApp({databaseURL:DB_URL});db=firebase.database()}catch(e){bootErr="Impossible d'initialiser Firebase : "+e.message;render();return}
  const loaded=new Set(),all=[...COLS,"config"];
  db.ref(".info/connected").on("value",s=>{connected=!!s.val();schedule()});
  all.forEach(c=>{let r=db.ref(ROOT+"/"+c);if(c=="logs"||c=="messages")r=r.limitToLast(c=="logs"?800:1500);
   r.on("value",s=>{S[c]=s.val()||{};if(!loaded.has(c)){loaded.add(c);if(loaded.size==all.length)boot()}schedule()},
   e=>{bootErr="Accès à la base refusé : vérifie l'URL et les règles Firebase. ("+e.message+")";render()})});
  setTimeout(()=>{if(!ready&&!bootErr){bootErr="La base Firebase ne répond pas. Vérifie l'URL dans le fichier et ta connexion.";render()}},15000);
 }else{
  if(DB_URL&&!window.firebase)bootErr="Le SDK Firebase n'a pas pu être chargé (connexion internet ?).";
  try{const d=JSON.parse(lsGet(LKEY)||"null");if(d){S=d;S.config=S.config||{};COLS.forEach(c=>S[c]=S[c]||{})}}catch(e){}
  window.addEventListener("storage",e=>{if(e.key==LKEY&&e.newValue){try{S=JSON.parse(e.newValue);schedule()}catch(x){}}});
  boot();
 }
}

 if(!Object.keys(S.users).length){
  const id=nid();
  await DBX.set("users/"+id,{id,login:"direction",hash:await hashPw("direction","direction"),nom:"Cabinet du Gouverneur",role:"direction",gradeId:"",dept:"",matricule:"DIR-001",active:true,mustChange:true,created:Date.now()});
 }
 if(!Object.keys(S.grades).length)seedGrades();
 if(!S.config||!S.config.siteName)DBX.update("config",{siteName:"Gouvernement de Los Santos",subtitle:"État de San Andreas — Intranet officiel",depts:DEF_DEPTS,tax:8,requireService:true,treasuryStart:250000,budgets:{},banner:{on:true,txt:"Bienvenue sur l'intranet du Gouvernement de Los Santos. Pensez à prendre votre service avant de traiter les dossiers.",lvl:"info"},maintenance:{on:false,msg:""}});
 const sid=lsGet("lsgov_session");if(sid&&S.users[sid]&&S.users[sid].active!==false)meId=sid;
} catch(e){console.error(e);toast("Erreur d'initialisation : "+e.message,1)}
 ready=true;applyTheme();render();
}

function toast(t,err){const el=document.createElement("div");el.className="toast"+(err?" err":"");el.textContent=t;$("#toasts").appendChild(el);setTimeout(()=>el.remove(),err?6000:3500)}

let schT=0;
function schedule(){if(schT)return;schT=setTimeout(()=>{schT=0;if(ready)render()},40)}
function render(){
 const root=$("#root");if(!root)return;
 const ae=document.activeElement;let fid=ae&&ae.id,ss=null,se=null;try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e){}
 root.querySelectorAll("input[id],textarea[id],select[id]").forEach(e=>{if(e.type!="checkbox"&&e.type!="file"&&!e.hasAttribute("data-nokeep"))keep[e.id]=e.value});
 const mb=root.querySelector(".modal-bg"),ms=mb?mb.scrollTop:0,tb=root.querySelector(".thread .body"),ts=tb?tb.scrollTop:0,tAtEnd=tb?tb.scrollHeight-tb.scrollTop-tb.clientHeight<40:true;
 let h;try{h=page()}catch(e){console.error(e);h=`<div class="login"><div class="box card"><h3>Erreur d'affichage</h3><p class="mu">${esc(e.message)}</p><button class="btn" onclick="modal=null;go('accueil')">Revenir à l'accueil</button></div></div>`}
 root.innerHTML=h;
 for(const id in keep){const e=document.getElementById(id);if(e&&e.type!="checkbox"&&!e.hasAttribute("data-nokeep")&&e.value!==keep[id]){if(e.tagName=="SELECT"&&![...e.options].some(o=>o.value==keep[id]))continue;e.value=keep[id]}}
 if(fid){const e=document.getElementById(fid);if(e){e.focus({preventScroll:true});try{if(ss!=null)e.setSelectionRange(ss,se)}catch(x){}}}
 const mb2=root.querySelector(".modal-bg");if(mb2)mb2.scrollTop=ms;
 const tb2=root.querySelector(".thread .body");if(tb2)tb2.scrollTop=tAtEnd?tb2.scrollHeight:ts;
 tickClocks();notify();
 document.title=(unread()?"("+unread()+") ":"")+"Intranet — "+(S.config.siteName||"Gouvernement de Los Santos");
}
function clr(...ids){ids.forEach(id=>{delete keep[id];const e=document.getElementById(id);if(e){if(e.type=="checkbox")e.checked=false;else e.value=""}})}
function go(v,s){view=v;sub=s||"";modal=null;keep={};closeSide();render();window.scrollTo(0,0)}
function setSub(s){sub=s;keep={};render()}
function openM(type,id,extra){modal=Object.assign({type,id},extra||{});keep={};render()}
function closeM(){modal=null;keep={};render()}
function ask(msg,cb,label){pendingCb=cb;modal={type:"confirm",msg,label:label||"Confirmer",prev:modal};render()}
function askOk(){const cb=pendingCb;pendingCb=null;const p=modal&&modal.prev;modal=p||null;if(cb)cb();render()}
function askNo(){pendingCb=null;modal=modal&&modal.prev||null;render()}
function tickClocks(){document.querySelectorAll("[data-since]").forEach(e=>{e.textContent=clock(Date.now()-(+e.dataset.since)+(+e.dataset.base||0))})}
setInterval(tickClocks,1000);
function unread(){const m=ME();return m?vals(S.messages).filter(x=>x.to==m.id&&!x.read).length:0}
function notify(){const n=unread();if(lastUnread>=0&&n>lastUnread&&!(view=="messages"))toast("Nouveau message reçu");lastUnread=n}
function applyTheme(){setFavicon();const t=lsGet("lsgov_theme")||"dark";document.documentElement.setAttribute("data-theme",t);
 const a=S.config&&S.config.accent;if(a&&/^#[0-9a-f]{6}$/i.test(a)){document.documentElement.style.setProperty("--gold",a);document.documentElement.style.setProperty("--gold2",a)}else{document.documentElement.style.removeProperty("--gold");document.documentElement.style.removeProperty("--gold2")}}
function toggleTheme(){lsSet("lsgov_theme",(lsGet("lsgov_theme")||"dark")=="dark"?"light":"dark");applyTheme();render()}
function openSide(){$(".side")&&$(".side").classList.add("open");$(".scrim")&&$(".scrim").classList.add("open")}
function closeSide(){$(".side")&&$(".side").classList.remove("open");$(".scrim")&&$(".scrim").classList.remove("open")}
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&modal){modal.type=="confirm"?askNo():closeM()}});

<script>
/* =================== STRUCTURE =================== */
function page(){
 if(bootErr&&!ready)return `<div class="login"><div class="box"><div class="seal">${seal()}</div><div class="card"><h3>Connexion à la base impossible</h3><p class="err">${esc(bootErr)}</p></div></div></div>`;
 if(!ready)return `<div class="login"><div class="box"><div class="seal">${seal()}</div><p class="mu">Connexion au serveur gouvernemental…</p></div></div>`;
 const u=ME();
 if(!u||u.active===false){meId=null;return loginPage()+modalH()}
 if(u.mustChange)return pwChangePage();
 const mt=S.config.maintenance||{};
 if(mt.on&&!isDir()&&!can("adm.site"))return `<div class="login"><div class="box"><div class="seal">${seal()}</div><div class="card"><h3>Maintenance en cours</h3><p class="pre">${esc(mt.msg||"L'intranet est temporairement indisponible.")}</p><button class="btn sec" onclick="logout()">Se déconnecter</button></div></div></div>`;
 const N=navItems();if(!N.some(n=>n[0]==view))view=N[0][0];
 const bn=S.config.banner||{};
 const svcOn=u.svc&&u.svc.on;
 return `<div class="app"><div class="scrim" onclick="closeSide()"></div><aside class="side"><div class="brand">${seal()}<div><div class="t1">${esc(S.config.siteName||"Gouvernement de Los Santos")}</div><div class="t2">${esc(S.config.subtitle||"Intranet officiel")}</div></div></div>
 <nav class="nav">${N.map(([k,l,i,c])=>`<button class="${k==view?"on":""}" onclick="go('${k}')">${ic(i)}<span>${l}</span>${c?`<span class="cnt">${c}</span>`:""}</button>`).join("")}
 <button onclick="logout()">${ic("logout")}<span>Déconnexion</span></button></nav>
 <div class="side-foot">${DB_URL?(connected?'<span class="dot ok"></span>Synchronisé':'<span class="dot no"></span>Hors ligne — reconnexion…'):'<span class="dot"></span>Mode local (non partagé)'}</div></aside>
 <div class="wrap"><div class="top"><button class="burger" onclick="openSide()" aria-label="Menu">${ic("menu").replace("<svg",'<svg width="20" height="20"')}</button>
 ${isAgent(u)?`<button class="btn sm ${svcOn?"ok":"gh"}" onclick="toggleSvc()" title="Prise / fin de service">${svcOn?`En service · <span data-since="${u.svc.since}">--</span>`:"Hors service"}</button>`:""}
 <div class="who"><div class="b">${esc(u.nom)}</div><div class="mu">${esc(gname(u))}${u.dept?" · "+esc(u.dept):""}</div></div>
 <button class="btn gh sm" onclick="toggleTheme()" title="Thème clair / sombre" aria-label="Changer de thème">${ic("sun").replace("<svg",'<svg width="16" height="16"')}</button></div>
 ${bn.on&&bn.txt?`<div class="ticker ${esc(bn.lvl||"info")}"><span>${esc(bn.txt)}</span></div>`:""}
 <main>${(V[view]||V.accueil)()}</main></div></div>${modalH()}`;
}
function navItems(){const u=ME(),n=unread(),I=[];
 if(u.role=="entreprise"){const imp=vals(S.factures).filter(f=>f.ent==u.id&&f.st=="due").length;
  return [["accueil","Accueil","home"],["demande","Nouvelle demande","plus"],["mesdem","Mes demandes","folder"],["factures","Factures & impôts","wallet",imp],["annonces","Annonces","megaphone"],["messages","Messagerie","mail",n],["profil","Mon profil","user"]]}
 I.push(["accueil","Accueil","home"],["service","Prise de service","clock"]);
 if(can("dos.view")){const p=vals(S.dossiers).filter(d=>myDepts().includes(d.dept)&&d.st=="attente").length;I.push(["dossiers","Dossiers","folder",p])}
 if(can("jus.view"))I.push(["justice","Justice","scale"]);
 if(["reg.ent.view","reg.civ.view","reg.cas.view","reg.avis.view"].some(can))I.push(["registres","Registres","book"]);
 if(["fin.view","fin.bill","fin.decl","fin.budget"].some(can))I.push(["finances","Finances","coins"]);
 I.push(["annonces","Annonces","megaphone"],["messages","Messagerie","mail",n]);
 if(can("annuaire"))I.push(["annuaire","Annuaire","users"]);
 if(["rh.view","rh.grades","rh.pay.view"].some(can))I.push(["personnel","Personnel","shield"]);
 I.push(["salaire","Mon salaire","wallet"]);
 if(can("log.dept")||can("log.all"))I.push(["journal","Journal","list"]);
 if(can("adm.site")||can("com.banner"))I.push(["admin","Administration","settings"]);
 I.push(["profil","Mon profil","user"]);
 return I}
function loginPage(){const mt=S.config.maintenance||{};
 return `<div class="login"><div class="box"><div class="seal">${seal()}</div><h1 class="serif" style="font-size:22px;color:var(--gold2)">${esc(S.config.siteName||"Gouvernement de Los Santos")}</h1><div class="mu">${esc(S.config.subtitle||"Intranet officiel")}</div>
 <div class="card"><h3>Accès sécurisé</h3><p class="mu" style="margin-top:-4px">Réservé aux agents de l'État et aux entreprises enregistrées.</p>
 ${mt.on?`<p class="bdg wa" style="margin-bottom:10px">Maintenance en cours</p>`:""}

function pwChangePage(){return `<div class="login"><div class="box"><div class="seal">${seal()}</div><div class="card"><h3>Définissez votre mot de passe</h3><p class="mu">Première connexion ou mot de passe réinitialisé : choisissez un nouveau mot de passe personnel.</p>
 <label class="f">Nouveau mot de passe<input id="np1" type="password" autocomplete="new-password"></label><label class="f">Confirmation<input id="np2" type="password" autocomplete="new-password" onkeydown="if(event.key=='Enter')forcePw()"></label>
 <button class="btn" onclick="forcePw()">Valider</button> <button class="btn gh" onclick="logout()">Annuler</button><p class="err" id="msg"></p></div></div></div>`}

const V={};
const kpi=(l,v,c)=>`<div class="kpi"><div class="l">${l}</div><div class="v ${c||""}">${v}</div></div>`;

const match=(q,...f)=>!q||f.join(" ").toLowerCase().includes(q.toLowerCase());
function visibleAnn(){const u=ME();return vals(S.annonces).filter(a=>{if(u.role=="entreprise")return a.cible=="all"||a.cible=="entreprises";if(isDir()||can("com.post"))return true;return a.cible=="all"||a.cible=="agents"||a.cible==u.dept}).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.t-a.t)}
function annCard(a){return `<div class="card ann ${a.pin?"pin":""}"><div class="inl" style="justify-content:space-between"><h3 style="margin:0">${a.pin?"📌 ":""}${esc(a.titre)}</h3>${(can("com.post")&&(isDir()||a.by==meId))?`<button class="btn gh sm" onclick="delAnn('${a.id}')">Supprimer</button>`:""}</div>
 <div class="mu" style="margin:4px 0 8px">${esc(a.nom)} · ${fd(a.t)} · ${a.cible=="all"?"Tous":a.cible=="agents"?"Tous les agents":a.cible=="entreprises"?"Entreprises":esc(a.cible)}</div><div class="pre">${esc(a.txt)}</div></div>`}

/* =================== ACCUEIL =================== */

 ${a.verdict?`<div class="card" style="border-color:var(--ok)"><h4>Jugement — ${fd(a.verdict.t)}</h4><div class="pre">${esc(a.verdict.txt)}</div><div class="kv" style="margin-top:8px"><div class="k">Peine</div><div>${esc(a.verdict.peine||"—")}</div><div class="k">Amende</div><div>${money(a.verdict.amende)}</div><div class="k">Prononcé par</div><div>${esc(a.verdict.nom)}</div></div></div>`:""}
 <h4>Instruction (${P.length})</h4><div class="tl">${P.map(p=>`<div class="it ${p.kind}"><b>${PK[p.kind]||p.kind}</b> · ${esc(p.nom)} <span class="mu">${fd(p.t)}</span><div class="pre">${esc(p.txt)}</div>${p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener">Voir la pièce jointe</a>`:""}</div>`).join("")||`<p class="mu">Aucune pièce versée au dossier.</p>`}</div>
 ${can("jus.instruct")&&!closed?`<div class="card" style="background:var(--bg)"><h4>Verser au dossier</h4><div class="form"><label class="f">Nature<select id="pk">${opts(Object.entries(PK))}</select></label><label class="f">Lien (image, document)<input id="pli" placeholder="https://…"></label><label class="f full">Contenu<textarea id="ptx" rows="3"></textarea></label></div><button class="btn sec sm" onclick="affPiece('${a.id}')">Ajouter</button></div>`:""}
 ${can("jus.status")?`<div class="card" style="background:var(--bg)"><h4>Gestion de l'affaire</h4><div class="form"><label class="f">Statut<select id="ast2" data-nokeep>${opts(Object.entries(AST).map(([k,v])=>[k,v[0]]),a.st)}</select></label>
 <label class="f">Juge<select id="aj2" data-nokeep><option value="">— À désigner —</option>${judges().map(x=>`<option value="${x.id}" ${x.id==a.juge?"selected":""}>${esc(x.nom)}</option>`).join("")}</select></label>
 <label class="f">Date d'audience<input id="aau2" type="datetime-local" data-nokeep value="${esc(a.audience||"")}"></label></div><button class="btn sec sm" onclick="affManage('${a.id}')">Enregistrer</button></div>`:""}
 ${can("jus.verdict")&&!closed?`<div class="card" style="background:var(--bg)"><h4>Rendre le jugement</h4><label class="f">Dispositif du jugement<textarea id="vtx" rows="3"></textarea></label><div class="form"><label class="f">Peine prononcée<input id="vpe" placeholder="Ex. : 30 jours de prison, relaxe…"></label><label class="f">Amende ($)<input id="vam" type="number" min="0"></label></div>
 <label class="ck"><input type="checkbox" id="vca" checked><span>Inscrire au casier judiciaire du mis en cause</span></label><br><label class="ck"><input type="checkbox" id="vfa" checked><span>Émettre l'amende au Trésor</span></label><p><button class="btn ok" onclick="affVerdict('${a.id}')">Prononcer le jugement</button></p></div>`:""}<p class="err" id="msg"></p>`,
 foot:`${can("jus.delete")?`<button class="btn gh" onclick="affDel('${a.id}')">Supprimer</button>`:""}${can("jus.status")&&closed?`<button class="btn sec" onclick="affReopen('${a.id}')">Rouvrir l'affaire</button>`:""}<button class="btn sec" onclick="closeM()">Fermer</button>`}}
</script>
<script>
/* =================== REGISTRES =================== */
const REG={
 entreprises:{t:"Entreprises",p:"reg.ent",cols:["nom","gerant","secteur","licence","licSt","exp"],f:[
  {k:"nom",l:"Raison sociale",req:1},{k:"gerant",l:"Gérant"},{k:"secteur",l:"Secteur",type:"select",o:["Commerce","Restauration","Automobile","Transport","Sécurité privée","Divertissement","Immobilier","Industrie","Média","Santé","Autre"]},
  {k:"adresse",l:"Adresse"},{k:"tel",l:"Téléphone"},{k:"licence",l:"Type de licence"},{k:"licSt",l:"Statut de la licence",type:"select",o:["En demande","Active","Suspendue","Expirée","Révoquée"]},{k:"exp",l:"Expiration de la licence",type:"date"},
  {k:"compte",l:"Compte entreprise lié",type:"account"},{k:"notes",l:"Notes",type:"area"}]},
 identites:{t:"État civil",p:"reg.civ",cols:["nom","prenom","naiss","sexe","statut","tel"],f:[
  {k:"nom",l:"Nom",req:1},{k:"prenom",l:"Prénom",req:1},{k:"naiss",l:"Date de naissance",type:"date"},{k:"lieu",l:"Lieu de naissance"},{k:"sexe",l:"Sexe",type:"select",o:["Homme","Femme","Autre"]},{k:"nat",l:"Nationalité"},
  {k:"adresse",l:"Adresse"},{k:"tel",l:"Téléphone"},{k:"profession",l:"Profession"},{k:"statut",l:"Situation",type:"select",o:["Célibataire","Marié(e)","Pacsé(e)","Divorcé(e)","Veuf(ve)","Décédé(e)"]},{k:"photo",l:"Photo (lien URL)"},{k:"notes",l:"Mentions marginales",type:"area"}]},
 casier:{t:"Casier judiciaire",p:"reg.cas",cols:["nom","date","infraction","cat","peine","amende"],f:[
  {k:"nom",l:"Nom complet",req:1},{k:"date",l:"Date des faits",type:"date"},{k:"infraction",l:"Infraction",req:1},{k:"cat",l:"Catégorie",type:"select",o:["Contravention","Délit","Crime"]},
  {k:"peine",l:"Peine prononcée"},{k:"amende",l:"Amende ($)",type:"number"},{k:"affaire",l:"N° d'affaire"},{k:"notes",l:"Notes",type:"area"}]},
 avis:{t:"Avis de recherche",p:"reg.avis",cols:["nom","motif","danger","prime","st"],f:[
  {k:"nom",l:"Nom / signalement",req:1},{k:"motif",l:"Motif",req:1},{k:"danger",l:"Dangerosité",type:"select",o:["Faible","Modérée","Élevée","Extrême"]},{k:"prime",l:"Prime ($)",type:"number"},
  {k:"st",l:"Statut",type:"select",o:["Actif","Levé"]},{k:"photo",l:"Photo (lien URL)"},{k:"desc",l:"Description / signes distinctifs",type:"area"}]}
};
const regLabel=(R,k)=>(R.f.find(x=>x.k==k)||{}).l||k;
function regCell(k,v){if(k=="licSt")return licB(v);if(k=="exp"||k=="naiss"||k=="date")return fdd(v);if(k=="amende"||k=="prime")return v?money(v):"—";
 if(k=="danger")return `<span class="bdg ${({Faible:"mu",Modérée:"bl",Élevée:"wa",Extrême:"no"}[v]||"mu")}">${esc(v||"—")}</span>`;if(k=="st")return `<span class="bdg ${v=="Levé"?"mu":"no"}">${esc(v||"Actif")}</span>`;return esc(v||"—")}
V.registres=()=>{const avail=Object.entries(REG).filter(([k,R])=>can(R.p+".view"));if(!avail.length)return empty("Aucun registre accessible.");
 const s=avail.some(a=>a[0]==sub)?sub:avail[0][0],R=REG[s];
 let L=vals(S[s]).filter(r=>match(filt["r_"+s],...R.f.map(f=>r[f.k]))).sort((a,b)=>(a.nom||"").localeCompare(b.nom||""));
 return `<div class="ph"><h2>Registres officiels</h2>${can(R.p+".edit")?`<button class="btn" onclick="openM('reg',null,{reg:'${s}'})">${ic("plus")}Nouvelle fiche</button>`:""}</div>${tabsH(avail.map(([k,R])=>[k,R.t]),s)}
 <div class="card inl">${search("r_"+s)}<span class="mu">${L.length} fiche(s)</span></div>
 <div class="card tw"><table><tr>${R.cols.map(c=>`<th>${esc(regLabel(R,c))}`).join("")}</tr>${L.map(r=>`<tr class="click" onclick="openM('reg','${r.id}',{reg:'${s}'})">${R.cols.map(c=>`<td>${regCell(c,r[c])}`).join("")}</tr>`).join("")||`<tr><td colspan="${R.cols.length}" class="empty">Registre vide.</td></tr>`}</table></div>`};
function fieldH(f,v,ro){const id="rf_"+f.k;v=v==null?"":v;
 if(ro)return `<div class="k">${esc(f.l)}</div><div class="pre">${f.type=="account"?esc(v?uname(v):"—"):f.type=="date"?fdd(v):f.type=="number"&&v!==""?money(v):esc(v||"—")}</div>`;
 const cls=f.type=="area"?"f full":"f";let inp;
 if(f.type=="select")inp=`<select id="${id}">${opts([""].concat(f.o),v)}</select>`;
 else if(f.type=="area")inp=`<textarea id="${id}" rows="3">${esc(v)}</textarea>`;
 else if(f.type=="account")inp=`<select id="${id}"><option value="">— Aucun —</option>${vals(S.users).filter(u=>u.role=="entreprise").map(u=>`<option value="${u.id}" ${u.id==v?"selected":""}>${esc(u.nom)} (${esc(u.login)})</option>`).join("")}</select>`;
 else inp=`<input id="${id}" type="${f.type||"text"}" value="${esc(v)}">`;
 return `<label class="${cls}">${esc(f.l)}${f.req?" *":""}${inp}</label>`}
function MReg(){const s=modal.reg,R=REG[s],r=modal.id?S[s][modal.id]:{},ed=can(R.p+".edit");if(modal.id&&!r)return null;
 let extra="";
 if(s=="identites"&&modal.id){const full=(r.prenom+" "+r.nom).toLowerCase(),full2=(r.nom+" "+r.prenom).toLowerCase(),m=x=>{const n=(x.nom||"").toLowerCase();return n==full||n==full2};
  if(can("reg.cas.view")){const C=vals(S.casier).filter(m);extra+=`<h4 style="margin-top:14px">Casier judiciaire (${C.length})</h4>${C.map(c=>`<div class="mu">• ${fdd(c.date)} — ${esc(c.infraction)} (${esc(c.cat||"")}) ${c.peine?"· "+esc(c.peine):""}</div>`).join("")||`<p class="mu">Casier vierge.</p>`}`}
  if(can("reg.avis.view")){const A=vals(S.avis).filter(x=>m(x)&&x.st!="Levé");if(A.length)extra+=`<p><span class="bdg no">Fait l'objet de ${A.length} avis de recherche actif(s)</span></p>`}}
 const ph=r.photo&&/^https?:\/\//.test(r.photo)?`<img class="photo" src="${esc(r.photo)}" alt="Photo" style="float:right;margin:0 0 10px 10px">`:"";
 return {title:(modal.id?"":"Nouvelle fiche — ")+esc(R.t)+(r.nom?" — "+esc((r.prenom?r.prenom+" ":"")+r.nom):""),
 body:ed?`${ph}<div class="form">${R.f.map(f=>fieldH(f,r[f.k])).join("")}</div>${modal.id?`<p class="mu sm">Créée par ${esc(uname(r.by))} le ${fd(r.t)}${r.mt?" · modifiée le "+fd(r.mt):""}</p>`:""}${extra}<p class="err" id="msg"></p>`:`${ph}<div class="kv">${R.f.map(f=>fieldH(f,r[f.k],1)).join("")}</div>${extra}`,
 foot:`${ed&&modal.id?`<button class="btn gh" onclick="regDel('${s}','${modal.id}')">Supprimer</button>`:""}<button class="btn sec" onclick="closeM()">${ed?"Annuler":"Fermer"}</button>${ed?`<button class="btn" onclick="regSave('${s}','${modal.id||""}')">Enregistrer</button>`:""}`}}

/* =================== FINANCES =================== */
function treasury(){return num(S.config.treasuryStart)+vals(S.transactions).reduce((s,t)=>s+(t.type=="in"?1:-1)*num(t.montant),0)}
V.finances=()=>{const T=[];if(can("fin.view"))T.push(["tresor","Trésorerie"]);if(can("fin.bill")||can("fin.view"))T.push(["fact","Factures & amendes"]);if(can("fin.decl")||can("fin.view"))T.push(["decl","Déclarations fiscales"]);if(can("fin.budget")||can("fin.view"))T.push(["budget","Budgets & fiscalité"]);
 const s=T.some(t=>t[0]==sub)?sub:T[0][0];let h=`<div class="ph"><h2>Finances publiques</h2></div>${tabsH(T,s)}`;
 const X=vals(S.transactions),inS=X.filter(t=>t.type=="in").reduce((a,t)=>a+num(t.montant),0),outS=X.filter(t=>t.type=="out").reduce((a,t)=>a+num(t.montant),0),due=vals(S.factures).filter(f=>f.st=="due");
 if(s=="tresor"){let L=X;if(filt.tt)L=L.filter(t=>t.type==filt.tt);if(filt.tc)L=L.filter(t=>t.cat==filt.tc);if(filt.td)L=L.filter(t=>t.dept==filt.td);L=L.filter(t=>match(filt.tq,t.label,t.cat,t.dept)).sort((a,b)=>b.t-a.t);
  return h+`<div class="kpis">${kpi("Solde du Trésor",money(treasury()),"gold")}${kpi("Recettes",money(inS))}${kpi("Dépenses",money(outS))}${kpi("Créances impayées",money(due.reduce((a,f)=>a+num(f.montant),0)))}</div>
  ${can("fin.edit")?`<div class="card"><h3>Saisir une opération</h3><div class="form"><label class="f">Sens<select id="ft">${opts([["in","Recette"],["out","Dépense"]])}</select></label><label class="f">Catégorie<select id="fc">${opts(CATS)}</select></label><label class="f">Département<select id="fdp">${opts(["Général"].concat(DEPTS()))}</select></label><label class="f">Montant ($)<input id="fm" type="number" min="0"></label><label class="f full">Libellé<input id="fl"></label></div><button class="btn" onclick="addTx()">Enregistrer</button><p class="err" id="msg"></p></div>`:""}
  <div class="card inl">${search("tq","Libellé…")}${fsel("tt",[["in","Recettes"],["out","Dépenses"]],"Recettes et dépenses")}${fsel("tc",CATS,"Toutes catégories")}${fsel("td",["Général"].concat(DEPTS()),"Tous départements")}</div>
  <div class="card tw"><table><tr><th>Date<th>Libellé<th>Catégorie<th>Département<th>Saisi par<th class="r">Montant<th></tr>${L.slice(0,300).map(t=>`<tr><td class="nw">${fd(t.t)}<td>${esc(t.label)}<td>${esc(t.cat)}<td>${esc(t.dept||"—")}<td>${esc(t.byNom||"")}<td class="r b nw" style="color:var(--${t.type=="in"?"ok":"no"})">${t.type=="in"?"+":"−"} ${money(t.montant)}<td>${can("fin.edit")?`<button class="btn gh sm" onclick="delTx('${t.id}')">×</button>`:""}</tr>`).join("")||`<tr><td colspan="7" class="empty">Aucune opération.</td></tr>`}</table></div>`}
 if(s=="fact"){let L=vals(S.factures);if(filt.fs)L=L.filter(f=>f.st==filt.fs);if(filt.fk)L=L.filter(f=>f.kind==filt.fk);L=L.filter(f=>match(filt.fq,f.num,f.entNom,f.motif)).sort((a,b)=>b.t-a.t);
  return h+(can("fin.bill")?`<div class="card"><h3>Émettre une facture ou une amende</h3><div class="form"><label class="f">Nature<select id="bk">${opts([["facture","Facture"],["amende","Amende"],["taxe","Impôt / taxe"]])}</select></label>
  <label class="f">Destinataire (compte entreprise)<select id="be"><option value="">— Personne / entité sans compte —</option>${vals(S.users).filter(u=>u.role=="entreprise").map(u=>`<option value="${u.id}">${esc(u.nom)}</option>`).join("")}</select></label>
  <label class="f">ou nom du destinataire<input id="bn" placeholder="Si pas de compte"></label><label class="f">Montant ($)<input id="bm" type="number" min="0"></label><label class="f">Échéance<input id="bd" type="date"></label><label class="f">Département<select id="bdp">${opts(DEPTS(),"Finances")}</select></label><label class="f full">Motif<input id="bmo"></label></div><button class="btn" onclick="addBill()">Émettre</button><p class="err" id="msg"></p></div>`:"")+
  `<div class="card inl">${search("fq","N°, destinataire, motif…")}${fsel("fs",Object.entries(FST).map(([k,v])=>[k,v[0]]),"Tous statuts")}${fsel("fk",[["facture","Factures"],["amende","Amendes"],["taxe","Impôts"]],"Toutes natures")}</div>
  <div class="card tw"><table><tr><th>N°<th>Nature<th>Destinataire<th>Motif<th class="r">Montant<th>Échéance<th>Statut<th></tr>${L.map(f=>`<tr><td class="nw">${esc(f.num)}<td>${kindL(f.kind)}<td>${esc(f.entNom)}<td>${esc(f.motif)}<td class="r b nw">${money(f.montant)}<td>${fdd(f.ech)}${f.st=="due"&&f.ech&&f.ech<new Date().toISOString().slice(0,10)?' <span class="bdg no">Retard</span>':""}<td>${bdg(FST,f.st)}<td class="nw">${can("fin.bill")&&f.st=="due"?`<button class="btn sm ok" onclick="payFact('${f.id}')">Encaisser</button> <button class="btn sm gh" onclick="cancelFact('${f.id}')">Annuler</button>`:""}</tr>`).join("")||`<tr><td colspan="8" class="empty">Aucune facture.</td></tr>`}</table></div>`}
 if(s=="decl"){const L=vals(S.declarations).sort((a,b)=>(a.st=="validee")-(b.st=="validee")||b.t-a.t);
  return h+`<div class="card tw"><table><tr><th>Date<th>Entreprise<th>Période<th class="r">CA déclaré<th>Taux<th class="r">Impôt<th>Statut<th></tr>${L.map(d=>`<tr><td class="nw">${fd(d.t)}<td>${esc(d.entNom)}<td>${esc(d.periode)}<td class="r">${money(d.ca)}<td>${d.taux} %<td class="r b">${money(d.impot)}<td>${d.st=="validee"?'<span class="bdg ok">Validée</span>':'<span class="bdg wa">À vérifier</span>'}<td>${can("fin.decl")&&d.st!="validee"?`<button class="btn sm ok" onclick="validDecl('${d.id}')">Valider</button>`:""}</tr>`).join("")||`<tr><td colspan="8" class="empty">Aucune déclaration.</td></tr>`}</table></div>`}
 const B=S.config.budgets||{},ed=can("fin.budget");
 return h+`<div class="card"><h3>Fiscalité</h3><div class="inl"><label class="f">Taux d'imposition sur le CA (%)<input id="ctax" type="number" min="0" max="100" step="0.5" value="${num(S.config.tax)}" ${ed?"":"disabled"} style="width:120px"></label>${ed?`<button class="btn sec sm" onclick="setTax()">Appliquer</button>`:""}</div></div>
 <div class="card tw"><h3>Budgets par département</h3><table><tr><th>Département<th class="r">Budget alloué<th class="r">Dépensé<th style="width:30%">Consommation<th class="r">Reste</tr>${DEPTS().map((d,i)=>{const b=num(B[d]),sp=X.filter(t=>t.type=="out"&&t.dept==d).reduce((a,t)=>a+num(t.montant),0),p=b?Math.min(100,sp/b*100):0;
  return `<tr><td>${esc(d)}<td class="r">${ed?`<input type="number" min="0" value="${b}" onchange="setBudget(${i},this.value)">`:money(b)}<td class="r">${money(sp)}<td><div class="bar"><i class="${b&&sp>b?"over":""}" style="width:${b?p:0}%"></i></div><td class="r ${b-sp<0?"":"b"}" style="${b-sp<0?"color:var(--no)":""}">${money(b-sp)}</tr>`}).join("")}</table></div>`};
const CATS=["Impôts","Amendes","Factures","Salaires","Subventions","Fonctionnement","Investissement","Sécurité","Événements","Autre"];

/* =================== ANNONCES & MESSAGERIE =================== */
V.annonces=()=>`<div class="ph"><h2>Annonces officielles</h2></div>${can("com.post")?`<div class="card"><h3>Publier une annonce</h3><div class="form"><label class="f full">Titre<input id="at1" maxlength="120"></label><label class="f full">Contenu<textarea id="at2" rows="4"></textarea></label>
 <label class="f">Destinataires<select id="at3">${opts([["all","Tout le monde"],["agents","Tous les agents"],["entreprises","Entreprises"]].concat(DEPTS().map(d=>[d,"Département "+d])))}</select></label><label class="ck" style="margin-top:22px"><input type="checkbox" id="at4"><span>Épingler en haut</span></label></div><button class="btn" onclick="addAnn()">Publier</button><p class="err" id="msg"></p></div>`:""}
 ${visibleAnn().map(annCard).join("")||`<div class="card">${empty("Aucune annonce.")}</div>`}`;
function convs(){const m=meId,o={};vals(S.messages).forEach(x=>{if(x.from!=m&&x.to!=m)return;const w=x.from==m?x.to:x.from;if(!o[w])o[w]={w,last:0,n:0,txt:""};if(x.t>o[w].last){o[w].last=x.t;o[w].txt=x.txt}if(x.to==m&&!x.read)o[w].n++});return Object.values(o).sort((a,b)=>b.last-a.last)}
V.messages=()=>{const C=convs(),me=ME();if(!convWith&&C.length)convWith=C[0].w;
 const rec=vals(S.users).filter(u=>u.id!=meId&&u.active!==false&&(me.role!="entreprise"||isAgent(u))).sort((a,b)=>a.nom.localeCompare(b.nom));
 const M=convWith?vals(S.messages).filter(x=>(x.from==meId&&x.to==convWith)||(x.to==meId&&x.from==convWith)).sort((a,b)=>a.t-b.t):[];
 const toRead=M.filter(x=>x.to==meId&&!x.read);if(toRead.length&&view=="messages"){const up={};toRead.forEach(x=>up[x.id+"/read"]=true);setTimeout(()=>DBX.update("messages",up),0)}
 const w=convWith&&U(convWith);
 return `<div class="ph"><h2>Messagerie</h2><div class="inl"><select id="mto" style="max-width:280px"><option value="">Nouvelle conversation avec…</option>${rec.map(u=>`<option value="${u.id}">${esc(u.nom)} — ${esc(gname(u))}${u.dept?" ("+esc(u.dept)+")":""}</option>`).join("")}</select><button class="btn sec" onclick="if(val('mto')){convWith=val('mto');keep.mto='';render()}">Ouvrir</button></div></div>
 <div class="msgs"><div class="conv">${C.map(c=>`<div class="ci ${c.w==convWith?"on":""}" onclick="convWith='${c.w}';render()"><div class="inl" style="justify-content:space-between"><b>${esc(uname(c.w))}</b>${c.n?`<span class="bdg no">${c.n}</span>`:""}</div><div class="mu" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.txt)}</div></div>`).join("")||`<div class="empty">Aucune conversation.</div>`}</div>
 <div class="thread">${w?`<div style="padding:12px 14px;border-bottom:1px solid var(--bd)"><b>${esc(w.nom)}</b> <span class="mu">· ${esc(gname(w))}${w.dept?" · "+esc(w.dept):""}</span></div><div class="body">${M.map(x=>`<div class="bub ${x.from==meId?"me":""}">${esc(x.txt)}<div class="mu sm" style="margin-top:2px">${fd(x.t)}${x.from==meId&&x.read?" · lu":""}</div></div>`).join("")||`<div class="empty">Démarrez la conversation.</div>`}</div>

 return `<div class="ph"><h2>Annuaire des agents</h2></div><div class="card inl">${search("uq","Nom, grade, matricule…")}${fsel("ud",DEPTS(),"Tous départements")}</div>

/* =================== PERSONNEL =================== */
function payInfo(u){const g=G(u)||{},since=u.paidAt||0,s=u.svc||{};
 const nd=vals(S.dossiers).filter(d=>d.by==u.id&&(d.st=="ok"||d.st=="no")&&(d.tt||0)>since).length;
 const ms=(s.acc||0)+(s.on?Date.now()-Math.max(s.since||0,since):0);const h=ms/36e5;
 const pd=num(g.perDossier),ph=num(g.perHour),fx=num(g.fixe),bo=num(u.bonus);
 return {nd,ms,h,pd,ph,fx,bo,total:Math.round(nd*pd+h*ph+fx+bo)}}
function scopeUsers(){return vals(S.users).filter(u=>u.id==meId||isDir()||manageable(u)||(can("rh.view")&&u.dept==ME().dept&&ME().dept))}
V.personnel=()=>{const T=[];if(can("rh.view"))T.push(["comptes","Comptes"]);if(can("rh.grades")||isDir())T.push(["grades","Grades & permissions"]);if(can("rh.pay.view"))T.push(["paie","Salaires"]);
 const s=T.some(t=>t[0]==sub)?sub:T[0][0];let h=`<div class="ph"><h2>Gestion du personnel</h2></div>${tabsH(T,s)}`;
 if(s=="comptes"){const dir=isDir(),rs=dir?Object.keys(ROLES):["entreprise","fonctionnaire"],cr=keep.cr||rs[0],cd=dir?(keep.cd||""):ME().dept;
  const gl=vals(S.grades).filter(g=>g.role==cr&&(!g.dept||!cd||g.dept==cd)&&(dir||g.role=="fonctionnaire")).sort((a,b)=>(a.rank||0)-(b.rank||0));
  let L=scopeUsers().filter(u=>u.id!=meId);if(filt.pr)L=L.filter(u=>u.role==filt.pr);if(filt.pd)L=L.filter(u=>u.dept==filt.pd);L=L.filter(u=>match(filt.pq,u.nom,u.login,u.matricule,gname(u))).sort((a,b)=>a.nom.localeCompare(b.nom));
  return h+(can("rh.create")?`<div class="card"><h3>Créer un compte</h3><div class="form"><label class="f">Nom affiché<input id="cn" placeholder="Ex. : John Smith / Bean Machine"></label><label class="f">Identifiant<input id="cl" autocomplete="off"></label><label class="f">Mot de passe provisoire<input id="cp" autocomplete="off"></label>
  <label class="f">Rôle<select id="cr" onchange="keep.cr=this.value;render()">${opts(rs.map(r=>[r,ROLES[r]]),cr)}</select></label>
  ${cr=="fonctionnaire"||cr=="encadrement"?`<label class="f">Département${dir?`<select id="cd" onchange="keep.cd=this.value;render()">${opts([["","— Choisir —"]].concat(DEPTS().map(d=>[d,d])),cd)}</select>`:`<input value="${esc(cd)}" disabled>`}</label>`:""}
  ${cr!="entreprise"?`<label class="f">Grade<select id="cg"><option value="">— Aucun —</option>${gl.map(g=>`<option value="${g.id}">${esc(g.name)}${g.dept?" ("+esc(g.dept)+")":""}</option>`).join("")}</select></label><label class="f">Matricule<input id="cm" placeholder="Ex. : JUS-014"></label>`:""}
  <label class="f">Téléphone<input id="ct"></label></div><button class="btn" onclick="addUser()">Créer le compte</button><p class="err" id="msg"></p><p class="mu sm">L'utilisateur devra changer son mot de passe à la première connexion.</p></div>`:"")+
  `<div class="card inl">${search("pq","Nom, identifiant, grade…")}${fsel("pr",Object.entries(ROLES),"Tous rôles")}${fsel("pd",DEPTS(),"Tous départements")}</div>
  <div class="card tw"><table><tr><th>Nom<th>Identifiant<th>Rôle<th>Grade<th>Département<th>État<th></tr>${L.map(u=>`<tr><td class="b">${esc(u.nom)}<td>${esc(u.login)}<td>${esc(ROLES[u.role])}<td>${esc(G(u)?G(u).name:"—")}<td>${esc(u.dept||"—")}<td>${u.active===false?'<span class="bdg no">Suspendu</span>':'<span class="bdg ok">Actif</span>'}<td class="nw">${manageable(u)&&can("rh.edit")?`<button class="btn sec sm" onclick="openM('user','${u.id}')">Modifier</button>`:""} ${manageable(u)&&can("rh.delete")?`<button class="btn gh sm" onclick="delUser('${u.id}')">Supprimer</button>`:""}</tr>`).join("")||`<tr><td colspan="7" class="empty">Aucun compte.</td></tr>`}</table></div>`}
 if(s=="grades"){const L=vals(S.grades).filter(g=>isDir()||g.role=="fonctionnaire"&&(g.dept==ME().dept)||g.dept==ME().dept).sort((a,b)=>Object.keys(ROLES).indexOf(b.role)-Object.keys(ROLES).indexOf(a.role)||(a.rank||0)-(b.rank||0));
  return h+`<div class="card inl" style="justify-content:space-between"><span class="mu">Un grade précise un rôle : il fixe l'intitulé, la rémunération et les permissions exactes de l'agent.</span><button class="btn" onclick="openM('grade')">${ic("plus")}Nouveau grade</button></div>
  <div class="card tw"><table><tr><th>Grade<th>Rôle<th>Département<th>Permissions<th class="r">Par dossier<th class="r">Par heure<th class="r">Fixe<th>Agents<th></tr>${L.map(g=>`<tr><td><span class="bdg" style="color:${esc(g.color||"var(--gold2)")}">${esc(g.name)}</span><td>${esc(ROLES[g.role])}<td>${esc(g.dept||"Tous")}<td>${g.role=="direction"?"Toutes":Object.keys(g.perms||{}).filter(k=>g.perms[k]).length}<td class="r">${money(g.perDossier)}<td class="r">${money(g.perHour)}<td class="r">${money(g.fixe)}<td>${vals(S.users).filter(u=>u.gradeId==g.id).length}<td class="nw">${gradeEditable(g)?`<button class="btn sec sm" onclick="openM('grade','${g.id}')">Modifier</button>`:""}</tr>`).join("")||`<tr><td colspan="9" class="empty">Aucun grade.</td></tr>`}</table></div>`}
 const L=vals(S.users).filter(u=>isAgent(u)&&(isDir()||manageable(u))).sort((a,b)=>(a.dept||"").localeCompare(b.dept||"")||a.nom.localeCompare(b.nom)),P=L.map(u=>[u,payInfo(u)]);
 const hist=vals(S.transactions).filter(t=>t.cat=="Salaires"&&t.user).sort((a,b)=>b.t-a.t).slice(0,40);
 return h+`<div class="kpis">${kpi("Masse salariale due",money(P.reduce((s,[u,p])=>s+p.total,0)),"gold")}${kpi("Agents",L.length)}${kpi("Solde du Trésor",can("fin.view")?money(treasury()):"—")}</div>
 <div class="card tw"><div class="inl" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Salaires de la période</h3>${can("rh.pay.do")?`<button class="btn" onclick="payAll()">Verser tous les salaires</button>`:""}</div>
 <table><tr><th>Agent<th>Grade<th>Dossiers<th>Heures<th class="r">Fixe<th>Prime / ajustement<th class="r">Total<th>Dernier versement<th></tr>${P.map(([u,p])=>`<tr><td class="b">${esc(u.nom)}<div class="mu">${esc(u.dept||"")}</div><td>${esc(gname(u))}<td>${p.nd} × ${money(p.pd)}<td>${p.h.toFixed(1)} h × ${money(p.ph)}<td class="r">${money(p.fx)}<td>${can("rh.pay.edit")?`<input type="number" value="${num(u.bonus)}" onchange="setBonus('${u.id}',this.value)">`:money(p.bo)}<td class="r b">${money(p.total)}<td class="nw">${u.paidAt?fd(u.paidAt):"—"}<td>${can("rh.pay.do")&&p.total>0?`<button class="btn ok sm" onclick="payUser('${u.id}')">Verser</button>`:""}</tr>`).join("")||`<tr><td colspan="9" class="empty">Aucun agent.</td></tr>`}</table></div>
 <div class="card tw"><h3>Historique des versements</h3><table><tr><th>Date<th>Agent<th>Détail<th class="r">Montant<th>Par</tr>${hist.map(t=>`<tr><td class="nw">${fd(t.t)}<td>${esc(uname(t.user))}<td class="mu">${esc(t.label)}<td class="r b">${money(t.montant)}<td>${esc(t.byNom)}</tr>`).join("")||`<tr><td colspan="5" class="empty">Aucun versement.</td></tr>`}</table></div>`};
function permBoxes(prefix,cur,lockOwn){return PERMS.map(([gn,ps])=>`<div class="pgrp"><h4>${gn}</h4><div class="pl">${ps.map(([k,l])=>{const dis=lockOwn&&!can(k);return `<label class="ck"><input type="checkbox" id="${prefix}${k.replace(/\./g,"_")}" ${cur&&cur[pk(k)]?"checked":""} ${dis?"disabled":""}><span>${esc(l)}</span></label>`}).join("")}</div></div>`).join("")}
function readPerms(prefix,base,lockOwn){const o={};ALLP.forEach(k=>{const e=document.getElementById(prefix+k.replace(/\./g,"_"));if(!e)return;if(lockOwn&&!can(k)){if(base&&base[pk(k)])o[pk(k)]=true;return}if(e.checked)o[pk(k)]=true});return o}
function MGrade(){const g=modal.id?S.grades[modal.id]:{role:"fonctionnaire",dept:isDir()?"":ME().dept,perms:{},color:"#c9a24a"};if(modal.id&&!g)return null;const dir=isDir();const role=keep.gr||g.role;
 return {title:modal.id?"Modifier le grade":"Nouveau grade",body:`<div class="form"><label class="f">Intitulé du grade<input id="gn" value="${esc(g.name||"")}" placeholder="Ex. : Ministre de la Justice"></label>
 <label class="f">Rôle associé<select id="gr" onchange="keep.gr=this.value;render()" ${dir?"":"disabled"}>${opts(Object.entries(ROLES).filter(r=>r[0]!="entreprise"),role)}</select></label>
 <label class="f">Département<select id="gd" ${dir?"":"disabled"}>${opts([["","Tous"]].concat(DEPTS().map(d=>[d,d])),g.dept||"")}</select></label><label class="f">Couleur<input id="gc" type="color" value="${esc(g.color||"#c9a24a")}"></label>
 <label class="f">Salaire par dossier traité ($)<input id="gpd" type="number" min="0" value="${num(g.perDossier)}"></label><label class="f">Salaire par heure de service ($)<input id="gph" type="number" min="0" value="${num(g.perHour)}"></label><label class="f">Salaire fixe par période ($)<input id="gfx" type="number" min="0" value="${num(g.fixe)}"></label><label class="f">Ordre hiérarchique (0 = plus haut)<input id="grk" type="number" min="0" value="${num(g.rank)}"></label></div>
 ${role=="direction"?`<p class="mu">Le rôle Direction dispose automatiquement de toutes les permissions.</p>`:`<h4>Permissions du grade</h4>${!dir?`<p class="mu sm">Vous ne pouvez accorder que les permissions dont vous disposez.</p>`:""}${permBoxes("gp_",g.perms,!dir)}`}<p class="err" id="msg"></p>`,
 foot:`${modal.id&&(dir||gradeEditable(g))?`<button class="btn gh" onclick="delGrade('${modal.id}')">Supprimer</button>`:""}<button class="btn sec" onclick="closeM()">Annuler</button><button class="btn" onclick="saveGrade('${modal.id||""}')">Enregistrer</button>`}}
function MUser(u){if(!u||!manageable(u))return null;const dir=isDir();const role=keep.er||u.role,dept=dir?(keep.ed??u.dept??""):u.dept;
 const gl=vals(S.grades).filter(g=>g.role==role&&(!g.dept||!dept||g.dept==dept)&&(dir||g.role=="fonctionnaire"));
 return {title:"Modifier — "+esc(u.nom),body:`<div class="form"><label class="f">Nom affiché<input id="en" value="${esc(u.nom)}"></label><label class="f">Identifiant<input value="${esc(u.login)}" disabled></label>
 <label class="f">Rôle<select id="er" onchange="keep.er=this.value;render()" ${dir?"":"disabled"}>${opts(Object.entries(ROLES),role)}</select></label>
 ${role=="fonctionnaire"||role=="encadrement"?`<label class="f">Département<select id="ed" onchange="keep.ed=this.value;render()" ${dir?"":"disabled"}>${opts([["","— Choisir —"]].concat(DEPTS().map(d=>[d,d])),dept)}</select></label>`:""}
 ${role!="entreprise"?`<label class="f">Grade<select id="eg"><option value="">— Aucun —</option>${gl.map(g=>`<option value="${g.id}" ${g.id==u.gradeId?"selected":""}>${esc(g.name)}</option>`).join("")}</select></label><label class="f">Matricule<input id="em" value="${esc(u.matricule||"")}"></label>`:""}

 foot:`<button class="btn sec" onclick="closeM()">Annuler</button><button class="btn" onclick="saveUser('${u.id}')">Enregistrer</button>`}}
V.salaire=()=>{const u=ME(),p=payInfo(u),H=vals(S.transactions).filter(t=>t.cat=="Salaires"&&t.user==u.id).sort((a,b)=>b.t-a.t);
