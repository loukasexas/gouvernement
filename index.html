  all.forEach(c=>{let r=db.ref(ROOT+"/"+c);if(c=="logs"||c=="messages")r=r.limitToLast(c=="logs"?800:1500);
   r.on("value",s=>{S[c]=s.val()||{};if(!loaded.has(c)){loaded.add(c);if(loaded.size==all.length)boot()}schedule()},

function sealSvg(){return `<svg viewBox="0 0 200 200" role="img" aria-label="Sceau"><defs><path id="sc" d="M100,100 m-74,0 a74,74 0 1,1 148,0 a74,74 0 1,1 -148,0"/></defs>
<circle cx="100" cy="100" r="97" fill="#0d1628" stroke="#c9a24a" stroke-width="5"/><circle cx="100" cy="100" r="86" fill="none" stroke="#c9a24a" stroke-width="1.5"/><circle cx="100" cy="100" r="58" fill="#132443" stroke="#c9a24a" stroke-width="2"/>
<text font-family="Cinzel,Georgia,serif" font-size="15" font-weight="700" fill="#e5c97a" letter-spacing="2.5"><textPath href="#sc" startOffset="0">GOUVERNEMENT DE LOS SANTOS • SAN ANDREAS •</textPath></text>
<path d="M100 56l10.6 21.5 23.7 3.4-17.1 16.7 4 23.6L100 110l-21.2 11.2 4-23.6-17.1-16.7 23.7-3.4z" fill="#c9a24a"/>
<path d="M62 132q38 22 76 0" fill="none" stroke="#c9a24a" stroke-width="3"/><text x="100" y="150" text-anchor="middle" font-family="Cinzel,Georgia,serif" font-size="11" fill="#e5c97a" letter-spacing="2">MCMLXXXV</text></svg>`}
</script>
<script>
/* =================== STRUCTURE =================== */
function page(){
 if(bootErr&&!ready)return `<div class="login"><div class="box"><div class="seal">${seal()}</div><div class="card"><h3>Connexion à la base impossible</h3><p class="err">${esc(bootErr)}</p></div></div></div>`;
 if(!ready)return `<div class="login"><div class="box"><div class="seal">${seal()}</div><p class="mu">Connexion au serveur gouvernemental…</p></div></div>`;
 const u=ME();
 if(!u||u.active===false){meId=null;return loginPage()+modalH()}
 if(u.mustChange)return pwChangePage();
 const mt=S.config.maintenance||{};
 if(mt.on&&!isDir()&&!can("adm.site"))return `<div class="login"><div class="box"><div class="seal">${seal()}</div><div class="card"><h3>Maintenance en cours</h3><p class="pre">${esc(mt.msg||"L'intranet est temporairement indisponible.")}</p><button class="btn sec" onclick="logout()">Se déconnecter</button></div></div></div>`;
 const N=navItems();if(!N.some(n=>n[0]==view))view=N[0][0];
 const bn=S.config.banner||{};
 return `<div class="app"><div class="scrim" onclick="closeSide()"></div><aside class="side"><div class="brand">${seal()}<div><div class="t1">${esc(S.config.siteName||"Gouvernement de Los Santos")}</div><div class="t2">${esc(S.config.subtitle||"Intranet officiel")}</div></div></div>
 <nav class="nav">${N.map(([k,l,i,c])=>`<button class="${k==view?"on":""}" onclick="go('${k}')">${ic(i)}<span>${l}</span>${c?`<span class="cnt">${c}</span>`:""}</button>`).join("")}
 <button onclick="logout()">${ic("logout")}<span>Déconnexion</span></button></nav>
 <div class="side-foot">${DB_URL?(connected?'<span class="dot ok"></span>Synchronisé':'<span class="dot no"></span>Hors ligne — reconnexion…'):'<span class="dot"></span>Mode local (non partagé)'}</div></aside>
 <div class="wrap"><div class="top"><button class="burger" onclick="openSide()" aria-label="Menu">${ic("menu").replace("<svg",'<svg width="20" height="20"')}</button>
 <div class="who"><div class="b">${esc(u.nom)}</div><div class="mu">${esc(gname(u))}${u.dept?" · "+esc(u.dept):""}</div></div>
 <button class="btn gh sm" onclick="toggleTheme()" title="Thème clair / sombre" aria-label="Changer de thème">${ic("sun").replace("<svg",'<svg width="16" height="16"')}</button></div>
 ${bn.on&&bn.txt?`<div class="ticker ${esc(bn.lvl||"info")}">${tickerSpan(bn.txt)}</div>`:""}
 <main>${(V[view]||V.accueil)()}</main></div></div>${modalH()}`;
}
/* Le bandeau suit l'horloge : il reprend là où il en était après chaque changement de page */
function tickerSpan(t){const d=Math.max(20,Math.round(14+String(t).length*.2)),ph=(Date.now()/1000)%d;return `<span style="animation-duration:${d}s;animation-delay:-${ph.toFixed(2)}s">${esc(t)}</span>`}
function navItems(){const u=ME(),n=unread(),I=[];
 if(u.role=="entreprise"){const imp=vals(S.factures).filter(f=>f.ent==u.id&&f.st=="due").length;
  return [["accueil","Accueil","home"],["demande","Nouvelle demande","plus"],["mesdem","Mes demandes","folder"],["factures","Factures & impôts","wallet",imp],["annonces","Annonces","megaphone"],["messages","Messagerie","mail",n],["profil","Mon profil","user"]]}
 I.push(["accueil","Accueil","home"]);
 if(can("dos.view")){const p=vals(S.dossiers).filter(d=>myDepts().includes(d.dept)&&d.st=="attente").length;I.push(["dossiers","Dossiers","folder",p])}
 if(can("jus.view"))I.push(["justice","Justice","scale"]);
 if(secOk())I.push(["securite","Sécurité","eye"]);
 if(["reg.ent.view","reg.civ.view"].some(can))I.push(["registres","Registres","book"]);
 if(["fin.view","fin.bill","fin.decl","fin.budget"].some(can))I.push(["finances","Finances","coins",canBill()?vals(S.factures).filter(f=>f.st=="verif").length:0]);
 I.push(["annonces","Annonces","megaphone"],["messages","Messagerie","mail",n]);
 if(can("annuaire"))I.push(["annuaire","Annuaire","users"]);
 if(["rh.view","rh.grades"].some(can))I.push(["personnel","Personnel","shield"]);
 I.push(["salaire","Salaire","wallet",(can("pay.all")||isDir())?vals(S.paie).filter(p=>p&&p.st=="soumise").length:0]);
 if(can("log.dept")||can("log.all"))I.push(["journal","Logs","list"]);
 if(can("adm.site")||can("com.banner"))I.push(["admin","Administration","settings"]);
 I.push(["profil","Mon profil","user"]);
 return I}
function loginPage(){const mt=S.config.maintenance||{};
 return `<div class="login"><div class="box"><div class="seal">${seal()}</div><h1 class="serif" style="font-size:22px;color:var(--gold2)">${esc(S.config.siteName||"Gouvernement de Los Santos")}</h1><div class="mu">${esc(S.config.subtitle||"Intranet officiel")}</div>
 <div class="card"><h3>Accès sécurisé</h3><p class="mu" style="margin-top:-4px">Réservé aux agents de l'État et aux entreprises enregistrées.</p>
 ${mt.on?`<p class="bdg wa" style="margin-bottom:10px">Maintenance en cours</p>`:""}
 <label class="f">Identifiant<input id="li" autocomplete="username" onkeydown="if(event.key=='Enter')$('#lp').focus()"></label>
 <label class="f">Mot de passe<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"></label>
 <button class="btn" style="width:100%;justify-content:center" onclick="login()">Se connecter</button><p class="err" id="msg"></p>
 ${!DB_URL?`<p class="mu sm">Mode local : les données restent dans ce navigateur.</p>`:""}</div></div></div>`}
function pwChangePage(){return `<div class="login"><div class="box"><div class="seal">${seal()}</div><div class="card"><h3>Définissez votre mot de passe</h3><p class="mu">Première connexion ou mot de passe réinitialisé : choisissez un nouveau mot de passe personnel.</p>
 <label class="f">Nouveau mot de passe<input id="np1" type="password" autocomplete="new-password"></label><label class="f">Confirmation<input id="np2" type="password" autocomplete="new-password" onkeydown="if(event.key=='Enter')forcePw()"></label>
 <button class="btn" onclick="forcePw()">Valider</button> <button class="btn gh" onclick="logout()">Annuler</button><p class="err" id="msg"></p></div></div></div>`}

const V={};
const kpi=(l,v,c)=>`<div class="kpi"><div class="l">${l}</div><div class="v ${c||""}">${v}</div></div>`;
const empty=t=>`<div class="empty">${t}</div>`;
function tabsH(list,cur){return `<div class="tabs">${list.map(([k,l])=>`<button class="${k==cur?"on":""}" onclick="setSub('${k}')">${l}</button>`).join("")}</div>`}
function search(key,ph){return `<input id="q_${key}" placeholder="${ph||"Rechercher…"}" value="${esc(filt[key]||"")}" oninput="filt['${key}']=this.value;render()" style="max-width:260px">`}
function fsel(key,list,all){return `<select id="s_${key}" onchange="filt['${key}']=this.value;render()"><option value="">${all}</option>${opts(list,filt[key]||"")}</select>`}
const match=(q,...f)=>!q||f.join(" ").toLowerCase().includes(q.toLowerCase());
function visibleAnn(){const u=ME();return vals(S.annonces).filter(a=>{if(u.role=="entreprise")return a.cible=="all"||a.cible=="entreprises";if(isDir()||can("com.post"))return true;return a.cible=="all"||a.cible=="agents"||a.cible==u.dept}).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.t-a.t)}
function annCard(a){return `<div class="card ann ${a.pin?"pin":""}"><div class="inl" style="justify-content:space-between"><h3 style="margin:0">${a.pin?"📌 ":""}${esc(a.titre)}</h3>${(can("com.post")&&(isDir()||a.by==meId))?`<button class="btn gh sm" onclick="delAnn('${a.id}')">Supprimer</button>`:""}</div>
 <div class="mu" style="margin:4px 0 8px">${esc(a.nom)} · ${fd(a.t)} · ${a.cible=="all"?"Tous":a.cible=="agents"?"Tous les agents":a.cible=="entreprises"?"Entreprises":esc(a.cible)}</div><div class="pre">${esc(a.txt)}</div></div>`}

/* =================== ACCUEIL =================== */
V.accueil=()=>{const u=ME();
 if(u.role=="entreprise"){const D=vals(S.dossiers).filter(d=>d.ent==u.id),F=vals(S.factures).filter(f=>f.ent==u.id&&f.st=="due"),E=vals(S.entreprises).filter(e=>e.compte==u.id);
  return `<div class="ph"><h2>Bienvenue, ${esc(u.nom)}</h2><button class="btn" onclick="go('demande')">${ic("plus")}Nouvelle demande</button></div>
  <div class="kpis">${kpi("Demandes en cours",D.filter(d=>d.st=="attente"||d.st=="cours").length)}${kpi("Demandes acceptées",D.filter(d=>d.st=="ok").length)}${kpi("Factures à régler",F.length,F.length?"":"")}${kpi("Montant dû",money(F.reduce((s,f)=>s+num(f.montant),0)),"gold")}</div>
  ${E.length?`<div class="card"><h3>Mon entreprise au registre</h3><div class="tw"><table><tr><th>Entreprise<th>Type<th>Gérant<th>Enregistrée le</tr>${E.map(e=>`<tr><td>${esc(e.nom)}<td>${esc(e.type||"—")}<td>${esc(((e.gerantPrenom||"")+" "+(e.gerantNom||e.gerant||"")).trim()||"—")}<td>${fdd(e.dateEnr)}</tr>`).join("")}</table></div></div>`:""}
  <div class="grid g2"><div><h4>Annonces</h4>${visibleAnn().slice(0,4).map(annCard).join("")||`<div class="card">${empty("Aucune annonce.")}</div>`}</div>
  <div><h4>Demandes récentes</h4><div class="card">${D.sort((a,b)=>b.t-a.t).slice(0,6).map(d=>`<div class="inl" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);cursor:pointer" onclick="openM('dossier','${d.id}')"><span>${esc(d.objet)}<div class="mu">${esc(d.num)} · ${esc(d.dept)}</div></span>${bdg(DST,d.st)}</div>`).join("")||empty("Aucune demande.")}</div></div></div>`}
 const md=myDepts(),Dall=vals(S.dossiers),ag=vals(S.users).filter(isAgent),pi=payInfo(u);
 const glob=can("dash");
 let h=`<div class="ph"><div><h2>Bonjour, ${esc(u.nom)}</h2><div class="mu">${esc(gname(u))}${u.dept?" · Département "+esc(u.dept):""} · ${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div></div>
 </div>`;
 h+=`<div class="kpis">${kpi("Dossiers en attente"+(glob?"":" (mon dép.)"),Dall.filter(d=>(glob||md.includes(d.dept))&&d.st=="attente").length)}
 ${can("jus.view")?kpi("Affaires en cours",vals(S.affaires).filter(a=>!["jugee","classee"].includes(a.st)).length):kpi("Mes dossiers traités",Dall.filter(d=>d.by==u.id).length)}
 ${can("fin.view")?kpi("Trésorerie",money(treasury()),"gold"):kpi("Salaire en cours",money(pi.total),"gold")}
 ${kpi("Messages non lus",unread())}</div>`;
 h+=`<div class="grid g2"><div><h4>Annonces</h4>${visibleAnn().slice(0,4).map(annCard).join("")||`<div class="card">${empty("Aucune annonce.")}</div>`}</div><div>`;
 if(glob){h+=`<h4>Activité par département</h4><div class="card tw"><table><tr><th>Département<th>Attente<th>En cours<th>Traités</tr>${DEPTS().map(d=>{const f=s=>Dall.filter(x=>x.dept==d&&x.st==s).length;return `<tr><td>${esc(d)}<td>${f("attente")}<td>${f("cours")}<td>${f("ok")+f("no")}</tr>`}).join("")}</table></div>`}
 h+=`</div></div>`;
 return h};

/* =================== SERVICE =================== */
/* =================== DOSSIERS =================== */
function dosList(){const md=myDepts();let L=vals(S.dossiers).filter(d=>md.includes(d.dept));
 if(filt.dd)L=L.filter(d=>d.dept==filt.dd);if(filt.ds)L=L.filter(d=>d.st==filt.ds);if(filt.dm=="me")L=L.filter(d=>d.assign==meId);
 L=L.filter(d=>match(filt.dq,d.num,d.objet,d.entNom,d.type,d.det));
 const pr={haute:0,normale:1,basse:2};return L.sort((a,b)=>((a.st=="attente"||a.st=="cours")?0:1)-((b.st=="attente"||b.st=="cours")?0:1)||(pr[a.prio]||1)-(pr[b.prio]||1)||b.t-a.t)}
V.dossiers=()=>{const md=myDepts(),L=dosList(),u=ME();
 return `<div class="ph"><div><h2>Dossiers administratifs</h2><div class="mu">${md.length==DEPTS().length?"Tous les départements":"Département : "+esc(md.join(", "))}</div></div></div>
 <div class="card inl">${search("dq","N°, objet, entreprise…")}${md.length>1?fsel("dd",md,"Tous les départements"):""}${fsel("ds",Object.entries(DST).map(([k,v])=>[k,v[0]]),"Tous les statuts")}<select id="s_dm" onchange="filt.dm=this.value;render()"><option value="">Tous les dossiers</option><option value="me" ${filt.dm=="me"?"selected":""}>Assignés à moi</option></select></div>
 <div class="card tw"><table><tr><th>N°<th>Objet<th>Demandeur<th>Département<th>Priorité<th>Assigné<th>Statut<th>Déposé</tr>
 ${L.map(d=>`<tr class="click" onclick="openM('dossier','${d.id}')"><td class="nw">${esc(d.num)}<td>${esc(d.objet)}<div class="mu">${esc(d.type||"")}</div><td>${esc(d.entNom)}<td>${esc(d.dept)}<td>${prioB(d.prio)}<td>${d.assign?esc(uname(d.assign)):'<span class="mu">—</span>'}<td>${bdg(DST,d.st)}<td class="nw">${fd(d.t)}</tr>`).join("")||`<tr><td colspan="8" class="empty">Aucun dossier.</td></tr>`}</table></div>`};
const prioB=p=>p=="haute"?'<span class="bdg no">Haute</span>':p=="basse"?'<span class="bdg mu">Basse</span>':'<span class="bdg bl">Normale</span>';
function canTreat(d){const u=ME();if(!can("dos.treat")||!myDepts().includes(d.dept))return false;return true}
function MDossier(d){if(!d)return null;const u=ME(),ent=u.role=="entreprise",open=d.st=="attente"||d.st=="cours",tr=!ent&&canTreat(d);
 const C=vals(d.comments).filter(c=>!ent||!c.internal).sort((a,b)=>a.t-b.t);
 const agentsD=vals(S.users).filter(x=>isAgent(x)&&x.active!==false&&(x.dept==d.dept||x.role=="direction"));
 return {title:`${esc(d.num)} — ${esc(d.objet)}`,body:`<div class="inl" style="margin-bottom:12px">${bdg(DST,d.st)} ${prioB(d.prio)} <span class="bdg mu">${esc(d.dept)}</span></div>
 <div class="kv"><div class="k">Demandeur</div><div>${esc(d.entNom)}</div><div class="k">Type</div><div>${esc(d.type||"—")}</div><div class="k">Déposé le</div><div>${fd(d.t)}</div>${d.assign?`<div class="k">Agent assigné</div><div>${esc(uname(d.assign))}</div>`:""}${!open?`<div class="k">Décision</div><div>${bdg(DST,d.st)} par ${esc(d.byNom)} le ${fd(d.tt)}</div>${d.motif?`<div class="k">Motif</div><div class="pre">${esc(d.motif)}</div>`:""}`:""}</div>
 <div class="card" style="margin:14px 0;background:var(--bg)"><div class="pre">${esc(d.det)}</div></div>
 <h4>Échanges</h4><div class="tl">${C.map(c=>`<div class="it ${c.internal?"note":""}"><b>${esc(c.nom)}</b> <span class="mu">${fd(c.t)}${c.internal?" · note interne":""}</span><div class="pre">${esc(c.txt)}</div></div>`).join("")||`<p class="mu">Aucun échange.</p>`}</div>
 <label class="f">Ajouter un message<textarea id="dc" rows="2"></textarea></label>
 <div class="inl">${!ent?`<label class="ck"><input type="checkbox" id="dci"><span>Note interne (invisible pour l'entreprise)</span></label>`:""}<button class="btn sec sm" onclick="dosComment('${d.id}')">Envoyer</button></div>
 ${tr&&open?`<hr style="border:0;border-top:1px solid var(--bd);margin:16px 0"><h4>Traitement</h4>
 ${can("dos.assign")?`<div class="inl"><select id="das" data-nokeep>${`<option value="">— Non assigné —</option>`+agentsD.map(x=>`<option value="${x.id}" ${x.id==d.assign?"selected":""}>${esc(x.nom)} (${esc(gname(x))})</option>`).join("")}</select><button class="btn sec sm" onclick="dosAssign('${d.id}')">Assigner</button></div>`:""}
 <label class="f">Motif de la décision (visible par le demandeur)<textarea id="dmo" rows="2"></textarea></label>`:""}`,
 foot:`${!ent&&can("dos.delete")?`<button class="btn gh" onclick="dosDel('${d.id}')">Supprimer</button>`:""}${!ent&&d.dept=="Justice"&&can("jus.open")?`<button class="btn sec" onclick="openM('affaireNew',null,{from:'${d.id}'})">Ouvrir une affaire</button>`:""}
 ${tr&&open&&d.st=="attente"?`<button class="btn bl" onclick="dosTake('${d.id}')">Prendre en charge</button>`:""}${tr&&open?`<button class="btn no" onclick="dosTreat('${d.id}','no')">Refuser</button><button class="btn ok" onclick="dosTreat('${d.id}','ok')">Accepter</button>`:""}${tr&&!open?`<button class="btn sec" onclick="dosReopen('${d.id}')">Rouvrir</button>`:""}`}}

/* =================== ESPACE ENTREPRISE =================== */
V.demande=()=>{const d=keep.nd||DEPTS()[0];const types=(DOS_TYPES[d]||[]).concat(["Autre"]);
 return `<div class="ph"><h2>Nouvelle demande</h2></div><div class="card"><div class="form"><label class="f">Département<select id="nd" onchange="keep.nd=this.value;render()">${opts(DEPTS(),d)}</select></label>
 <label class="f">Type de demande<select id="ny">${opts(types)}</select></label><label class="f">Priorité<select id="np">${opts([["normale","Normale"],["haute","Haute"],["basse","Basse"]])}</select></label>
 <label class="f full">Objet<input id="no" maxlength="100" placeholder="Ex. : Licence d'exploitation — Bean Machine Vinewood"></label><label class="f full">Détails<textarea id="nt" rows="6" maxlength="3000" placeholder="Décrivez votre demande, joignez les liens vers vos justificatifs…"></textarea></label></div>
 <button class="btn" onclick="addDem()">Déposer la demande</button><p class="err" id="msg"></p></div>`};
V.mesdem=()=>{const L=vals(S.dossiers).filter(d=>d.ent==meId).sort((a,b)=>b.t-a.t);
 return `<div class="ph"><h2>Mes demandes</h2><button class="btn" onclick="go('demande')">${ic("plus")}Nouvelle demande</button></div><div class="card tw"><table><tr><th>N°<th>Objet<th>Département<th>Statut<th>Déposée<th>Messages</tr>
 ${L.map(d=>`<tr class="click" onclick="openM('dossier','${d.id}')"><td class="nw">${esc(d.num)}<td>${esc(d.objet)}<div class="mu">${esc(d.type||"")}</div><td>${esc(d.dept)}<td>${bdg(DST,d.st)}<td class="nw">${fd(d.t)}<td>${vals(d.comments).filter(c=>!c.internal).length}</tr>`).join("")||`<tr><td colspan="6" class="empty">Aucune demande déposée.</td></tr>`}</table></div>`};
const FST={due:["À payer","wa"],verif:["Paiement à vérifier","bl"],payee:["Payée","ok"],annulee:["Annulée","mu"]};
V.factures=()=>{const u=ME(),F=vals(S.factures).filter(f=>f.ent==u.id&&!f.arch).sort((a,b)=>b.t-a.t),Dc=vals(S.declarations).filter(d=>d.ent==u.id&&!d.arch).sort((a,b)=>b.t-a.t),tx=taxRate(u);
 return `<div class="ph"><h2>Factures & impôts</h2></div><div class="grid g2"><div class="card"><h3>Déclarer mon chiffre d'affaires</h3><p class="mu">Pour régler une facture, effectuez le paiement puis cliquez sur <b>Notifier du paiement</b> en joignant votre preuve : un agent des Finances la vérifiera.</p><p class="mu">Votre type d'entreprise : <b>${esc(taxCatName(u))}</b> · Taux d'imposition applicable : <b>${tx} %</b>. Une facture d'impôt est générée automatiquement.</p>
 <div class="form"><label class="f">Période<input id="dp" placeholder="Ex. : Semaine 40 — 2026"></label><label class="f">Chiffre d'affaires ($)<input id="dca" type="number" min="0" oninput="keep.dca=this.value;document.getElementById('dimp').textContent=money(num(this.value)*${tx}/100)"></label></div>
 <p>Impôt estimé : <b id="dimp">${money(num(keep.dca)*tx/100)}</b></p><button class="btn" onclick="declare()">Envoyer la déclaration</button><p class="err" id="msg"></p></div>
 <div class="card"><h3>Mes déclarations</h3><div class="tw"><table><tr><th>Période<th>CA<th>Impôt<th>Statut</tr>${Dc.map(d=>`<tr><td>${esc(d.periode)}<td>${money(d.ca)}<td>${money(d.impot)}<td>${d.st=="validee"?'<span class="bdg ok">Validée</span>':'<span class="bdg wa">En vérification</span>'}</tr>`).join("")||`<tr><td colspan="4" class="empty">Aucune déclaration.</td></tr>`}</table></div></div></div>

<script>
/* =================== REGISTRES =================== */

 entreprises:{t:"Entreprises",p:"reg.ent",cols:["nom","type","gerantNom","gerantPrenom","tel","mail","dateEnr"],f:[

  {k:"adresse",l:"Adresse"},{k:"tel",l:"Téléphone"},{k:"profession",l:"Profession"},{k:"statut",l:"Situation",type:"select",o:["Célibataire","Marié(e)","Pacsé(e)","Divorcé(e)","Veuf(ve)","Décédé(e)"]},{k:"photo",l:"Photo (lien URL)"},{k:"notes",l:"Mentions marginales",type:"area"}]}
};

function regCanEdit(s){const R=REG[s];if(!R||!can(R.p+".edit"))return false;if(s=="entreprises"){const u=ME();return isDir()||!!(u&&u.dept=="Finances")}return true}
const regLabel=(R,k)=>(R.f.find(x=>x.k==k)||{}).l||k;
function regCell(k,v){if(k=="licSt")return licB(v);if(k=="exp"||k=="naiss"||k=="date"||k=="dateEnr")return fdd(v);if(k=="amende"||k=="prime")return v?money(v):"—";
 if(k=="danger")return `<span class="bdg ${({Faible:"mu",Modérée:"bl",Élevée:"wa",Extrême:"no"}[v]||"mu")}">${esc(v||"—")}</span>`;if(k=="st")return `<span class="bdg ${v=="Levé"?"mu":"no"}">${esc(v||"Actif")}</span>`;return esc(v||"—")}

 const s=avail.some(a=>a[0]==sub)?sub:avail[0][0];if(s=="etatcivil")return `<div class="ph"><h2>Registres officiels</h2></div>${tabsH(avail.map(([k,R])=>[k,R.t]),s)}${ecView()}`;

 return `<div class="ph"><h2>Registres officiels</h2>${regCanEdit(s)?`<button class="btn" onclick="openM('reg',null,{reg:'${s}'})">${ic("plus")}Nouvelle fiche</button>`:""}</div>${tabsH(avail.map(([k,R])=>[k,R.t]),s)}
 <div class="card inl">${search("r_"+s)}<span class="mu">${L.length} fiche(s)</span></div>

function fieldH(f,v,ro){const id="rf_"+f.k;if((v==null||v==="")&&!ro&&f.def)v=f.def();v=v==null?"":v;
 if(ro)return `<div class="k">${esc(f.l)}</div><div class="pre">${f.type=="account"?esc(v?uname(v):"—"):f.type=="date"?fdd(v):f.type=="number"&&v!==""?money(v):esc(v||"—")}</div>`;
 const cls=f.type=="area"?"f full":"f";let inp;

 else inp=`<input id="${id}" type="${f.type||"text"}" value="${esc(v)}">`;
 return `<label class="${cls}">${esc(f.l)}${f.req?" *":""}${inp}</label>`}

/* =================== ÉTAT CIVIL : ACTES =================== */
const EC_CATS=[["divorce","Divorce","\u{1F494}"],["naissance","Naissance","\u{1F476}"],["deces","Décès","\u{1F54A}\u{FE0F}"],["reconnaissance","Reconnaissance","\u{1F4AC}"],["associations","Associations","\u{1F465}"],["adoption","Adoption","\u{1F46A}"],["emancipation","Émancipation","\u{1F4DD}"],["identite","Changement d'identité","\u{1F3AD}"],["mariage","Mariage","\u{1F48D}"]];

 return `<div class="ec"><aside class="ec-side card"><button class="ec-c ${!cat?"on":""}" onclick="filt.ecc='';render()"><span class="ec-h">#</span><span class="ec-e">\u{1F4DA}</span><span class="ec-s">┊</span><span class="ec-n">Tous les actes</span><span class="ec-k">${live.length}</span></button>

 ${isDir()?`<button class="ec-c ${showDel?"on":""}" onclick="filt.ecc='_del';render()" style="margin-top:8px"><span class="ec-h">#</span><span class="ec-e">\u{1F5D1}\u{FE0F}</span><span class="ec-s">┊</span><span class="ec-n">Actes supprimés</span><span class="ec-k">${all.length-live.length}</span></button>`:""}</aside>
 <div><div class="card"><div class="inl"><input id="q_ecq" placeholder="Rechercher : nom, prénom, numéro, date de naissance, n° d'acte…" value="${esc(q)}" oninput="filt.ecq=this.value;render()" style="flex:1;min-width:220px">${can("reg.civ.edit")&&!showDel?`<button class="btn" onclick="openActeEdit()">${ic("plus")}Nouvel acte${cat&&ECL[cat]?" — "+esc(ECL[cat][1]):""}</button>`:""}</div>
 <div class="mu sm" style="margin-top:6px">${L.length} acte(s)${q?" correspondant à la recherche":""}${cat&&ECL[cat]?" · "+ECL[cat][2]+" "+esc(ECL[cat][1]):showDel?" · supprimés":""}</div></div>
 <div class="card tw"><table><tr><th>N° d'acte<th>Catégorie<th>Personne concernée<th>Numéro<th>Naissance<th>Date de l'acte<th>Pièces<th>Enregistré</tr>${L.map(a=>`<tr class="click" onclick="openActe('${a.id}')"><td class="nw b">${esc(a.num)}<td class="nw">${(ECL[a.cat]||["","?","\u{1F4C4}"])[2]} ${esc((ECL[a.cat]||["","Autre"])[1])}<td><b>${esc(a.nom)}</b> ${esc(a.prenom)}<td class="nw">${esc(a.tel||"—")}<td class="nw">${a.naiss?fdd(a.naiss):"—"}<td class="nw">${a.dateActe?fdd(a.dateActe):"—"}<td>\u{1F4CE} ${Object.keys(a.files||{}).length}<td class="nw mu sm">${fd(a.t)}<br>${esc(a.byNom||"")}</tr>`).join("")||`<tr><td colspan="8" class="empty">${q?"Aucun acte ne correspond à la recherche.":"Aucun acte enregistré."}</td></tr>`}</table></div></div></div>`}
const acteCache={};

 ${nf.length?`<div class="fgrid" style="margin-bottom:10px">${nf.map((f,i)=>`<div class="ftile new">${f.type.startsWith("image/")?`<img src="${f.data}" alt="">`:`<div class="fdoc">${ic("file")}<span>PDF</span></div>`}<div class="fname">${esc(f.name)}</div><button class="lnk" onclick="modal.files.splice(${i},1);render()">Retirer</button></div>`).join("")}</div>`:""}

const PAT_T=[["toit","Formulaire prise de toit","\u{1F3E2}"],["ronde","Ronde de surveillance","\u{1F526}"],["interne","Formulaire surveillance interne","\u{1F3DB}\u{FE0F}"],["aerienne","Formulaire Patrouille Aérienne","\u{1F681}"]];
const PATL=Object.fromEntries(PAT_T.map(t=>[t[0],t]));
const isoDay=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const addDays=(s,n)=>{const d=new Date(s+"T12:00");d.setDate(d.getDate()+n);return isoDay(d)};
V.securite=()=>{if(!secOk())return empty("Espace réservé au département Sécurité.");const st=filt.sst||"cours";
 return `<div class="ph"><h2>Sécurité — Patrouilles et rondes</h2></div><div class="tabs"><button class="${st=="cours"?"on":""}" onclick="filt.sst='cours';render()">Rapports</button><button class="${st=="arch"?"on":""}" onclick="filt.sst='arch';render()">Archives</button></div>${st=="arch"?patArchView():patView()}`};
function patView(){const ty=filt.pty||"",q=filt.pq3||"",A=vals(S.patrouilles).filter(p=>!p.arch);
 let L=A.filter(p=>!ty||p.type==ty).filter(p=>match(q,p.num,p.byNom,p.matricule,p.problemes,(PATL[p.type]||[])[1],fdd(p.date))).sort((a,b)=>(b.date+b.heure).localeCompare(a.date+a.heure)||b.t-a.t);
 return `<div class="ec"><aside class="ec-side card"><button class="ec-c ${!ty?"on":""}" onclick="filt.pty='';render()"><span class="ec-e">\u{1F4CB}</span><span class="ec-n">Tous les rapports</span><span class="ec-k">${A.length}</span></button>
 ${PAT_T.map(([k,l,e])=>`<button class="ec-c ${ty==k?"on":""}" onclick="filt.pty='${k}';render()"><span class="ec-e">${e}</span><span class="ec-n">${esc(l)}</span><span class="ec-k">${A.filter(p=>p.type==k).length}</span></button>`).join("")}</aside>
 <div><div class="card"><div class="inl"><input id="q_pq3" placeholder="Rechercher : agent, matricule, n°, problème, date…" value="${esc(q)}" oninput="filt.pq3=this.value;render()" style="flex:1;min-width:200px"><button class="btn" onclick="openM('patNew',null,{ptype:'${ty||"ronde"}'})">${ic("plus")}Nouveau rapport${ty?" — "+esc(PATL[ty][1]):""}</button></div></div>
 <div class="card tw"><table><tr><th>N°<th>Type<th>Date<th>Heure<th>Agent<th>Matricule<th>Problèmes</tr>${L.map(p=>`<tr class="click" onclick="openM('pat','${p.id}')"><td class="nw b">${esc(p.num)}<td class="nw">${(PATL[p.type]||["","?",""])[2]} ${esc((PATL[p.type]||["","?"])[1])}<td class="nw">${fdd(p.date)}<td class="nw">${esc(p.heure||"—")}<td>${esc(p.byNom)}<td class="nw">${esc(p.matricule||"—")}<td>${p.problemes?'<span class="bdg wa">Signalé</span>':'<span class="bdg ok">RAS</span>'}</tr>`).join("")||`<tr><td colspan="7" class="empty">Aucun rapport.</td></tr>`}</table></div></div></div>`}
function patArchView(){const A=vals(S.patarch).sort((a,b)=>b.to.localeCompare(a.to)),end=keep.pae||isoDay(Date.now()),from=addDays(end,-6);
 const n=vals(S.patrouilles).filter(p=>!p.arch&&p.date>=from&&p.date<=end).length;
 return `${secArch()?`<div class="card"><h3>Archiver une période de 7 jours</h3><div class="inl"><label class="f">Dernier jour de la période<input id="pae" type="date" value="${esc(end)}" onchange="keep.pae=this.value;render()"></label><span class="mu">Du <b>${fdd(from)}</b> au <b>${fdd(end)}</b> : ${n} rapport(s) à archiver</span><button class="btn" ${n?"":"disabled"} onclick="patArchive('${from}','${end}')">Archiver ces 7 jours</button></div><p class="mu sm">Les rapports archivés disparaissent de la liste et restent consultables ici.</p></div>`:""}
 <div class="card tw"><h3>Périodes archivées</h3><table><tr><th>Période<th>Rapports<th>Problèmes signalés<th>Archivée le<th>Par</tr>${A.map(a=>{const P=vals(S.patrouilles).filter(p=>p.arch==a.id);return `<tr class="click" onclick="openM('patarch','${a.id}')"><td class="b nw">${fdd(a.from)} → ${fdd(a.to)}<td>${P.length}<td>${P.filter(p=>p.problemes).length}<td class="nw">${fd(a.t)}<td>${esc(a.byNom)}</tr>`}).join("")||`<tr><td colspan="5" class="empty">Aucune archive.</td></tr>`}</table></div>`}
function MPatNew(){if(!secOk())return null;const u=ME(),now=new Date();
 return {title:"Nouveau rapport de patrouille",body:`<div class="pe-card"><div class="kv"><div class="k">Agent rédacteur</div><div class="b">${esc(u.nom)}</div><div class="k">Matricule</div><div>${esc(u.matricule||"—")}</div></div></div>
 <div class="form"><label class="f full">Type de rapport *<select id="pty">${opts(PAT_T.map(t=>[t[0],t[2]+" "+t[1]]),modal.ptype)}</select></label><label class="f">Date de la patrouille / ronde *<input id="pdt" type="date" value="${isoDay(now)}"></label><label class="f">Heure *<input id="phr" type="time" value="${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}"></label>
 <label class="f full">Problèmes rencontrés <span class="mu">(facultatif — laisser vide si rien à signaler)</span><textarea id="ppb" rows="4"></textarea></label></div><p class="err" id="msg"></p>`,
 foot:`<button class="btn sec" onclick="closeM()">Annuler</button><button class="btn" onclick="patSave()">Enregistrer le rapport</button>`}}
function MPat(p){if(!p||!secOk())return null;const t=PATL[p.type]||["","?",""],del=!p.arch&&(secArch()||p.by==meId);
 return {title:`${t[2]} ${esc(t[1])} — ${esc(p.num)}`,body:`<div class="kv"><div class="k">Date</div><div>${fdd(p.date)} à ${esc(p.heure||"—")}</div><div class="k">Agent rédacteur</div><div class="b">${esc(p.byNom)}</div><div class="k">Matricule</div><div>${esc(p.matricule||"—")}</div><div class="k">Enregistré le</div><div>${fd(p.t)}</div><div class="k">Problèmes rencontrés</div><div class="pre">${p.problemes?esc(p.problemes):'<span class="bdg ok">Rien à signaler</span>'}</div>${p.arch?`<div class="k">Statut</div><div><span class="bdg mu">Archivé</span></div>`:""}</div>`,

function MPatArch(a){if(!a||!secOk())return null;const P=vals(S.patrouilles).filter(p=>p.arch==a.id).sort((x,y)=>(x.date+x.heure).localeCompare(y.date+y.heure));
 return {title:`Archive des patrouilles — ${fdd(a.from)} → ${fdd(a.to)}`,wide:1,body:`<div class="kpis">${kpi("Rapports",P.length)}${PAT_T.map(t=>kpi(t[2]+" "+t[1].replace("Formulaire ",""),P.filter(p=>p.type==t[0]).length)).join("")}${kpi("Problèmes signalés",P.filter(p=>p.problemes).length)}</div><p class="mu">Archivée le ${fd(a.t)} par ${esc(a.byNom)}</p>
 <div class="tw"><table><tr><th>N°<th>Type<th>Date<th>Heure<th>Agent<th>Matricule<th>Problèmes</tr>${P.map(p=>`<tr><td class="nw">${esc(p.num)}<td class="nw">${(PATL[p.type]||[])[2]||""} ${esc((PATL[p.type]||["","?"])[1])}<td class="nw">${fdd(p.date)}<td>${esc(p.heure||"")}<td>${esc(p.byNom)}<td>${esc(p.matricule||"—")}<td class="pre">${p.problemes?esc(p.problemes):"RAS"}</tr>`).join("")||`<tr><td colspan="7" class="empty">Aucun rapport.</td></tr>`}</table></div>`,
 foot:`${isDir()?`<button class="btn gh" style="margin-right:auto" onclick="patArchDel('${a.id}')">Supprimer l'archive</button>`:""}<button class="btn sec" onclick="patArchCSV('${a.id}')">Exporter (CSV)</button><button class="btn" onclick="closeM()">Fermer</button>`}}

/* =================== FINANCES =================== */
function treasury(){return num(S.config.treasuryStart)+vals(S.transactions).reduce((s,t)=>s+(t.type=="in"?1:-1)*num(t.montant),0)}
V.finances=()=>{const T=[];if(can("fin.view"))T.push(["tresor","Trésorerie"]);if(can("fin.bill")||can("fin.view"))T.push(["fact","Comptabilité"]);if(can("fin.decl")||can("fin.view"))T.push(["decl","Déclarations fiscales"]);if(can("fin.budget")||can("fin.view"))T.push(["fisc","Taxes par entreprise"]);if(can("fin.view")||can("fin.archive"))T.push(["arch","Archives fiscales"]);if(can("fin.view")||can("fin.budget"))T.push(["stats","Statistiques"]);
 const s=T.some(t=>t[0]==sub)?sub:T[0][0];let h=`<div class="ph"><h2>Finances publiques</h2></div>${tabsH(T,s)}`;
 const X=vals(S.transactions),inS=X.filter(t=>t.type=="in").reduce((a,t)=>a+num(t.montant),0),outS=X.filter(t=>t.type=="out").reduce((a,t)=>a+num(t.montant),0),due=vals(S.factures).filter(f=>f.st=="due");
 if(s=="tresor"){let L=X;if(filt.tt)L=L.filter(t=>t.type==filt.tt);if(filt.tc)L=L.filter(t=>t.cat==filt.tc);if(filt.td)L=L.filter(t=>t.dept==filt.td);L=L.filter(t=>match(filt.tq,t.label,t.cat,t.dept)).sort((a,b)=>b.t-a.t);
  return h+`<div class="kpis">${kpi("Solde du Trésor",money(treasury()),"gold")}${kpi("Recettes",money(inS))}${kpi("Dépenses",money(outS))}${kpi("Créances impayées",money(due.reduce((a,f)=>a+num(f.montant),0)))}</div>
  ${can("fin.edit")?`<div class="card"><h3>Saisir une opération</h3><div class="form"><label class="f">Sens<select id="ft">${opts([["in","Recette"],["out","Dépense"]])}</select></label><label class="f">Catégorie<select id="fc">${opts(CATS)}</select></label><label class="f">Département<select id="fdp">${opts(["Général"].concat(DEPTS()))}</select></label><label class="f">Montant ($)<input id="fm" type="number" min="0"></label><label class="f full">Libellé<input id="fl"></label></div><button class="btn" onclick="addTx()">Enregistrer</button><p class="err" id="msg"></p></div>`:""}
  <div class="card inl">${search("tq","Libellé…")}${fsel("tt",[["in","Recettes"],["out","Dépenses"]],"Recettes et dépenses")}${fsel("tc",CATS,"Toutes catégories")}${fsel("td",["Général"].concat(DEPTS()),"Tous départements")}</div>
  <div class="card tw"><table><tr><th>Date<th>Libellé<th>Catégorie<th>Département<th>Saisi par<th class="r">Montant<th></tr>${L.slice(0,300).map(t=>`<tr><td class="nw">${fd(t.t)}<td>${esc(t.label)}<td>${esc(t.cat)}<td>${esc(t.dept||"—")}<td>${esc(t.byNom||"")}<td class="r b nw" style="color:var(--${t.type=="in"?"ok":"no"})">${t.type=="in"?"+":"−"} ${money(t.montant)}<td>${can("fin.edit")?`<button class="btn gh sm" onclick="delTx('${t.id}')">×</button>`:""}</tr>`).join("")||`<tr><td colspan="7" class="empty">Aucune opération.</td></tr>`}</table></div>`}
 if(s=="fact"){let L=vals(S.factures).filter(f=>!f.arch);const nv=L.filter(f=>f.st=="verif").length;if(filt.fs)L=L.filter(f=>f.st==filt.fs);if(filt.fk)L=L.filter(f=>f.kind==filt.fk);L=L.filter(f=>match(filt.fq,f.num,f.entNom,f.motif)).sort((a,b)=>b.t-a.t);
  return h+(!canBill()?`<div class="card mu">Consultation seule : seuls les agents des départements Finances et Justice peuvent émettre ou traiter des écritures en comptabilité.</div>`:"")+(canBill()?`<div class="card"><h3>Émettre une facture ou une amende</h3><div class="form"><label class="f">Nature<select id="bk">${opts([["facture","Facture"],["amende","Amende"],["taxe","Impôt / taxe"]])}</select></label>
  <label class="f">Destinataire (compte entreprise)<select id="be"><option value="">— Personne / entité sans compte —</option>${vals(S.users).filter(u=>u.role=="entreprise").map(u=>`<option value="${u.id}">${esc(u.nom)}</option>`).join("")}</select></label>
  <label class="f">ou nom du destinataire<input id="bn" placeholder="Si pas de compte"></label><label class="f">Montant ($)<input id="bm" type="number" min="0"></label><label class="f">Échéance<input id="bd" type="date"></label><label class="f">Département<select id="bdp">${opts(DEPTS(),"Finances")}</select></label><label class="f full">Motif<input id="bmo"></label></div><button class="btn" onclick="addBill()">Émettre</button><p class="err" id="msg"></p></div>`:"")+
  (nv?`<div class="card inl" style="border-color:var(--blue)"><b>${nv} paiement(s) en attente de vérification.</b><button class="btn sm bl" onclick="filt.fs='verif';render()">Afficher</button></div>`:"")+`<div class="card inl">${search("fq","N°, destinataire, motif…")}${fsel("fs",Object.entries(FST).map(([k,v])=>[k,v[0]]),"Tous statuts")}${fsel("fk",[["facture","Factures"],["amende","Amendes"],["taxe","Impôts"]],"Toutes natures")}</div>
  <div class="card tw"><table><tr><th>N°<th>Nature<th>Destinataire<th>Motif<th class="r">Montant<th>Échéance<th>Statut<th></tr>${L.map(f=>`<tr><td class="nw">${esc(f.num)}<td>${kindL(f.kind)}<td>${esc(f.entNom)}<td>${esc(f.motif)}<td class="r b nw">${money(f.montant)}<td>${fdd(f.ech)}${f.st=="due"&&f.ech&&f.ech<new Date().toISOString().slice(0,10)?' <span class="bdg no">Retard</span>':""}<td>${bdg(FST,f.st)}${f.st=="due"&&f.rejet?`<div class="sm" style="color:var(--no);margin-top:4px">Preuve refusée</div>`:""}<td class="nw">${f.st=="verif"?`<button class="btn sm bl" onclick="openM('verif','${f.id}')">Vérifier la preuve</button>`:""}${f.st=="payee"&&f.proof?`<button class="btn sm gh" onclick="openM('verif','${f.id}')">Voir la preuve</button>`:""}${canBill()&&f.st=="due"?`<button class="btn sm ok" onclick="payFact('${f.id}')">Marquer payée</button> <button class="btn sm gh" onclick="cancelFact('${f.id}')">Annuler</button>`:""}${canBill()?` <button class="btn sm gh" title="Supprimer définitivement" onclick="openM('factdel','${f.id}')">Supprimer</button>`:""}</tr>`).join("")||`<tr><td colspan="8" class="empty">Aucune facture.</td></tr>`}</table></div>`}
 if(s=="decl"){const L=vals(S.declarations).filter(d=>!d.arch).sort((a,b)=>(a.st=="validee")-(b.st=="validee")||b.t-a.t);
  return h+`<div class="card tw"><table><tr><th>Date<th>Entreprise<th>Période<th class="r">CA déclaré<th>Taux<th class="r">Impôt<th>Statut<th></tr>${L.map(d=>`<tr><td class="nw">${fd(d.t)}<td>${esc(d.entNom)}<td>${esc(d.periode)}<td class="r">${money(d.ca)}<td>${d.taux} %<td class="r b">${money(d.impot)}<td>${d.st=="validee"?'<span class="bdg ok">Validée</span>':'<span class="bdg wa">À vérifier</span>'}<td>${can("fin.decl")&&d.st!="validee"?`<button class="btn sm ok" onclick="validDecl('${d.id}')">Valider</button>`:""}</tr>`).join("")||`<tr><td colspan="8" class="empty">Aucune déclaration.</td></tr>`}</table></div>`}
 const ed=can("fin.budget");
 if(s=="fisc")return h+fiscView(ed);

 if(s=="stats")return h+statsView();

function gradeCode(g,u){return g&&g.role=="direction"?"_dir":dcode((g&&g.dept)||(u&&u.dept)||"")}
function gridRow(g,u){if(!g)return null;const G0=GRILLE[gradeCode(g,u)];if(!G0)return null;const R=G0[1],n=NRM(g.name);
 const ex=R.find(r=>NRM(r[0])==n);if(ex)return ex;const adj=n.includes("adjoint");
 if(n.startsWith("ministre")&&!adj)return R[0];if(adj&&n.includes("ministre"))return R[1];return null}
function payCfg(g,u){if(!g)return null;if(g.pBase!=null&&g.pBase!=="")return {base:num(g.pBase),max:num(g.pMax),rate:num(g.pRate),src:"grade"};const r=gridRow(g,u);return r?{base:r[1],max:r[2],rate:r[3],src:"grille",ref:r[0]}:null}
const deptCode=u=>{const g=G(u);return g?gradeCode(g,u):dcode(u.dept||"")};
const fh=h=>(Math.round(num(h)*10)/10).toLocaleString("fr-FR");
const PSTAT=[["","—"],["abs","Absent(e)"],["new","Nv. arrivé(e)"]];
function jugQuota(n){return n.includes("ministre")?0:/resp(onsable)? judiciaire/.test(n)?5:7}
function payCalc(u,l){l=l||{};const g=G(u),c=payCfg(g,u),dc=deptCode(u),F=DSPEC[dc]||[],n=NRM(g&&g.name),x=l.x||{};
 const q=l.q!=null&&l.q!==""?Math.min(100,Math.max(0,num(l.q)))/100:1,h=num(l.h),qh=QUOTA_H*q,ctx={charge:/^charge de (com|prod)/.test(n)};
 const r={h,q,qh,cfg:c,base:0,ot:0,primes:0,hors:0,cap:0,ecrete:0,pen:0,sal:0,total:0,why:[]};
 if(!c){r.why.push("Grade hors grille salariale");return r}
 if(l.st=="abs"){r.why.push("Absent(e)");return r}
 if(h<qh)r.why.push(`Quota d'heures non atteint (${fh(h)} / ${fh(qh)} h)`);
 if(dc=="jus"){const m=jugQuota(n);if(num(x.jug)<m)r.why.push(`Quota de jugements non atteint (${num(x.jug)} / ${m})`)}
 if(dc=="com"){if(/^charge de com/.test(n)&&num(x.ev)<2)r.why.push(`Quota d'évènements non atteint (${num(x.ev)} / 2)`);if(/^charge de prod/.test(n)&&num(x.med)<2)r.why.push(`Quota de médias non atteint (${num(x.med)} / 2)`)}
 if(r.why.length)return r;
 const evo=c.max>c.base;r.base=Math.round(c.base*q);r.cap=evo?Math.round(c.max*q):r.base;
 if(evo)r.ot=Math.round(Math.max(0,h-qh)*c.rate);
 F.forEach(f=>{const v=f.t=="c"?(x[f.k]?1:0):Math.max(0,num(x[f.k]));let a;
  if(dc=="jus"&&f.k=="jug")a=Math.max(0,v-(jugQuota(n)||7))*50000;else a=v*(typeof f.a=="function"?f.a(ctx):num(f.a));
  if(f.hp)r.hors+=a;else r.primes+=a});
 const brut=r.base+r.ot+r.primes,plaf=Math.min(brut,r.cap);r.ecrete=brut-plaf;
 const av=num(l.av);r.pen=av>=2?1:av>=1?.5:0;
 r.total=Math.round((plaf+r.hors)*(1-r.pen));r.sal=Math.round(Math.min(r.base+r.ot,r.cap)*(1-r.pen));return r}
function payDet(u,l){const F=DSPEC[deptCode(u)]||[],x=(l&&l.x)||{};return F.filter(f=>f.t=="c"?x[f.k]:num(x[f.k])>0).map(f=>f.t=="c"?f.l:`${f.l} ${num(x[f.k])}`).join(" · ")}
function payInfo(u){const d=S.paie[deptKey(u.dept)],l=d&&d.lines&&d.lines[u.id];return {total:l?payCalc(u,l).total:0}}
function cfgTxt(c){if(!c)return `<span style="color:var(--no)">Grade hors grille</span>`;return c.max>c.base?`Base ${money(c.base)} · plafond ${money(c.max)} · ${money(c.rate)}/h sup.`:`Salaire fixe ${money(c.base)}`}
function payFolders(){const u=ME();if(payGlobal())return DEPTS().map(d=>[deptKey(d),d]).concat([["_dir","Direction"]]);if(can("pay.dept")&&u.dept)return [[deptKey(u.dept),u.dept]];return []}
function deptStaff(key){return vals(S.users).filter(x=>isAgent(x)&&x.active!==false&&(key=="_dir"?!x.dept:deptKey(x.dept)==key)).sort((a,b)=>((G(a)||{}).rank??99)-((G(b)||{}).rank??99)||a.nom.localeCompare(b.nom))}
const PST={brouillon:["En préparation","wa"],soumise:["Soumise pour validation","bl"]};
function lineTotal(l){if(!l)return 0;if(l.total!=null)return Math.round(num(l.total));return Math.round(num(l.montant)+num(l.prime))}
function draftTotal(key){const d=S.paie[key]||{};return deptStaff(key).reduce((s,u)=>s+payCalc(u,(d.lines||{})[u.id]).total,0)}
V.salaire=()=>{const F=payFolders(),T=[["moi","Mon salaire"]].concat(F.length?[["gestion","Gestion des salaires"]]:[]).concat([["grille","Grille salariale"]]);const s=T.some(t=>t[0]==sub)?sub:"moi";
 return `<div class="ph"><h2>Salaire</h2></div>${tabsH(T,s)}${s=="gestion"?payMgmtView(F):s=="grille"?grilleView():myPayView()}`};
function grilleView(){const my=deptCode(ME()),order=Object.keys(GRILLE).sort((a,b)=>(b==my)-(a==my));
 return `<div class="card"><p class="mu" style="margin:0">Le salaire de base est dû dès que le quota est rempli (${QUOTA_H} h de service par semaine à 100 %). Les heures au-delà du quota sont payées au taux horaire du grade, jusqu'au salaire maximal. Un grade sans plafond ne peut pas dépasser son salaire de base. Les primes du département s'ajoutent dans la limite du plafond. Avertissement : 1 = −50 %, 2 = salaire nul.</p></div>
 <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr))">${order.map(k=>{const [nm,R]=GRILLE[k],F=DSPEC[k]||[];return `<div class="card tw"><h3>${esc(nm)}</h3><table><tr><th>Grade<th class="r">Base<th class="r">Maximal<th class="r">Taux h. sup.</tr>${R.map(r=>`<tr><td class="b">${esc(r[0])}<td class="r nw">${money(r[1])}<td class="r nw">${r[2]?money(r[2]):"—"}<td class="r nw">${r[2]?money(r[3]):"—"}</tr>`).join("")}</table>
  ${F.length?`<h4 style="margin:12px 0 6px">Spécificités</h4><ul class="sm" style="margin:0;padding-left:18px">${F.map(f=>`<li>${esc(f.l)} : ${f.d?esc(f.d):typeof f.a=="function"?"100 000 $ (Chargés) / 125 000 $":money(f.a)+(f.t=="n"?" par unité":"")}${f.hp?" — hors plafond":""}</li>`).join("")}</ul>`:""}${SPEC_NOTE[k]?`<p class="mu sm" style="margin:8px 0 0">${esc(SPEC_NOTE[k])}</p>`:""}</div>`}).join("")}</div>`}
function myPayView(){const u=ME(),key=deptKey(u.dept),dr=S.paie[key],my=dr&&dr.lines&&dr.lines[u.id],c=payCfg(G(u),u),r=my?payCalc(u,my):null;
 const A=vals(S.paiearch).filter(a=>a.lines&&a.lines[u.id]).sort((a,b)=>b.t-a.t);const H=vals(S.transactions).filter(t=>t.cat=="Salaires"&&t.user==u.id&&!t.paie).sort((a,b)=>b.t-a.t);
 const tot=A.reduce((s,a)=>s+lineTotal(a.lines[u.id]),0)+H.reduce((s,t)=>s+num(t.montant),0);
 return `<div class="kpis">${kpi("Paie en préparation",r?money(r.total):"—","gold")}${kpi("Heures déclarées",r?fh(r.h)+" h":"—")}${kpi("Total perçu",money(tot))}</div>
 <div class="card"><h3>Ma paie en cours</h3><p class="mu sm" style="margin-top:0">Grade : ${esc(gname(u))} · ${cfgTxt(c)}</p>${my?`<div class="kv"><div class="k">Période</div><div>${esc(dr.periode||"—")}</div><div class="k">Statut</div><div>${bdg(PST,dr.st||"brouillon")}</div>
  <div class="k">Heures de service</div><div>${fh(r.h)} h (quota ${fh(r.qh)} h${r.q<1?" · quotité "+Math.round(r.q*100)+" %":""})</div>${payDet(u,my)?`<div class="k">Activité</div><div>${esc(payDet(u,my))}</div>`:""}
  ${r.why.length?`<div class="k">Pas de quota</div><div style="color:var(--no)">${esc(r.why.join(" · "))}</div>`:`<div class="k">Salaire de base</div><div>${money(r.base)}</div><div class="k">Heures sup.</div><div>${money(r.ot)}</div><div class="k">Primes</div><div>${money(r.primes+r.hors)}</div>${r.ecrete?`<div class="k">Écrêtement (plafond)</div><div>−${money(r.ecrete)}</div>`:""}${r.pen?`<div class="k">Avertissement</div><div style="color:var(--no)">−${r.pen*100} %</div>`:""}`}
  ${my.note?`<div class="k">Commentaire</div><div>${esc(my.note)}</div>`:""}<div class="k">Total</div><div class="b" style="font-size:18px;color:var(--gold2)">${money(r.total)}</div></div>`:`<p class="mu">Votre ministre n'a pas encore saisi votre paie pour la période en cours.</p>`}</div>
 <div class="card tw"><h3>Mes fiches de paie</h3><table><tr><th>Date<th>Période<th>Département<th class="r">Heures<th class="r">Salaire<th class="r">Primes<th class="r">Total<th>Validé par</tr>${A.map(a=>{const l=a.lines[u.id];return `<tr><td class="nw">${fd(a.t)}<td>${esc(a.periode)}<td>${esc(a.deptNom)}<td class="r">${l.h!=null?fh(l.h):"—"}<td class="r">${money(l.montant)}<td class="r">${money(l.prime)}<td class="r b">${money(lineTotal(l))}<td>${esc(a.byNom)}</tr>`}).join("")}${H.map(t=>`<tr><td class="nw">${fd(t.t)}<td class="mu" colspan="6">${esc(t.label)} — <b>${money(t.montant)}</b><td>${esc(t.byNom||"")}</tr>`).join("")}${!A.length&&!H.length?`<tr><td colspan="8" class="empty">Aucun versement reçu.</td></tr>`:""}</table></div>`}
function payMgmtView(F){const cur=F.some(f=>f[0]==filt.pdk)?filt.pdk:F[0][0],nm=(F.find(f=>f[0]==cur)||[])[1],st=filt.pst||"cours";
 const side=`<div class="card pfold">${F.map(([k,n])=>{const d=S.paie[k];return `<button class="ec-c ${k==cur?"on":""}" onclick="filt.pdk='${k}';filt.pst='cours';keep={};render()"><span class="ec-h">${ic("folder")}</span><span class="ec-n">${esc(n)}</span>${d&&d.st=="soumise"?`<span class="bdg bl" style="font-size:10px">À valider</span>`:""}</button>`}).join("")}</div>`;
 const tabs=`<div class="tabs"><button class="${st=="cours"?"on":""}" onclick="filt.pst='cours';render()">Paie en cours</button><button class="${st=="arch"?"on":""}" onclick="filt.pst='arch';render()">Archives des salaires</button></div>`;
 return `${F.length>1?side:""}<div><div class="card"><div class="inl" style="justify-content:space-between"><h3 style="margin:0">${ic("folder").replace("<svg",'<svg width="18" height="18" style="vertical-align:-3px"')} ${esc(nm)}</h3><span class="mu">${payGlobal()?"Gestion globale":"Votre département"}</span></div>${tabs}${st=="arch"?payArchView(cur,nm):payDraftView(cur,nm)}</div></div>`}
function payDraftView(key,nm){const d=S.paie[key]||{st:"brouillon",lines:{}},L=deptStaff(key),locked=d.st=="soumise"&&!payGlobal(),ed=!locked;
 const dc=key=="_dir"?"_dir":dcode(nm),F=DSPEC[dc]||[];let tot=0;
 const inp=(u,f,v,w)=>`<input type="number" min="0" step="${f=="h"?"0.1":"1"}" data-nokeep class="pn" value="${v??""}" onchange="paySetLine('${key}','${u.id}','${w||f}',this.value)">`;
 const rows=L.map(u=>{const l=(d.lines||{})[u.id]||{},x=l.x||{},c=payCfg(G(u),u),r=payCalc(u,l);tot+=r.total;
  return `<tr><td class="pag"><b>${esc(u.nom)}</b><div class="mu sm">${esc(gname(u))}</div><div class="mu" style="font-size:11px">${cfgTxt(c)}</div>
  <td>${ed?inp(u,"h",l.h):fh(l.h)}<td>${ed?`<select data-nokeep class="pn" onchange="paySetLine('${key}','${u.id}','q',this.value)">${opts([["100","100 %"],["75","75 %"],["50","50 %"]],String(l.q??100))}</select>`:(l.q??100)+" %"}
  <td>${ed?`<select data-nokeep class="pst" onchange="paySetLine('${key}','${u.id}','st',this.value)">${opts(PSTAT,l.st||"")}</select>`:esc((PSTAT.find(p=>p[0]==(l.st||""))||[,""])[1])}
  <td>${ed?`<select data-nokeep class="pn" onchange="paySetLine('${key}','${u.id}','av',this.value)">${opts([["0","0"],["1","1"],["2","2"]],String(num(l.av)))}</select>`:num(l.av)}
  ${F.map(f=>`<td class="c">${f.t=="c"?`<input type="checkbox" data-nokeep ${x[f.k]?"checked":""} ${ed?"":"disabled"} onchange="paySetLine('${key}','${u.id}','x.${f.k}',this.checked)">`:ed?inp(u,f.k,x[f.k],"x."+f.k):num(x[f.k])}`).join("")}
  <td>${ed?`<input data-nokeep value="${esc(l.note||"")}" onchange="paySetLine('${key}','${u.id}','note',this.value)" class="pnote">`:esc(l.note||"")}
  <td class="r nw"><b>${money(r.total)}</b>${r.why.length?`<div><span class="bdg no" style="font-size:10px" title="${esc(r.why.join(" · "))}">Pas de quota</span></div><div class="sm" style="color:var(--no);max-width:180px;white-space:normal">${esc(r.why.join(" · "))}</div>`:`<div class="mu" style="font-size:11px">${money(r.base)} + ${money(r.ot)} sup. + ${money(r.primes+r.hors)} primes${r.ecrete?` · plafonné`:""}${r.pen?` · averto −${r.pen*100} %`:""}</div>`}</tr>`}).join("");
 const nc=7+F.length;
 return `<div class="form" style="margin-top:12px"><label class="f">Période<input id="pper_${key}" data-nokeep value="${esc(d.periode||"")}" placeholder="Ex. : Semaine 41 — 2026" ${ed?"":"disabled"} onchange="paySetPeriod('${key}',this.value)"></label>
 <div class="f"><span class="mu sm">Statut</span><div style="margin-top:10px">${bdg(PST,d.st||"brouillon")}${d.updNom?` <span class="mu sm">· modifiée par ${esc(d.updNom)} le ${fd(d.updT)}</span>`:""}</div></div></div>
 <p class="mu sm">Renseignez les heures de service et l'activité de chaque agent : le salaire est calculé automatiquement selon la grille salariale (quota ${QUOTA_H} h, taux horaire et plafond du grade). ${esc(SPEC_NOTE[dc]||"")}</p>
 ${d.st=="soumise"?`<p class="mu">Soumise par ${esc(d.subNom||"")} le ${fd(d.subT)}.${payGlobal()?" Vérifiez les montants puis validez le versement.":" En attente de validation par la gestion globale ; modification impossible."}</p>`:""}${d.retour?`<div class="card" style="border-color:var(--wa)"><b>Renvoyée pour correction</b> : ${esc(d.retour)}</div>`:""}
 <div class="tw"><table class="payt"><tr><th>Agent<th>Heures<th>Quotité<th>Statut<th>Averto${F.map(f=>`<th class="c" title="${esc(f.d||(typeof f.a=="function"?"100 000 $ (Chargés) / 125 000 $":money(f.a)+(f.t=="n"?" par unité":"")))}">${esc(f.l)}<div class="mu" style="font-size:10px;font-weight:400;text-transform:none">${f.d?"quota":typeof f.a=="function"?"100k / 125k":(f.t=="n"?"× ":"")+money(f.a)}</div>`).join("")}<th>Commentaire<th class="r">Total</tr>${rows||`<tr><td colspan="${nc}" class="empty">Aucun agent actif dans ce département.</td></tr>`}
 <tr><td colspan="${nc-1}" class="r b">Total du département<td class="r b" style="color:var(--gold2)">${money(tot)}</tr></table></div>
 <div class="inl" style="margin-top:12px;justify-content:flex-end">
 ${d.st!="soumise"&&L.length?`<button class="btn bl" onclick="paySubmit('${key}','${esc(nm)}')">Soumettre pour validation</button>`:""}

function payArchView(key,nm){const A=vals(S.paiearch).filter(a=>a.dept==key).sort((a,b)=>b.t-a.t);
 return `<div class="tw" style="margin-top:12px"><table><tr><th>Période<th>Versée le<th>Agents<th class="r">Total versé<th>Préparée par<th>Validée par</tr>${A.map(a=>`<tr class="click" onclick="openM('paiearch','${a.id}')"><td class="b">${esc(a.periode)}<td class="nw">${fd(a.t)}<td>${Object.keys(a.lines||{}).length}<td class="r b">${money(a.total)}<td>${esc(a.subNom||"—")}<td>${esc(a.byNom)}</tr>`).join("")||`<tr><td colspan="6" class="empty">Aucune paie archivée pour ce département.</td></tr>`}</table></div>`}
function MPaieArch(a){if(!a)return null;const F=payFolders();if(!F.some(f=>f[0]==a.dept))return null;const L=Object.entries(a.lines||{}).map(([id,l])=>Object.assign({id},l)).sort((x,y)=>String(x.nom).localeCompare(y.nom));

 <div class="tw"><table><tr><th>Agent<th>Grade<th class="r">Heures<th>Activité<th class="r">Salaire<th class="r">Primes<th>Commentaire<th class="r">Total</tr>${L.map(l=>`<tr><td class="b">${esc(l.nom)}<td>${esc(l.grade||"")}<td class="r">${l.h!=null?fh(l.h):"—"}<td class="sm">${esc(l.det||"")}${l.why?`<div style="color:var(--no)">${esc(l.why)}</div>`:""}${num(l.av)?`<div style="color:var(--no)">Averto ${num(l.av)}</div>`:""}<td class="r">${money(l.montant)}<td class="r">${money(l.prime)}<td>${esc(l.note||"")}<td class="r b">${money(lineTotal(l))}</tr>`).join("")}</table></div>`,

 <label class="f">Logo (fichier du dépôt ou lien https)<input id="slg" value="${esc(c.logo||"logo.png")}"></label><label class="f">Couleur d'accent<input id="sa" type="color" value="${esc(c.accent||"#c9a24a")}"></label><label class="f">Trésorerie initiale ($)<input id="st0" type="number" value="${num(c.treasuryStart)}"></label>
 
 <label class="f full">Départements (un par ligne)<textarea id="sdp" rows="6">${esc(DEPTS().join("\n"))}</textarea></label></div><button class="btn" onclick="saveSettings()">Enregistrer</button> <button class="btn gh" onclick="resetAccent()">Couleur par défaut</button></div>
 <div class="card"><h3>Mode maintenance</h3><p class="mu">Quand il est actif, seuls la Direction et les administrateurs peuvent utiliser l'intranet.</p><div class="form"><label class="f">État<select id="mo">${opts([["0","Désactivé"],["1","Activé"]],mt.on?"1":"0")}</select></label><label class="f full">Message affiché<textarea id="mm" rows="2">${esc(mt.msg||"")}</textarea></label></div><button class="btn" onclick="saveMaint()">Appliquer</button></div>
 <div class="card"><h3>Sauvegarde</h3><p class="mu">Exporte toutes les données dans un fichier JSON, ou restaure une sauvegarde (remplace toutes les données actuelles).</p><div class="inl"><button class="btn sec" onclick="exportData()">Télécharger une sauvegarde</button><label class="btn sec" style="cursor:pointer">Restaurer…<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label></div></div>
 <div class="card" style="border-color:var(--no)"><h3>Zone dangereuse</h3><p class="mu">Supprime définitivement toutes les données (comptes, dossiers, registres, finances…). Le compte direction / direction sera recréé.</p><button class="btn no" onclick="wipeAll()">Tout réinitialiser</button></div>`:""}`};

/* =================== PROFIL =================== */
V.profil=()=>{const u=ME();return `<div class="ph"><h2>Mon profil</h2></div><div class="grid g2"><div class="card"><h3>Informations</h3><div class="kv"><div class="k">Nom</div><div>${esc(u.nom)}</div><div class="k">Identifiant</div><div>${esc(u.login)}</div><div class="k">Rôle</div><div>${esc(ROLES[u.role])}</div>${isAgent(u)?`<div class="k">Grade</div><div>${esc(gname(u))}</div><div class="k">Département</div><div>${esc(u.dept||"—")}</div><div class="k">Matricule</div><div>${esc(u.matricule||"—")}</div>`:""}<div class="k">Compte créé le</div><div>${fd(u.created)}</div></div>
 <label class="f" style="margin-top:12px">Téléphone<input id="pt" value="${esc(u.tel||"")}"></label><button class="btn sec" onclick="saveTel()">Enregistrer</button>
 ${isAgent(u)&&!isDir()?`<h4 style="margin-top:16px">Mes permissions</h4><div class="pl">${ALLP.filter(can).map(k=>`<span class="bdg mu">${esc(PL[k])}</span>`).join("")||`<span class="mu">Aucune permission particulière.</span>`}</div>`:""}</div>
 <div class="card"><h3>Changer de mot de passe</h3><label class="f">Mot de passe actuel<input id="op" type="password" autocomplete="current-password"></label><label class="f">Nouveau mot de passe<input id="np1" type="password" autocomplete="new-password"></label><label class="f">Confirmation<input id="np2" type="password" autocomplete="new-password"></label><button class="btn" onclick="changePw()">Modifier</button><p class="err" id="msg"></p></div></div>`};

/* =================== PREUVES DE PAIEMENT =================== */
function proofView(p){if(!p)return "";if((p.type||"").startsWith("image/"))return `<img class="proof-img" src="${p.data}" alt="Preuve de paiement" onclick="modal.zoom=!modal.zoom;render()" title="Cliquer pour agrandir">`;
 return `<div class="proof-file">${ic("file")}<div><b>${esc(p.name||"Document")}</b><div class="mu sm">${p.type=="application/pdf"?"Document PDF":esc(p.type)} · ${Math.round((p.size||0)/1024)} Ko</div></div><a class="btn sec sm" href="${p.data}" download="${esc(p.name||"preuve")}">Télécharger</a></div>`}
function MNotif(f){if(!f||f.ent!=meId)return null;const p=modal.proof;
 return {title:"Notifier du paiement",body:`<div class="pe-card"><div class="kv"><div class="k">Facture</div><div><b>${esc(f.num)}</b> · ${kindL(f.kind)}</div><div class="k">Motif</div><div>${esc(f.motif)}</div><div class="k">Montant à régler</div><div class="b" style="color:var(--gold2);font-size:17px">${money(f.montant)}</div></div></div>
 ${f.rejet?`<div class="card" style="border-color:var(--no)"><b>Votre précédente preuve a été refusée.</b><div class="mu">Motif : ${esc(f.rejet)}</div></div>`:""}
 <h4>Preuve de paiement</h4>
 <div class="drop ${p?"has":""}" tabindex="0" onclick="if(!event.target.closest('a'))document.getElementById('pf').click()" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();proofFile(event.dataTransfer.files[0])">
 ${p?`${proofView(p)}<div class="mu sm" style="margin-top:8px">${esc(p.name)} — cliquez pour changer de fichier</div>`:`<div class="drop-ic">${ic("file")}</div><b>Cliquez pour sélectionner votre preuve</b><div class="mu">ou glissez-déposez le fichier ici, ou collez une capture (Ctrl+V)</div><div class="mu sm" style="margin-top:6px">Images (PNG, JPG…) ou PDF</div>`}</div>
 <input type="file" id="pf" accept="image/*,application/pdf" style="display:none" onchange="proofFile(this.files[0]);this.value=''">
 ${modal.busy?`<p class="mu">Traitement du fichier…</p>`:""}
 <div class="form" style="margin-top:12px"><label class="f">Référence du paiement (facultatif)<input id="nref" placeholder="Ex. : n° de virement, reçu…"></label><label class="f">Date du paiement<input id="ndt" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="f full">Commentaire (facultatif)<textarea id="ncom" rows="2"></textarea></label></div><p class="err" id="msg"></p>`,
 foot:`<button class="btn sec" onclick="closeM()">Annuler</button><button class="btn" ${p&&!modal.busy?"":"disabled"} onclick="sendNotif('${f.id}')">Envoyer la notification</button>`}}
function MVerif(f){if(!f||!(can("fin.bill")||can("fin.view")))return null;const p=proofCache[f.id];if(p===undefined)loadProof(f.id);const v=f.st=="verif"&&canBill();
 if(modal.zoom&&p)return {title:"Preuve — "+esc(f.num),wide:1,body:`<img src="${p.data}" alt="Preuve" style="width:100%;border-radius:10px;cursor:zoom-out" onclick="modal.zoom=false;render()">`,foot:`<button class="btn sec" onclick="modal.zoom=false;render()">Retour</button>`};
 return {title:(v?"Vérification du paiement — ":"Preuve de paiement — ")+esc(f.num),wide:1,body:`<div class="pe-card"><div class="kv"><div class="k">Entreprise</div><div>${esc(f.entNom)}</div><div class="k">Nature / motif</div><div>${kindL(f.kind)} — ${esc(f.motif)}</div><div class="k">Montant</div><div class="b" style="color:var(--gold2);font-size:17px">${money(f.montant)}</div>
 <div class="k">Notifié le</div><div>${fd(f.notifT)}${f.notifDate?" · paiement déclaré le "+fdd(f.notifDate):""}</div>${f.notifRef?`<div class="k">Référence</div><div>${esc(f.notifRef)}</div>`:""}${f.notifCom?`<div class="k">Commentaire</div><div class="pre">${esc(f.notifCom)}</div>`:""}${f.st=="payee"?`<div class="k">Validé</div><div>${fd(f.paidT)}${f.vNom?" par "+esc(f.vNom):""}</div>`:""}</div></div>
 <h4>Preuve fournie</h4><div class="drop has" style="cursor:default">${p===undefined?`<p class="mu">Chargement de la preuve…</p>`:p?proofView(p)+(p.type.startsWith("image/")?`<div class="mu sm" style="margin-top:6px">Cliquez sur l'image pour l'agrandir</div>`:""):`<p class="mu">Aucune preuve trouvée.</p>`}</div>
 ${v?`<label class="f" style="margin-top:12px">Motif en cas de refus (visible par l'entreprise)<textarea id="vrj" rows="2" placeholder="Ex. : montant incorrect, preuve illisible…"></textarea></label>`:""}<p class="err" id="msg"></p>`,
 foot:v?`<button class="btn sec" onclick="closeM()">Fermer</button><button class="btn no" onclick="rejectPay('${f.id}')">Refuser la preuve</button><button class="btn ok" onclick="validatePay('${f.id}')">Valider le paiement</button>`:`<button class="btn sec" onclick="closeM()">Fermer</button>`}}

/* =================== MODALES =================== */
function modalH(){if(!modal)return "";let m=null;
 if(modal.type=="confirm")m={title:"Confirmation",sm:1,body:`<p class="pre">${esc(modal.msg)}</p>`,foot:`<button class="btn sec" onclick="askNo()">Annuler</button><button class="btn no" onclick="askOk()">${esc(modal.label)}</button>`};
 else if(modal.type=="dossier")m=MDossier(S.dossiers[modal.id]);
 else if(modal.type=="affaire")m=MAffaire(S.affaires[modal.id]);
 else if(modal.type=="affaireNew")m=MAffaireNew();
 else if(modal.type=="reg")m=MReg();
 else if(modal.type=="grade")m=MGrade();
 else if(modal.type=="user")m=MUser(S.users[modal.id]);
 else if(modal.type=="notif")m=MNotif(S.factures[modal.id]);
 else if(modal.type=="verif")m=MVerif(S.factures[modal.id]);
 else if(modal.type=="archive")m=MArchive(S.archives[modal.id]);
 else if(modal.type=="acte")m=MActe(S.actes[modal.id]);
 else if(modal.type=="patNew")m=MPatNew();
 else if(modal.type=="pat")m=MPat(S.patrouilles[modal.id]);
 else if(modal.type=="patarch")m=MPatArch(S.patarch[modal.id]);
 else if(modal.type=="paiearch")m=MPaieArch(S.paiearch[modal.id]);
 else if(modal.type=="factdel"){const f=S.factures[modal.id];m=f&&canBill()?{title:"Supprimer de la comptabilité",sm:1,body:`<p>Supprimer définitivement <b>${esc(f.num)}</b> (${kindL(f.kind)} · ${esc(f.entNom)} · ${money(f.montant)}) ?</p><p class="mu sm">L'élément disparaît de la comptabilité et de l'espace de l'entreprise, ainsi que sa preuve de paiement éventuelle.</p>${f.st=="payee"?`<label class="ck"><input type="checkbox" id="fdtx"><span>Annuler aussi l'encaissement dans le Trésor (${money(f.montant)} retirés des recettes)</span></label>`:""}<p class="err" id="msg"></p>`,foot:`<button class="btn sec" onclick="closeM()">Annuler</button><button class="btn no" onclick="delFact('${f.id}')">Supprimer</button>`}:null}
 else if(modal.type=="paiedel"){const a=S.paiearch[modal.id];m=a&&isDir()?{title:"Supprimer l'archive de paie",sm:1,body:`<p>Supprimer définitivement l'archive « <b>${esc(a.periode)}</b> » du département ${esc(a.deptNom)} (${money(a.total)}, ${Object.keys(a.lines||{}).length} agent(s)) ?</p><p class="mu sm">Si vous gardez les versements, ils restent dans le Trésor et dans l'historique des agents. Si vous les annulez, l'argent est recrédité et les fiches de paie disparaissent.</p><label class="ck"><input type="checkbox" id="pdtx"><span>Annuler aussi les versements dans le Trésor (le montant est recrédité)</span></label><p class="err" id="msg"></p>`,foot:`<button class="btn sec" onclick="openM('paiearch','${a.id}')">Annuler</button><button class="btn no" onclick="delPaieArch('${a.id}')">Supprimer</button>`}:null}
 else if(modal.type=="payret")m={title:"Renvoyer la paie pour correction",sm:1,body:`<label class="f">Ce qu'il faut corriger<textarea id="prm" rows="3"></textarea></label><p class="err" id="msg"></p>`,foot:`<button class="btn sec" onclick="closeM()">Annuler</button><button class="btn" onclick="payReturnDo()">Renvoyer</button>`};
 else if(modal.type=="acteEdit")m=MActeEdit();
 if(!m){modal=null;return ""}
 return `<div class="modal-bg" onclick="if(event.target===this)${modal.type=="confirm"?"askNo()":"closeM()"}"><div class="modal ${m.sm?"sm":""} ${m.wide?"wide":""}" role="dialog" aria-modal="true"><div class="mh"><h3>${m.title}</h3><button class="x" onclick="${modal.type=="confirm"?"askNo()":"closeM()"}" aria-label="Fermer">×</button></div><div class="mb">${m.body}</div>${m.foot?`<div class="mf">${m.foot}</div>`:""}</div></div>`}
</script>
<script>
/* =================== ACTIONS =================== */
async function login(){const l=tval("li"),p=val("lp");if(!l||!p)return say("Renseignez l'identifiant et le mot de passe.");
 const u=vals(S.users).find(x=>x.login.toLowerCase()==l.toLowerCase());
 if(!u||u.hash!==await hashPw(u.login,p))return say("Identifiant ou mot de passe incorrect.");
 if(u.active===false)return say("Ce compte est suspendu. Contactez votre hiérarchie.");
 meId=u.id;lsSet("lsgov_session",u.id);view="accueil";keep={};lastUnread=-1;DBX.update("users/"+u.id,{lastLogin:Date.now()});log("Connexion à l'intranet",u.dept,"Connexion");render()}
function logout(){meId=null;lsSet("lsgov_session",null);modal=null;keep={};convWith=null;render()}
async function forcePw(){const a=val("np1"),b=val("np2");if(a.length<4)return say("Au moins 4 caractères.");if(a!==b)return say("Les deux mots de passe diffèrent.");
 const u=ME();if(await hashPw(u.login,a)==u.hash)return say("Choisissez un mot de passe différent de l'ancien.");
 await DBX.update("users/"+u.id,{hash:await hashPw(u.login,a),mustChange:false});keep={};toast("Mot de passe défini.");render()}
async function changePw(){const u=ME();if(await hashPw(u.login,val("op"))!==u.hash)return say("Mot de passe actuel incorrect.");const a=val("np1");if(a.length<4)return say("Au moins 4 caractères.");if(a!==val("np2"))return say("Les deux mots de passe diffèrent.");
 DBX.update("users/"+u.id,{hash:await hashPw(u.login,a)});clr("op","np1","np2");toast("Mot de passe modifié.");log("Changement de mot de passe",u.dept,"Comptes")}
function saveTel(){DBX.update("users/"+meId,{tel:tval("pt")});toast("Profil enregistré.")}

/* Service */

/* Dossiers */
function addDem(){const u=ME(),o=tval("no"),t=tval("nt"),d=val("nd");if(!o||!t)return say("Renseignez l'objet et les détails.");
 const id=nid();DBX.set("dossiers/"+id,{id,num:nextNum("dossiers","DOS"),ent:u.id,entNom:u.nom,dept:d,type:val("ny"),prio:val("np")||"normale",objet:o,det:t,st:"attente",t:Date.now()});
 log("Dépôt du dossier : "+o,d,"Dossiers");clr("no","nt");toast("Demande déposée.");go("mesdem")}
function dosComment(id){const t=tval("dc");if(!t)return;const u=ME();DBX.set(`dossiers/${id}/comments/${nid()}`,{t:Date.now(),u:u.id,nom:u.nom,txt:t,internal:!!val("dci")});clr("dc")}
function dosTake(id){const d=S.dossiers[id];DBX.update("dossiers/"+id,{st:"cours",assign:meId});log("Prise en charge : "+d.num,d.dept,"Dossiers")}
function dosAssign(id){const d=S.dossiers[id],a=val("das");DBX.update("dossiers/"+id,{assign:a||null,st:d.st=="attente"&&a?"cours":d.st});log(`Dossier ${d.num} assigné à ${a?uname(a):"personne"}`,d.dept,"Dossiers");toast("Assignation enregistrée.")}
function dosTreat(id,st){const d=S.dossiers[id],u=ME();if(!canTreat(d))return toast("Action non autorisée.",1);
 const mo=tval("dmo");if(st=="no"&&!mo)return say("Indiquez le motif du refus.");
 DBX.update("dossiers/"+id,{st,by:u.id,byNom:u.nom,tt:Date.now(),motif:mo||"",assign:d.assign||u.id});log((st=="ok"?"Dossier accepté : ":"Dossier refusé : ")+d.num+" — "+d.objet,d.dept,"Dossiers");toast(st=="ok"?"Dossier accepté.":"Dossier refusé.");closeM()}
function dosReopen(id){const d=S.dossiers[id];DBX.update("dossiers/"+id,{st:"cours",by:null,byNom:null,tt:null});log("Dossier rouvert : "+d.num,d.dept,"Dossiers")}
function dosDel(id){const d=S.dossiers[id];ask("Supprimer définitivement le dossier "+d.num+" ?",()=>{DBX.remove("dossiers/"+id);log("Dossier supprimé : "+d.num,d.dept,"Dossiers");modal=null},"Supprimer")}

/* Justice */
function affCreate(){const t=tval("an");if(!t)return say("Indiquez l'intitulé de l'affaire.");const id=nid(),u=ME(),j=val("aj");
 DBX.set("affaires/"+id,{id,num:nextNum("affaires","AFF"),titre:t,type:val("aty"),juge:j||"",plaignant:tval("apl"),accuse:tval("aac"),desc:tval("ade"),secret:!!val("ase"),st:"ouverte",t:Date.now(),by:u.id,from:modal.from||""});
 if(modal.from){const d=S.dossiers[modal.from];if(d&&(d.st=="attente"||d.st=="cours"))DBX.set(`dossiers/${d.id}/comments/${nid()}`,{t:Date.now(),u:u.id,nom:u.nom,txt:"Une affaire judiciaire a été ouverte suite à ce dossier.",internal:false})}
 log("Ouverture de l'affaire : "+t,"Justice","Justice");toast("Affaire ouverte.");modal={type:"affaire",id};keep={};render()}
function affPiece(id){const t=tval("ptx");if(!t)return say("Rédigez le contenu de la pièce.");const u=ME(),a=S.affaires[id],k=val("pk"),li=tval("pli");if(li&&!/^https?:\/\//.test(li))return say("Le lien doit commencer par http:// ou https://");
 DBX.set(`affaires/${id}/pieces/${nid()}`,{t:Date.now(),u:u.id,nom:u.nom,kind:k,txt:t,link:li});if(a.st=="ouverte")DBX.update("affaires/"+id,{st:"instruction"});
 log(`${PK[k]} versée à l'affaire ${a.num}`,"Justice","Justice");clr("ptx","pli");toast("Pièce versée au dossier.")}
function affManage(id){const a=S.affaires[id],st=val("ast2"),j=val("aj2"),au=val("aau2");const up={st,juge:j,audience:au};if(au&&st=="ouverte"||au&&st=="instruction")up.st="audience";
 DBX.update("affaires/"+id,up);log(`Affaire ${a.num} : statut « ${AST[up.st][0]} »${j?", juge "+uname(j):""}${au?", audience le "+fd(au):""}`,"Justice","Justice");toast("Affaire mise à jour.")}
function affVerdict(id){const a=S.affaires[id],u=ME(),tx=tval("vtx");if(!tx)return say("Rédigez le dispositif du jugement.");const pe=tval("vpe"),am=num(val("vam"));
 DBX.update("affaires/"+id,{st:"jugee",verdict:{txt:tx,peine:pe,amende:am,t:Date.now(),by:u.id,nom:u.nom}});
 if(val("vfa")&&am>0){const fid=nid(),acc=vals(S.users).find(x=>x.role=="entreprise"&&x.nom.toLowerCase()==(a.accuse||"").toLowerCase());DBX.set("factures/"+fid,{id:fid,num:nextNum("factures","FAC"),kind:"amende",ent:acc?acc.id:"",entNom:a.accuse||"—",motif:"Jugement "+a.num+" — "+a.titre,montant:am,ech:"",dept:"Justice",st:"due",t:Date.now(),by:u.id,byNom:u.nom})}
 log(`Jugement rendu dans l'affaire ${a.num}${pe?" : "+pe:""}`,"Justice","Justice");toast("Jugement prononcé.")}
function affReopen(id){const a=S.affaires[id];DBX.update("affaires/"+id,{st:"instruction"});log("Réouverture de l'affaire "+a.num,"Justice","Justice")}
function affDel(id){const a=S.affaires[id];ask("Supprimer définitivement l'affaire "+a.num+" et toutes ses pièces ?",()=>{DBX.remove("affaires/"+id);log("Affaire supprimée : "+a.num,"Justice","Justice");modal=null},"Supprimer")}

/* Registres */
const REGD={entreprises:"Intérieur",identites:"État-Civil"};
function regSave(s,id){if(!regCanEdit(s))return say("Seul le département Finances peut modifier ce registre.");const R=REG[s],o={};for(const f of R.f){let v=tval("rf_"+f.k);if(f.type=="number")v=v===""?"":num(v);if(f.req&&v==="")return say("Champ requis : "+f.l);o[f.k]=v}
 if(o.photo&&!/^https?:\/\//.test(o.photo))return say("Le lien de la photo doit commencer par http(s)://");
 if(id){o.mt=Date.now();DBX.update(`${s}/${id}`,o)}else{id=nid();Object.assign(o,{id,t:Date.now(),by:meId});DBX.set(`${s}/${id}`,o)}
 log(`${R.t} : fiche « ${(o.prenom?o.prenom+" ":"")+o.nom} » ${modal.id?"modifiée":"créée"}`,REGD[s],"Registres");toast("Fiche enregistrée.");closeM()}
function regDel(s,id){if(!regCanEdit(s))return;const r=S[s][id];ask("Supprimer la fiche « "+r.nom+" » ?",()=>{DBX.remove(`${s}/${id}`);log(`${REG[s].t} : fiche « ${r.nom} » supprimée`,REGD[s],"Registres");modal=null},"Supprimer")}

/* Finances */
function addTx(){const m=num(val("fm")),l=tval("fl");if(m<=0||!l)return say("Montant et libellé requis.");const id=nid(),u=ME(),dp=val("fdp");
 DBX.set("transactions/"+id,{id,t:Date.now(),type:val("ft"),cat:val("fc"),dept:dp=="Général"?"":dp,montant:m,label:l,by:u.id,byNom:u.nom});log(`Opération ${val("ft")=="in"?"recette":"dépense"} : ${l} (${money(m)})`,"Finances","Finances");clr("fm","fl");toast("Opération enregistrée.")}
function delTx(id){const t=S.transactions[id];ask("Supprimer l'opération « "+t.label+" » ("+money(t.montant)+") ?",()=>{DBX.remove("transactions/"+id);log("Opération supprimée : "+t.label,"Finances","Finances")},"Supprimer")}
function addBill(){if(!canBill())return toast("Seuls les départements Finances et Justice peuvent émettre en comptabilité.",1);const m=num(val("bm")),mo=tval("bmo"),e=val("be"),n=tval("bn");if(m<=0||!mo)return say("Montant et motif requis.");if(!e&&!n)return say("Choisissez un compte ou saisissez un nom.");
 const id=nid(),u=ME();DBX.set("factures/"+id,{id,num:nextNum("factures","FAC"),kind:val("bk"),ent:e,entNom:e?uname(e):n,motif:mo,montant:m,ech:val("bd"),dept:val("bdp"),st:"due",t:Date.now(),by:u.id,byNom:u.nom});
 log(`${kindL(val("bk"))} émise à ${e?uname(e):n} : ${money(m)}`,"Finances","Finances");clr("bm","bmo","bn","bd");toast("Émise.")}
function encaisser(f,extra){const u=ME();DBX.update("factures/"+f.id,Object.assign({st:"payee",paidT:Date.now(),vBy:u.id,vNom:u.nom,rejet:null},extra||{}));const tid=nid();DBX.set("transactions/"+tid,{id:tid,t:Date.now(),type:"in",cat:f.kind=="amende"?"Amendes":f.kind=="taxe"?"Impôts":"Factures",dept:f.dept||"Finances",montant:num(f.montant),label:`${f.num} — ${f.entNom} — ${f.motif}`,fac:f.id,by:u.id,byNom:u.nom})}
function payFact(id){const f=S.factures[id],u=ME();if(!canBill())return;ask(`Marquer ${kindL(f.kind).toLowerCase()} ${f.num} de ${money(f.montant)} comme payée (paiement constaté directement) ?`,()=>{

/* Preuves de paiement */
const proofCache={};
function loadProof(fid){if(proofCache[fid]!==undefined||loadProof.p[fid])return;loadProof.p[fid]=1;
 const done=v=>{proofCache[fid]=v||null;delete loadProof.p[fid];render()};
 if(db)db.ref(ROOT+"/preuves/"+fid).once("value").then(s=>done(s.val()),e=>{fbErr(e);done(null)});else done(S.preuves&&S.preuves[fid])}
loadProof.p={};
function proofFile(file){if(!file||!modal||modal.type!="notif")return;
 if(file.type=="application/pdf"){if(file.size>3e6)return toast("PDF trop lourd (3 Mo max). Envoyez plutôt une capture d'écran.",1);const r=new FileReader();r.onload=()=>{modal.proof={data:r.result,name:file.name||"preuve.pdf",type:file.type,size:file.size};render()};r.readAsDataURL(file);return}
 if(!file.type.startsWith("image/"))return toast("Format non pris en charge : image ou PDF uniquement.",1);
 modal.busy=1;render();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height,mx=1600;if(w>mx||h>mx){const k=mx/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);let q=.85,d=c.toDataURL("image/jpeg",q);while(d.length>1.4e6&&q>.4){q-=.15;d=c.toDataURL("image/jpeg",q)}
  if(modal&&modal.type=="notif"){modal.proof={data:d,name:(file.name&&file.name!="image.png"?file.name:"capture.png").replace(/\.[^.]+$/,"")+".jpg",type:"image/jpeg",size:Math.round(d.length*.75)};modal.busy=0;render()}};
  im.onerror=()=>{modal.busy=0;toast("Image illisible.",1);render()};im.src=r.result};r.readAsDataURL(file)}
document.addEventListener("paste",e=>{if(!modal||modal.type!="notif"||!e.clipboardData)return;const it=[...e.clipboardData.items].find(i=>i.kind=="file"&&(i.type.startsWith("image/")||i.type=="application/pdf"));if(it){e.preventDefault();proofFile(it.getAsFile())}});
function sendNotif(fid){const f=S.factures[fid],u=ME(),p=modal.proof;if(!f||f.ent!=u.id)return;if(!p)return say("Joignez une preuve de paiement.");
 DBX.set("preuves/"+fid,{data:p.data,name:p.name,type:p.type,size:p.size,t:Date.now(),by:u.id});proofCache[fid]=Object.assign({},p);
 DBX.update("factures/"+fid,{st:"verif",proof:true,notifT:Date.now(),notifRef:tval("nref"),notifDate:val("ndt"),notifCom:tval("ncom"),rejet:null});
 log(`Paiement notifié par ${u.nom} pour ${f.num} (${money(f.montant)}) — en attente de vérification`,"Finances","Finances");toast("Notification envoyée. Les Finances vont vérifier votre paiement.");closeM()}
function validatePay(fid){const f=S.factures[fid];if(!canBill()||f.st!="verif")return;ask(`Confirmer la réception de ${money(f.montant)} de ${f.entNom} pour ${f.num} ?`,()=>{encaisser(f);log(`Paiement validé : ${f.num} (${money(f.montant)}) de ${f.entNom}`,"Finances","Finances");toast("Paiement validé et encaissé.");modal=null},"Valider le paiement")}
function rejectPay(fid){const f=S.factures[fid],m=tval("vrj");if(!canBill())return;if(!m)return say("Indiquez le motif du refus pour l'entreprise.");
 DBX.update("factures/"+fid,{st:"due",rejet:m,rejT:Date.now(),rejBy:meId});log(`Preuve refusée pour ${f.num} (${f.entNom}) : ${m}`,"Finances","Finances");toast("Preuve refusée. L'entreprise a été informée.");closeM()}

/* État civil : actes */
function fileToData(file){return new Promise((res,rej)=>{if(!file)return rej(new Error("Aucun fichier"));
 if(file.type=="application/pdf"){if(file.size>3e6)return rej(new Error("PDF trop lourd (3 Mo max) : "+file.name));const r=new FileReader();r.onload=()=>res({data:r.result,name:file.name||"document.pdf",type:file.type,size:file.size});r.onerror=()=>rej(new Error("Lecture impossible"));r.readAsDataURL(file);return}
 if(!(file.type||"").startsWith("image/"))return rej(new Error("Format non pris en charge : "+(file.name||"fichier")));
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height,mx=2000;if(w>mx||h>mx){const k=mx/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);let q=.88,d=c.toDataURL("image/jpeg",q);while(d.length>1.6e6&&q>.4){q-=.12;d=c.toDataURL("image/jpeg",q)}
  res({data:d,name:((file.name&&file.name!="image.png")?file.name:"capture.png").replace(/\.[^.]+$/,"")+".jpg",type:"image/jpeg",size:Math.round(d.length*.75)})};im.onerror=()=>rej(new Error("Image illisible"));im.src=r.result};r.readAsDataURL(file)})}
async function addActeFiles(list){if(!modal||modal.type!="acteEdit")return;const arr=[...(list||[])];if(!arr.length)return;modal.busy=1;render();modal.files=modal.files||[];
 for(const f of arr){try{modal.files.push(await fileToData(f))}catch(e){toast(e.message,1)}}modal.busy=0;render()}

 if(!nom||!pre)return say("Le nom et le prénom de la personne concernée sont obligatoires.");

 const now=Date.now(),aid=id||nid(),fields={cat,nom,prenom:pre,tel:tval("atel"),naiss:val("anai"),dateActe:val("adt"),notes:tval("anot")};

 if(!a){DBX.set("actes/"+aid,Object.assign({id:aid,num:nextNum("actes","EC"),files:fmeta,t:now,by:u.id,byNom:u.nom},fields));histAdd(aid,"Création",`${(ECL[cat]||[])[1]} — ${pre} ${nom} · ${nf.length} pièce(s)`);

 else{const ch=Object.keys(fields).filter(k=>String(a[k]||"")!==String(fields[k]||"")).map(k=>({cat:"catégorie",nom:"nom",prenom:"prénom",tel:"numéro",naiss:"date de naissance",dateActe:"date de l'acte",notes:"mentions"}[k]));

  histAdd(aid,"Modification",det||"aucun changement");log(`Acte ${a.num} modifié${det?" ("+det+")":""}`,"État-Civil","État civil");toast("Acte mis à jour.")}
 modal={type:"acte",id:aid};keep={};render()}
