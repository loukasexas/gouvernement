<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portail Gouvernemental</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f4f8;--cd:#fff;--tx:#14182b;--mu:#6b7186;--pr:#1d3a8a;--ok:#16794a;--no:#b42318;--wa:#b7791f;--bd:#dde0ea}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1220;--cd:#171c2f;--tx:#e8ebf5;--mu:#98a0b8;--pr:#6c8cff;--ok:#3ecf8e;--no:#ff7b72;--wa:#e3b341;--bd:#2a3150}}
:root[data-theme="dark"]{--bg:#0e1220;--cd:#171c2f;--tx:#e8ebf5;--mu:#98a0b8;--pr:#6c8cff;--ok:#3ecf8e;--no:#ff7b72;--wa:#e3b341;--bd:#2a3150}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--cd);border-bottom:1px solid var(--bd)}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
nav button{background:var(--cd);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}
nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{max-width:980px;margin:0 auto;padding:8px 16px 32px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
h2,h3{margin:0 0 10px}
.mu{color:var(--mu);font-size:13px}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px 10px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
td input{width:90px;margin:0}
button{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.ok{background:var(--ok)}button.no{background:var(--no)}button.gh{background:transparent;color:var(--mu);border:1px solid var(--bd)}
.b{padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.b.ok{color:var(--ok)}.b.no{color:var(--no)}.b.wa{color:var(--wa)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 10px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0 12px}
.st b{font-size:28px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:middle}
.ck{display:inline-flex;gap:3px;align-items:center;margin-right:8px;font-size:13px}.ck input{width:auto;margin:0}
.lgn{max-width:360px;margin:12vh auto;padding:0 16px}
.err{color:var(--no);min-height:1.2em}
.lg{padding:5px 0;border-bottom:1px solid var(--bd);font-size:14px}
</style></head>
<body><div id="root"></div>
<script>
const D=["Finances","État-Civil","Justice","Intérieur","Communication","Sécurité"];
const R={entreprise:"Entreprise",fonctionnaire:"Fonctionnaire",encadrement:"Corps d'encadrement",direction:"Direction"};
const K="gov_rp_v1";let S,me=null,tab="",df="";
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S={users:[{id:1,login:"direction",pw:"direction",role:"direction",nom:"Direction",dept:"",rate:0,perms:{}}],dem:[],logs:[],n:2};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const U=id=>S.users.find(u=>u.id==id);
const fd=t=>new Date(t).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
const dur=ms=>{let m=Math.floor(ms/6e4);return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"min"};
const money=n=>"$"+Math.round(n||0).toLocaleString("fr-FR");
const opts=a=>a.map(x=>`<option>${x}</option>`).join("");
const ST={attente:["En attente","wa"],ok:["Acceptée","ok"],no:["Refusée","no"]};
const badge=s=>`<span class="b ${ST[s][1]}">${ST[s][0]}</span>`;
const done=u=>S.dem.filter(d=>d.by==u.id).length;
const pay=u=>done(u)*(u.rate||0)+(u.bonus||0);
const scopeU=()=>S.users.filter(u=>u.id!=me.id&&(me.role=="direction"||u.role=="entreprise"||(u.role=="fonctionnaire"&&u.dept==me.dept)));
const agents=()=>scopeU().filter(u=>u.role=="fonctionnaire"||u.role=="encadrement");
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function log(m,d){S.logs.unshift({t:Date.now(),u:me?me.nom:"—",m,d:d||""});S.logs=S.logs.slice(0,200)}
function tabs(){const p=me.perms||{};
 if(me.role=="entreprise")return["Nouvelle demande","Mes demandes"];
 if(me.role=="fonctionnaire")return["Service","Dossiers","Salaire"];
 if(me.role=="encadrement")return["Dossiers"].concat(p.comptes?["Comptes"]:[],p.salaires?["Salaires"]:[],p.logs?["Journal"]:[]);
 return["Vue d'ensemble","Dossiers","Comptes","Salaires","Journal"]}
const V={};
V["Nouvelle demande"]=()=>`<div class="card"><h3>Nouvelle demande</h3><label>Département<select id="nd">${opts(D)}</select></label><label>Objet<input id="no" maxlength="80"></label><label>Détails<textarea id="nt" rows="4" maxlength="500"></textarea></label><button onclick="addDem()">Envoyer</button><p class="err" id="msg"></p></div>`;
V["Mes demandes"]=()=>{const L=S.dem.filter(d=>d.ent==me.id).sort((a,b)=>b.t-a.t);
 return L.map(d=>`<div class="card"><b>${esc(d.objet)}</b> ${badge(d.st)}<div class="mu">${d.dept} · ${fd(d.t)}</div><p>${esc(d.det)}</p>${d.st!="attente"?`<div class="mu">Traité par ${esc(d.byNom)} · ${fd(d.tt)}</div>`:""}</div>`).join("")||`<p class="mu">Aucune demande.</p>`};
V.Service=()=>{const s=me.svc||{on:0,since:0,total:0};const t=s.total+(s.on?Date.now()-s.since:0);
 return `<div class="card"><h3>Service — ${me.dept}</h3><p>Statut : ${s.on?'<span class="b ok">En service</span>':'<span class="b no">Hors service</span>'}</p><p>Temps total : <b>${dur(t)}</b></p><button class="${s.on?"no":"ok"}" onclick="toggleSvc()">${s.on?"Se mettre hors service":"Se mettre en service"}</button></div>`};
V.Dossiers=()=>{const ds=me.role=="direction"?(df?[df]:D):[me.dept];
 const L=S.dem.filter(d=>ds.includes(d.dept)).sort((a,b)=>(a.st=="attente"?0:1)-(b.st=="attente"?0:1)||b.t-a.t);
 const can=me.role!="fonctionnaire"||(me.svc&&me.svc.on);
 return (me.role=="direction"?`<select onchange="df=this.value;render()"><option value="">Tous les départements</option>${D.map(d=>`<option ${d==df?"selected":""}>${d}</option>`).join("")}</select>`:`<h3>Département : ${me.dept}</h3>`)
 +(can?"":`<p class="mu">Mettez-vous en service pour traiter les dossiers.</p>`)
 +(L.map(d=>`<div class="card"><b>${esc(d.objet)}</b> ${badge(d.st)}<div class="mu">${d.dept} · ${esc(d.entNom)} · ${fd(d.t)}</div><p>${esc(d.det)}</p>${d.st=="attente"?(can?`<button class="ok" onclick="treat(${d.id},'ok')">Accepter</button> <button class="no" onclick="treat(${d.id},'no')">Refuser</button>`:""):`<div class="mu">Traité par ${esc(d.byNom)} · ${fd(d.tt)}</div>`}</div>`).join("")||`<p class="mu">Aucun dossier.</p>`)};
V.Salaire=()=>`<div class="card"><h3>Mon salaire</h3><p>Dossiers traités : <b>${done(me)}</b></p><p>Tarif par dossier : <b>${money(me.rate)}</b></p><p>Bonus / ajustement : ${money(me.bonus)}</p><p style="font-size:1.4em">Total : <b>${money(pay(me))}</b></p></div>`;
V.Salaires=()=>`<div class="card"><h3>Gestion des salaires</h3><div class="sc"><table><tr><th>Agent<th>Dept<th>Dossiers<th>Tarif<th>Bonus<th>Total</tr>${agents().map(u=>`<tr><td>${esc(u.nom)}<td>${u.dept}<td>${done(u)}<td><input type="number" value="${u.rate||0}" onchange="setF(${u.id},'rate',this.value)"><td><input type="number" value="${u.bonus||0}" onchange="setF(${u.id},'bonus',this.value)"><td><b>${money(pay(u))}</b></tr>`).join("")}</table></div></div>`;
V.Comptes=()=>{const dir=me.role=="direction";const rs=dir?["entreprise","fonctionnaire","encadrement","direction"]:["entreprise","fonctionnaire"];
 return `<div class="card"><h3>Créer un compte</h3><div class="g"><input id="cn" placeholder="Nom affiché"><input id="cl" placeholder="Identifiant"><input id="cp" placeholder="Mot de passe"><select id="cr">${rs.map(r=>`<option value="${r}">${R[r]}</option>`).join("")}</select>${dir?`<select id="cd">${opts(D)}</select>`:""}</div><button onclick="addUser()">Créer</button><p class="err" id="msg"></p></div>
 <div class="card"><h3>Comptes</h3><div class="sc"><table><tr><th>Nom<th>Identifiant<th>Rôle<th>Dept<th>Permissions<th></tr>${scopeU().map(u=>`<tr><td>${esc(u.nom)}<td>${esc(u.login)}<td>${R[u.role]}<td>${u.dept||"—"}<td>${dir&&u.role=="encadrement"?[["comptes","Comptes"],["salaires","Salaires"],["logs","Journal"]].map(([k,l])=>`<label class="ck"><input type="checkbox" ${u.perms&&u.perms[k]?"checked":""} onchange="perm(${u.id},'${k}',this.checked)">${l}</label>`).join(""):"—"}<td><button class="no" onclick="delU(${u.id})">Suppr.</button></tr>`).join("")}</table></div></div>`};
V.Journal=()=>`<div class="card"><h3>Journal d'activité</h3>${S.logs.filter(l=>me.role=="direction"||l.d==me.dept).map(l=>`<div class="lg"><span class="mu">${fd(l.t)}</span> <b>${esc(l.u)}</b> — ${esc(l.m)}</div>`).join("")||`<p class="mu">Aucune activité.</p>`}</div>`;
V["Vue d'ensemble"]=()=>{const c=s=>S.dem.filter(d=>d.st==s).length;
 return `<div class="g4">${[["En attente",c("attente")],["Acceptées",c("ok")],["Refusées",c("no")],["Agents en service",S.users.filter(u=>u.svc&&u.svc.on).length]].map(([l,n])=>`<div class="card st"><div class="mu">${l}</div><b>${n}</b></div>`).join("")}</div>
 <div class="card"><h3>Par département</h3><div class="sc"><table><tr><th>Département<th>Attente<th>Acceptées<th>Refusées<th>Agents</tr>${D.map(d=>{const f=s=>S.dem.filter(x=>x.dept==d&&x.st==s).length;return `<tr><td>${d}<td>${f("attente")}<td>${f("ok")}<td>${f("no")}<td>${S.users.filter(u=>u.dept==d&&(u.role=="fonctionnaire"||u.role=="encadrement")).length}</tr>`}).join("")}</table></div></div>`};
function shell(){const T=tabs();if(!T.includes(tab))tab=T[0];
 return `<header><div><b>🏛️ Portail Gouvernemental</b><div class="mu">${esc(me.nom)} · ${R[me.role]}${me.dept?" · "+me.dept:""}</div></div><button class="gh" onclick="out()">Déconnexion</button></header><nav>${T.map((t,i)=>`<button class="${t==tab?"on":""}" onclick="tab=tabs()[${i}];render()">${t}</button>`).join("")}</nav><main>${V[tab]()}</main>`}
function loginH(){return `<div class="lgn"><div class="card"><h2>🏛️ Portail Gouvernemental</h2><p class="mu">Connexion à l'espace sécurisé</p><input id="li" placeholder="Identifiant"><input id="lp" type="password" placeholder="Mot de passe" onkeydown="if(event.key=='Enter')login()"><button onclick="login()">Se connecter</button><p class="err" id="msg"></p><p class="mu">Compte initial : direction / direction</p></div></div>`}
function render(){save();$("#root").innerHTML=me?shell():loginH()}
function say(t){$("#msg").textContent=t}
function login(){const u=S.users.find(x=>x.login==$("#li").value.trim()&&x.pw==$("#lp").value);if(!u)return say("Identifiant ou mot de passe incorrect.");me=u;tab="";render()}
function out(){me=null;render()}
function addDem(){const o=$("#no").value.trim(),t=$("#nt").value.trim();if(!o||!t)return say("Renseignez l'objet et les détails.");
 S.dem.push({id:S.n++,ent:me.id,entNom:me.nom,dept:$("#nd").value,objet:o,det:t,st:"attente",t:Date.now()});log("Nouvelle demande : "+o,$("#nd").value);tab="Mes demandes";render()}
function treat(id,st){const d=S.dem.find(x=>x.id==id);d.st=st;d.by=me.id;d.byNom=me.nom;d.tt=Date.now();log((st=="ok"?"Acceptation : ":"Refus : ")+d.objet,d.dept);render()}
function toggleSvc(){const s=me.svc=me.svc||{on:0,since:0,total:0};if(s.on){s.total+=Date.now()-s.since;s.on=0}else{s.on=1;s.since=Date.now()}log(s.on?"Prise de service":"Fin de service",me.dept);render()}
function setF(id,f,v){const u=U(id);u[f]=+v||0;log(`${f=="rate"?"Tarif":"Bonus"} de ${u.nom} → ${money(u[f])}`,u.dept);render()}
function addUser(){const nom=$("#cn").value.trim(),l=$("#cl").value.trim(),p=$("#cp").value,r=$("#cr").value;
 if(!nom||!l||!p)return say("Tous les champs sont requis.");if(S.users.some(u=>u.login==l))return say("Cet identifiant existe déjà.");
 const d=(r=="entreprise"||r=="direction")?"":(me.role=="direction"?$("#cd").value:me.dept);
 S.users.push({id:S.n++,login:l,pw:p,role:r,nom,dept:d,rate:0,perms:r=="encadrement"?{comptes:0,salaires:0,logs:0}:{}});log(`Compte créé : ${nom} (${R[r]})`,d);render()}
function perm(id,k,v){const u=U(id);u.perms[k]=v;log(`Permission « ${k} » ${v?"accordée à":"retirée à"} ${u.nom}`,u.dept);save()}
function delU(id){const u=U(id);S.users=S.users.filter(x=>x.id!=id);log("Compte supprimé : "+u.nom,u.dept);render()}
render();
</script></body></html>
