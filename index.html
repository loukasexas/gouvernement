/* ---------- Utilitaires ---------- */

const tval=id=>String(val(id)).trim();

const vals=o=>Object.values(o||{}).filter(x=>x&&typeof x=="object");
const fd=t=>t?new Date(t).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}):"—";
const fdd=s=>{if(!s)return"—";const d=new Date(s.length==10?s+"T12:00":s);return isNaN(d)?esc(s):d.toLocaleDateString("fr-FR")};
const dur=ms=>{ms=Math.max(0,ms||0);const m=Math.floor(ms/6e4);return Math.floor(m/60)+" h "+String(m%60).padStart(2,"0")};
const clock=ms=>{ms=Math.max(0,ms||0);const s=Math.floor(ms/1e3);return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,"0")).join(":")};
const money=n=>Math.round(+n||0).toLocaleString("fr-FR")+" $";
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isNaN(n)?0:n};
const opts=(a,sel)=>a.map(x=>Array.isArray(x)?`<option value="${esc(x[0])}" ${x[0]==sel?"selected":""}>${esc(x[1])}</option>`:`<option ${x==sel?"selected":""}>${esc(x)}</option>`).join("");
const bdg=(m,s)=>{const x=m[s]||[s,"mu"];return `<span class="bdg ${x[1]}">${esc(x[0])}</span>`};
const nid=()=>DB_URL&&window.firebase?firebase.database().ref().push().key:(Date.now().toString(36)+Math.random().toString(36).slice(2,9));

const U=id=>S.users[id];
const ME=()=>meId?S.users[meId]:null;
const G=u=>u&&u.gradeId?S.grades[u.gradeId]:null;
const uname=id=>{const u=U(id);return u?u.nom:"—"};
const gname=u=>{const g=G(u);return g?g.name:ROLES[u.role]||""};
const isAgent=u=>u&&u.role!="entreprise";
const nextNum=(col,prefix)=>{const y=new Date().getFullYear();let mx=0;vals(S[col]).forEach(x=>{const m=String(x.num||"").match(/(\d+)$/);if(m)mx=Math.max(mx,+m[1])});return `${prefix}-${y}-${String(mx+1).padStart(4,"0")}`};
async function sha(s){if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return "x"+h}
const hashPw=(login,pw)=>sha("lsgov|"+login.toLowerCase()+"|"+pw);
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}

/* ---------- Permissions ---------- */
function can(p){const u=ME();if(!u||u.role=="entreprise")return false;if(u.role=="direction")return true;
 const g=G(u);return !!((g&&g.perms&&g.perms[pk(p)])||(u.xperms&&u.xperms[pk(p)]))}
const isDir=()=>{const u=ME();return u&&u.role=="direction"};
function myDepts(){const u=ME();return (isDir()||can("dos.all"))?DEPTS():(u&&u.dept?[u.dept]:[])}
function manageable(u){const m=ME();if(!m||!u||u.id==m.id)return false;if(isDir())return true;
 return u.role=="entreprise"||(u.role=="fonctionnaire"&&u.dept&&u.dept==m.dept)}
/* Taxes : taux spécifique de l'entreprise > taux de son type > taux par défaut */
const TCATS=()=>Object.entries(S.config.taxCats||{}).filter(([k,c])=>c&&typeof c=="object").map(([id,c])=>Object.assign({id},c)).sort((a,b)=>(a.rank??99)-(b.rank??99)||String(a.name).localeCompare(b.name));
const hasOwnRate=u=>u&&u.taxRate!==undefined&&u.taxRate!==null&&u.taxRate!=="";
function taxRate(u){if(hasOwnRate(u))return num(u.taxRate);const c=u&&u.taxCat&&S.config.taxCats&&S.config.taxCats[u.taxCat];return c?num(c.rate):num(S.config.tax)}
function taxCatName(u){const c=u&&u.taxCat&&S.config.taxCats&&S.config.taxCats[u.taxCat];return c?c.name:"Sans type"}
/* Comptabilité : seuls les départements Finances et Justice (et la Direction) peuvent émettre et traiter */
const BILL_DEPTS=["Finances","Justice"];
function canBill(){const u=ME();return can("fin.bill")&&(isDir()||!!(u&&BILL_DEPTS.includes(u.dept)))}
function gradeEditable(g){if(isDir())return true;const m=ME();return can("rh.grades")&&g.role=="fonctionnaire"&&g.dept==m.dept}

/* ---------- Couche de données (Firebase ou local) ---------- */
function setAt(path,v){const p=path.split("/");let o=S;for(let i=0;i<p.length-1;i++){if(!o[p[i]]||typeof o[p[i]]!="object")o[p[i]]={};o=o[p[i]]}
 const k=p[p.length-1];if(v===null||v===undefined)delete o[k];else o[k]=JSON.parse(JSON.stringify(v))}
const LKEY="lsgov_local_v2";
let db=null;
const DBX={
 set(path,v){setAt(path,v);persist();schedule();if(db)return db.ref(ROOT+"/"+path).set(v===undefined?null:v).catch(fbErr);return Promise.resolve()},
 update(path,obj){for(const k in obj)setAt(path+"/"+k,obj[k]);persist();schedule();if(db)return db.ref(ROOT+"/"+path).update(obj).catch(fbErr);return Promise.resolve()},
 remove(path){return DBX.set(path,null)},
 replaceAll(data){if(db)return db.ref(ROOT).set(data).catch(fbErr);S={config:{}};COLS.forEach(c=>S[c]={});Object.assign(S,data||{});S.config=S.config||{};COLS.forEach(c=>S[c]=S[c]||{});persist();schedule();return Promise.resolve()}
};
function persist(){if(!db)lsSet(LKEY,JSON.stringify(S))}
function fbErr(e){console.error(e);toast("Erreur de synchronisation : "+(e&&e.message||e),1)}
function startData(){
 if(DB_URL&&window.firebase){
  try{firebase.initializeApp({databaseURL:DB_URL});db=firebase.database()}catch(e){bootErr="Impossible d'initialiser Firebase : "+e.message;render();return}
  const loaded=new Set(),all=[...COLS,"config"];
  db.ref(".info/connected").on("value",s=>{connected=!!s.val();schedule()});
  all.forEach(c=>{let r=db.ref(ROOT+"/"+c);if(c=="logs"||c=="messages")r=r.limitToLast(c=="logs"?800:1500);
   r.on("value",s=>{S[c]=s.val()||{};if(!loaded.has(c)){loaded.add(c);if(loaded.size==all.length)boot()}schedule()},
   e=>{bootErr="Accès à la base refusé : vérifie l'URL et les règles Firebase. ("+e.message+")";render()})});
  setTimeout(()=>{if(!ready&&!bootErr){bootErr="La base Firebase ne répond pas. Vérifie l'URL dans le fichier et ta connexion.";render()}},15000);
 }else{
  if(DB_URL&&!window.firebase)bootErr="Le SDK Firebase n'a pas pu être chargé (connexion internet ?).";
  try{const d=JSON.parse(lsGet(LKEY)||"null");if(d){S=d;S.config=S.config||{};COLS.forEach(c=>S[c]=S[c]||{})}}catch(e){}
  window.addEventListener("storage",e=>{if(e.key==LKEY&&e.newValue){try{S=JSON.parse(e.newValue);schedule()}catch(x){}}});
  boot();
 }
}
async function boot(){try{
 if(!Object.keys(S.users).length){
  const id=nid();
  await DBX.set("users/"+id,{id,login:"direction",hash:await hashPw("direction","direction"),nom:"Cabinet du Gouverneur",role:"direction",gradeId:"",dept:"",matricule:"DIR-001",active:true,mustChange:true,created:Date.now()});
 }
 if(!Object.keys(S.grades).length)seedGrades();
 if(!S.config||!S.config.siteName)DBX.update("config",{siteName:"Gouvernement de Los Santos",subtitle:"État de San Andreas — Intranet officiel",depts:DEF_DEPTS,tax:8,requireService:true,treasuryStart:250000,budgets:{},banner:{on:true,txt:"Bienvenue sur l'intranet du Gouvernement de Los Santos. Pensez à prendre votre service avant de traiter les dossiers.",lvl:"info"},maintenance:{on:false,msg:""}});
 if(!S.config.taxCatsInit){const o={},L=[["Hôpitaux",0],["Forces de l'ordre",0],["Concessionnaires",15],["Garages mécaniques",30],["Commerces",10],["Restauration",10]];L.forEach(([name,rate],i)=>{o[nid()+i]={name,rate,rank:i}});DBX.update("config",{taxCats:o,taxCatsInit:true})}
 const sid=lsGet("lsgov_session");if(sid&&S.users[sid]&&S.users[sid].active!==false)meId=sid;
} catch(e){console.error(e);toast("Erreur d'initialisation : "+e.message,1)}
 ready=true;applyTheme();render();
}

/* ---------- Rendu ---------- */
let schT=0;
function schedule(){if(schT)return;schT=setTimeout(()=>{schT=0;if(ready)render()},40)}
function render(){
 const root=$("#root");if(!root)return;
 const ae=document.activeElement;let fid=ae&&ae.id,ss=null,se=null;try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e){}
 root.querySelectorAll("input[id],textarea[id],select[id]").forEach(e=>{if(e.type!="checkbox"&&e.type!="file"&&!e.hasAttribute("data-nokeep"))keep[e.id]=e.value});
 const mbd=root.querySelector(".modal .mb"),mbs=mbd?mbd.scrollTop:0;const mb=root.querySelector(".modal-bg"),ms=mb?mb.scrollTop:0,tb=root.querySelector(".thread .body"),ts=tb?tb.scrollTop:0,tAtEnd=tb?tb.scrollHeight-tb.scrollTop-tb.clientHeight<40:true;
 let h;try{h=page()}catch(e){console.error(e);h=`<div class="login"><div class="box card"><h3>Erreur d'affichage</h3><p class="mu">${esc(e.message)}</p><button class="btn" onclick="modal=null;go('accueil')">Revenir à l'accueil</button></div></div>`}
 root.innerHTML=h;
 for(const id in keep){const e=document.getElementById(id);if(e&&e.type!="checkbox"&&!e.hasAttribute("data-nokeep")&&e.value!==keep[id]){if(e.tagName=="SELECT"&&![...e.options].some(o=>o.value==keep[id]))continue;e.value=keep[id]}}
 if(fid){const e=document.getElementById(fid);if(e){e.focus({preventScroll:true});try{if(ss!=null)e.setSelectionRange(ss,se)}catch(x){}}}
 const mb2=root.querySelector(".modal-bg");if(mb2)mb2.scrollTop=ms;const mbd2=root.querySelector(".modal .mb");if(mbd2)mbd2.scrollTop=mbs;
 const tb2=root.querySelector(".thread .body");if(tb2)tb2.scrollTop=tAtEnd?tb2.scrollHeight:ts;
 tickClocks();notify();
 document.title=(unread()?"("+unread()+") ":"")+"Intranet — "+(S.config.siteName||"Gouvernement de Los Santos");
}
function clr(...ids){ids.forEach(id=>{delete keep[id];const e=document.getElementById(id);if(e){if(e.type=="checkbox")e.checked=false;else e.value=""}})}
function go(v,s){view=v;sub=s||"";modal=null;keep={};closeSide();render();window.scrollTo(0,0)}
function setSub(s){sub=s;keep={};render()}
function openM(type,id,extra){modal=Object.assign({type,id},extra||{});keep={};render()}
function closeM(){modal=null;keep={};render()}
function ask(msg,cb,label){pendingCb=cb;modal={type:"confirm",msg,label:label||"Confirmer",prev:modal};render()}
function askOk(){const cb=pendingCb;pendingCb=null;const p=modal&&modal.prev;modal=p||null;if(cb)cb();render()}
function askNo(){pendingCb=null;modal=modal&&modal.prev||null;render()}
function tickClocks(){document.querySelectorAll("[data-since]").forEach(e=>{e.textContent=clock(Date.now()-(+e.dataset.since)+(+e.dataset.base||0))})}
setInterval(tickClocks,1000);
function unread(){const m=ME();return m?vals(S.messages).filter(x=>x.to==m.id&&!x.read).length:0}
function notify(){const n=unread();if(lastUnread>=0&&n>lastUnread&&!(view=="messages"))toast("Nouveau message reçu");lastUnread=n}
function applyTheme(){setFavicon();const t=lsGet("lsgov_theme")||"dark";document.documentElement.setAttribute("data-theme",t);
 const a=S.config&&S.config.accent;if(a&&/^#[0-9a-f]{6}$/i.test(a)){document.documentElement.style.setProperty("--gold",a);document.documentElement.style.setProperty("--gold2",a)}else{document.documentElement.style.removeProperty("--gold");document.documentElement.style.removeProperty("--gold2")}}

function openSide(){$(".side")&&$(".side").classList.add("open");$(".scrim")&&$(".scrim").classList.add("open")}
function closeSide(){$(".side")&&$(".side").classList.remove("open");$(".scrim")&&$(".scrim").classList.remove("open")}

<script>
/* =================== STRUCTURE =================== */
function page(){
 if(bootErr&&!ready)return `<div class="login"><div class="box"><div class="seal">${seal()}</div><div class="card"><h3>Connexion à la base impossible</h3><p class="err">${esc(bootErr)}</p></div></div></div>`;
 if(!ready)return `<div class="login"><div class="box"><div class="seal">${seal()}</div><p class="mu">Connexion au serveur gouvernemental…</p></div></div>`;
 const u=ME();
 if(!u||u.active===false){meId=null;return loginPage()+modalH()}
 if(u.mustChange)return pwChangePage();
 const mt=S.config.maintenance||{};
 if(mt.on&&!isDir()&&!can("adm.site"))return `<div class="login"><div class="box"><div class="seal">${seal()}</div><div class="card"><h3>Maintenance en cours</h3><p class="pre">${esc(mt.msg||"L'intranet est temporairement indisponible.")}</p><button class="btn sec" onclick="logout()">Se déconnecter</button></div></div></div>`;
 const N=navItems();if(!N.some(n=>n[0]==view))view=N[0][0];
 const bn=S.config.banner||{};

 <div class="form"><label class="f">Période<input id="dp" placeholder="Ex. : Semaine 40 — 2026"></label><label class="f">Chiffre d'affaires ($)<input id="dca" type="number" min="0" oninput="keep.dca=this.value;document.getElementById('dimp').textContent=money(num(this.value)*${tx}/100)"></label></div>
 <p>Impôt estimé : <b id="dimp">${money(num(keep.dca)*tx/100)}</b></p><button class="btn" onclick="declare()">Envoyer la déclaration</button><p class="err" id="msg"></p></div>
 <div class="card"><h3>Mes déclarations</h3><div class="tw"><table><tr><th>Période<th>CA<th>Impôt<th>Statut</tr>${Dc.map(d=>`<tr><td>${esc(d.periode)}<td>${money(d.ca)}<td>${money(d.impot)}<td>${d.st=="validee"?'<span class="bdg ok">Validée</span>':'<span class="bdg wa">En vérification</span>'}</tr>`).join("")||`<tr><td colspan="4" class="empty">Aucune déclaration.</td></tr>`}</table></div></div></div>
 <div class="card tw"><h3>Mes factures et amendes</h3><table><tr><th>N°<th>Nature<th>Motif<th>Montant<th>Échéance<th>Statut<th></tr>${F.map(f=>`<tr><td class="nw">${esc(f.num)}<td>${kindL(f.kind)}<td>${esc(f.motif)}<td class="b">${money(f.montant)}<td>${fdd(f.ech)}<td>${bdg(FST,f.st)}${f.st=="due"&&f.rejet?`<div class="sm" style="color:var(--no);margin-top:4px">Preuve refusée : ${esc(f.rejet)}</div>`:""}${f.st=="verif"?`<div class="mu sm" style="margin-top:4px">Envoyée le ${fd(f.notifT)}</div>`:""}<td class="nw">${f.st=="due"?`<button class="btn sm bl" onclick="openM('notif','${f.id}')">${f.rejet?"Renvoyer une preuve":"Notifier du paiement"}</button>`:""}</tr>`).join("")||`<tr><td colspan="7" class="empty">Aucune facture.</td></tr>`}</table></div>${entArchH(u)}`};
function entArchH(u){const A=vals(S.archives).filter(a=>a.perEnt&&a.perEnt[u.id]).sort((a,b)=>b.to-a.to);if(!A.length)return "";
 return `<div class="card tw"><h3>Historique fiscal</h3><p class="mu">Périodes fiscales clôturées et archivées par le Gouvernement.</p><table><tr><th>Période<th>Clôturée le<th>Taux<th class="r">CA déclaré<th class="r">Impôt<th class="r">Payé<th class="r">Reste dû</tr>${A.map(a=>{const e=a.perEnt[u.id];return `<tr><td class="b">${esc(a.name)}<td>${fd(a.to)}<td>${num(e.taux)} %<td class="r">${money(e.ca)}<td class="r">${money(e.impot)}<td class="r">${money(e.paye)}<td class="r ${num(e.reste)>0?"":"mu"}" style="${num(e.reste)>0?"color:var(--no)":""}">${money(e.reste)}</tr>`}).join("")}</table></div>`}
const kindL=k=>({facture:"Facture",amende:"Amende",taxe:"Impôt"}[k]||k);
const licB=s=>`<span class="bdg ${({Active:"ok",Suspendue:"wa",Expirée:"mu",Révoquée:"no","En demande":"bl"}[s]||"mu")}">${esc(s||"—")}</span>`;

/* =================== JUSTICE =================== */
function affVisible(a){return !a.secret||can("jus.secret")||a.juge==meId||a.by==meId||isDir()}
V.justice=()=>{const s=sub||"affaires";let h=`<div class="ph"><h2>Justice</h2>${can("jus.open")?`<button class="btn" onclick="openM('affaireNew')">${ic("plus")}Ouvrir une affaire</button>`:""}</div>${tabsH([["affaires","Affaires"],["audiences","Audiences à venir"],["mes","Mes affaires"]],s)}`;
 let L=vals(S.affaires).filter(affVisible);
 if(s=="audiences"){L=L.filter(a=>a.audience&&a.st=="audience").sort((a,b)=>a.audience.localeCompare(b.audience));
  return h+`<div class="card tw"><table><tr><th>Date<th>Affaire<th>Parties<th>Juge</tr>${L.map(a=>`<tr class="click" onclick="openM('affaire','${a.id}')"><td class="nw b">${fd(a.audience)}<td>${esc(a.num)} — ${esc(a.titre)}<td>${esc(a.plaignant||"—")} c/ ${esc(a.accuse||"—")}<td>${esc(uname(a.juge))}</tr>`).join("")||`<tr><td colspan="4" class="empty">Aucune audience programmée.</td></tr>`}</table></div>`}
 if(s=="mes")L=L.filter(a=>a.juge==meId||a.by==meId);
 if(filt.as)L=L.filter(a=>a.st==filt.as);if(filt.at)L=L.filter(a=>a.type==filt.at);
 L=L.filter(a=>match(filt.aq,a.num,a.titre,a.plaignant,a.accuse)).sort((a,b)=>b.t-a.t);
 const all=vals(S.affaires).filter(affVisible);
 return h+`<div class="kpis">${kpi("Ouvertes",all.filter(a=>a.st=="ouverte").length)}${kpi("En instruction",all.filter(a=>a.st=="instruction").length)}${kpi("Audiences fixées",all.filter(a=>a.st=="audience").length)}${kpi("Jugées",all.filter(a=>a.st=="jugee").length)}</div>
 <div class="card inl">${search("aq","N°, titre, partie…")}${fsel("as",Object.entries(AST).map(([k,v])=>[k,v[0]]),"Tous les statuts")}${fsel("at",["Pénale","Civile","Commerciale","Administrative"],"Tous les types")}</div>
 <div class="card tw"><table><tr><th>N°<th>Intitulé<th>Type<th>Plaignant<th>Mis en cause<th>Juge<th>Statut<th>Ouverte</tr>${L.map(a=>`<tr class="click" onclick="openM('affaire','${a.id}')"><td class="nw">${esc(a.num)}${a.secret?' <span class="bdg no">Confidentiel</span>':""}<td>${esc(a.titre)}<td>${esc(a.type)}<td>${esc(a.plaignant||"—")}<td>${esc(a.accuse||"—")}<td>${a.juge?esc(uname(a.juge)):'<span class="mu">—</span>'}<td>${bdg(AST,a.st)}<td class="nw">${fd(a.t)}</tr>`).join("")||`<tr><td colspan="8" class="empty">Aucune affaire.</td></tr>`}</table></div>`};
function judges(){return vals(S.users).filter(x=>isAgent(x)&&x.active!==false&&(x.role=="direction"||(G(x)&&G(x).perms&&G(x).perms[pk("jus.verdict")])||(x.xperms&&x.xperms[pk("jus.verdict")])))}
function MAffaireNew(){const f=modal.from?S.dossiers[modal.from]:null;
 return {title:"Ouvrir une affaire judiciaire",body:`<div class="form"><label class="f full">Intitulé<input id="an" value="${f?esc(f.objet):""}"></label>
 <label class="f">Type<select id="aty">${opts(["Pénale","Civile","Commerciale","Administrative"])}</select></label><label class="f">Juge assigné<select id="aj"><option value="">— À désigner —</option>${judges().map(x=>`<option value="${x.id}">${esc(x.nom)}</option>`).join("")}</select></label>
 <label class="f">Plaignant / partie civile<input id="apl" value="${f?esc(f.entNom):""}"></label><label class="f">Mis en cause / défendeur<input id="aac"></label>
 <label class="f full">Exposé des faits<textarea id="ade" rows="5">${f?esc(f.det):""}</textarea></label><label class="ck full"><input type="checkbox" id="ase"><span>Affaire confidentielle (visible uniquement par le juge, l'auteur et les habilités)</span></label></div><p class="err" id="msg"></p>`,
 foot:`<button class="btn gh" onclick="closeM()">Annuler</button><button class="btn" onclick="affCreate()">Ouvrir l'affaire</button>`}}
const PK={note:"Note d'instruction",piece:"Pièce à conviction",audition:"Audition / témoignage",decision:"Décision / ordonnance"};
function MAffaire(a){if(!a||!affVisible(a))return null;const closed=a.st=="jugee"||a.st=="classee";
 const P=vals(a.pieces).sort((x,y)=>x.t-y.t);
 return {title:`${esc(a.num)} — ${esc(a.titre)}`,body:`<div class="inl" style="margin-bottom:12px">${bdg(AST,a.st)} <span class="bdg mu">${esc(a.type)}</span>${a.secret?' <span class="bdg no">Confidentiel</span>':""}</div>
 <div class="kv"><div class="k">Plaignant</div><div>${esc(a.plaignant||"—")}</div><div class="k">Mis en cause</div><div>${esc(a.accuse||"—")}</div><div class="k">Juge</div><div>${a.juge?esc(uname(a.juge)):"À désigner"}</div><div class="k">Audience</div><div>${a.audience?fd(a.audience):"—"}</div><div class="k">Ouverte par</div><div>${esc(uname(a.by))} le ${fd(a.t)}</div></div>
 <div class="card" style="margin:14px 0;background:var(--bg)"><h4>Exposé des faits</h4><div class="pre">${esc(a.desc||"—")}</div></div>
 ${a.verdict?`<div class="card" style="border-color:var(--ok)"><h4>Jugement — ${fd(a.verdict.t)}</h4><div class="pre">${esc(a.verdict.txt)}</div><div class="kv" style="margin-top:8px"><div class="k">Peine</div><div>${esc(a.verdict.peine||"—")}</div><div class="k">Amende</div><div>${money(a.verdict.amende)}</div><div class="k">Prononcé par</div><div>${esc(a.verdict.nom)}</div></div></div>`:""}
 <h4>Instruction (${P.length})</h4><div class="tl">${P.map(p=>`<div class="it ${p.kind}"><b>${PK[p.kind]||p.kind}</b> · ${esc(p.nom)} <span class="mu">${fd(p.t)}</span><div class="pre">${esc(p.txt)}</div>${p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener">Voir la pièce jointe</a>`:""}</div>`).join("")||`<p class="mu">Aucune pièce versée au dossier.</p>`}</div>
 ${can("jus.instruct")&&!closed?`<div class="card" style="background:var(--bg)"><h4>Verser au dossier</h4><div class="form"><label class="f">Nature<select id="pk">${opts(Object.entries(PK))}</select></label><label class="f">Lien (image, document)<input id="pli" placeholder="https://…"></label><label class="f full">Contenu<textarea id="ptx" rows="3"></textarea></label></div><button class="btn sec sm" onclick="affPiece('${a.id}')">Ajouter</button></div>`:""}
 ${can("jus.status")?`<div class="card" style="background:var(--bg)"><h4>Gestion de l'affaire</h4><div class="form"><label class="f">Statut<select id="ast2" data-nokeep>${opts(Object.entries(AST).map(([k,v])=>[k,v[0]]),a.st)}</select></label>
 <label class="f">Juge<select id="aj2" data-nokeep><option value="">— À désigner —</option>${judges().map(x=>`<option value="${x.id}" ${x.id==a.juge?"selected":""}>${esc(x.nom)}</option>`).join("")}</select></label>
 <label class="f">Date d'audience<input id="aau2" type="datetime-local" data-nokeep value="${esc(a.audience||"")}"></label></div><button class="btn sec sm" onclick="affManage('${a.id}')">Enregistrer</button></div>`:""}
 ${can("jus.verdict")&&!closed?`<div class="card" style="background:var(--bg)"><h4>Rendre le jugement</h4><label class="f">Dispositif du jugement<textarea id="vtx" rows="3"></textarea></label><div class="form"><label class="f">Peine prononcée<input id="vpe" placeholder="Ex. : 30 jours de prison, relaxe…"></label><label class="f">Amende ($)<input id="vam" type="number" min="0"></label></div>
 <label class="ck"><input type="checkbox" id="vfa" checked><span>Émettre l'amende au Trésor</span></label><p><button class="btn ok" onclick="affVerdict('${a.id}')">Prononcer le jugement</button></p></div>`:""}<p class="err" id="msg"></p>`,
 foot:`${can("jus.delete")?`<button class="btn gh" onclick="affDel('${a.id}')">Supprimer</button>`:""}${can("jus.status")&&closed?`<button class="btn sec" onclick="affReopen('${a.id}')">Rouvrir l'affaire</button>`:""}<button class="btn sec" onclick="closeM()">Fermer</button>`}}
</script>
<script>
/* =================== REGISTRES =================== */
const REG={
 entreprises:{t:"Entreprises",p:"reg.ent",cols:["nom","type","gerantNom","gerantPrenom","tel","mail","dateEnr"],f:[
  {k:"nom",l:"Raison sociale",req:1},{k:"type",l:"Type d'entreprise",type:"select",o:()=>TCATS().map(c=>c.name)},
  {k:"gerantNom",l:"Nom du gérant",req:1},{k:"gerantPrenom",l:"Prénom du gérant",req:1},{k:"tel",l:"Téléphone"},{k:"mail",l:"Mail",type:"email"},{k:"dateEnr",l:"Date d'enregistrement",type:"date",def:()=>new Date().toISOString().slice(0,10)},
  {k:"compte",l:"Compte entreprise lié (facultatif)",type:"account"},{k:"notes",l:"Notes",type:"area"}]},
 identites:{t:"Fiches d'identité",p:"reg.civ",cols:["nom","prenom","naiss","sexe","statut","tel"],f:[
  {k:"nom",l:"Nom",req:1},{k:"prenom",l:"Prénom",req:1},{k:"naiss",l:"Date de naissance",type:"date"},{k:"lieu",l:"Lieu de naissance"},{k:"sexe",l:"Sexe",type:"select",o:["Homme","Femme","Autre"]},{k:"nat",l:"Nationalité"},
  {k:"adresse",l:"Adresse"},{k:"tel",l:"Téléphone"},{k:"profession",l:"Profession"},{k:"statut",l:"Situation",type:"select",o:["Célibataire","Marié(e)","Pacsé(e)","Divorcé(e)","Veuf(ve)","Décédé(e)"]},{k:"photo",l:"Photo (lien URL)"},{k:"notes",l:"Mentions marginales",type:"area"}]}
};
/* Registre des entreprises : écriture réservée au département Finances (et à la Direction) */
function regCanEdit(s){const R=REG[s];if(!R||!can(R.p+".edit"))return false;if(s=="entreprises"){const u=ME();return isDir()||!!(u&&u.dept=="Finances")}return true}
const regLabel=(R,k)=>(R.f.find(x=>x.k==k)||{}).l||k;
function regCell(k,v){if(k=="licSt")return licB(v);if(k=="exp"||k=="naiss"||k=="date"||k=="dateEnr")return fdd(v);if(k=="amende"||k=="prime")return v?money(v):"—";
 if(k=="danger")return `<span class="bdg ${({Faible:"mu",Modérée:"bl",Élevée:"wa",Extrême:"no"}[v]||"mu")}">${esc(v||"—")}</span>`;if(k=="st")return `<span class="bdg ${v=="Levé"?"mu":"no"}">${esc(v||"Actif")}</span>`;return esc(v||"—")}
V.registres=()=>{const avail=(can("reg.civ.view")?[["etatcivil",{t:"État civil"}]]:[]).concat(Object.entries(REG).filter(([k,R])=>can(R.p+".view")));if(!avail.length)return empty("Aucun registre accessible.");
 const s=avail.some(a=>a[0]==sub)?sub:avail[0][0];if(s=="etatcivil")return `<div class="ph"><h2>Registres officiels</h2></div>${tabsH(avail.map(([k,R])=>[k,R.t]),s)}${ecView()}`;
 const R=REG[s];
 let L=vals(S[s]).filter(r=>match(filt["r_"+s],...R.f.map(f=>r[f.k]))).sort((a,b)=>(a.nom||"").localeCompare(b.nom||""));
 return `<div class="ph"><h2>Registres officiels</h2>${regCanEdit(s)?`<button class="btn" onclick="openM('reg',null,{reg:'${s}'})">${ic("plus")}Nouvelle fiche</button>`:""}</div>${tabsH(avail.map(([k,R])=>[k,R.t]),s)}
 <div class="card inl">${search("r_"+s)}<span class="mu">${L.length} fiche(s)</span></div>
 <div class="card tw"><table><tr>${R.cols.map(c=>`<th>${esc(regLabel(R,c))}`).join("")}</tr>${L.map(r=>`<tr class="click" onclick="openM('reg','${r.id}',{reg:'${s}'})">${R.cols.map(c=>`<td>${regCell(c,r[c])}`).join("")}</tr>`).join("")||`<tr><td colspan="${R.cols.length}" class="empty">Registre vide.</td></tr>`}</table></div>`};
function fieldH(f,v,ro){const id="rf_"+f.k;if((v==null||v==="")&&!ro&&f.def)v=f.def();v=v==null?"":v;
 if(ro)return `<div class="k">${esc(f.l)}</div><div class="pre">${f.type=="account"?esc(v?uname(v):"—"):f.type=="date"?fdd(v):f.type=="number"&&v!==""?money(v):esc(v||"—")}</div>`;
 const cls=f.type=="area"?"f full":"f";let inp;
 if(f.type=="select"){const o=typeof f.o=="function"?f.o():f.o;inp=`<select id="${id}">${opts([""].concat(o,v&&!o.includes(v)?[v]:[]),v)}</select>`}
 else if(f.type=="area")inp=`<textarea id="${id}" rows="3">${esc(v)}</textarea>`;
 else if(f.type=="account")inp=`<select id="${id}"><option value="">— Aucun —</option>${vals(S.users).filter(u=>u.role=="entreprise").map(u=>`<option value="${u.id}" ${u.id==v?"selected":""}>${esc(u.nom)} (${esc(u.login)})</option>`).join("")}</select>`;
 else inp=`<input id="${id}" type="${f.type||"text"}" value="${esc(v)}">`;
 return `<label class="${cls}">${esc(f.l)}${f.req?" *":""}${inp}</label>`}
function MReg(){const s=modal.reg,R=REG[s],r=modal.id?S[s][modal.id]:{},ed=regCanEdit(s);if(modal.id&&!r)return null;
 let extra="";
 const ph=r.photo&&/^https?:\/\//.test(r.photo)?`<img class="photo" src="${esc(r.photo)}" alt="Photo" style="float:right;margin:0 0 10px 10px">`:"";
 return {title:(modal.id?"":"Nouvelle fiche — ")+esc(R.t)+(r.nom?" — "+esc((r.prenom?r.prenom+" ":"")+r.nom):""),
 body:ed?`${ph}<div class="form">${R.f.map(f=>fieldH(f,r[f.k])).join("")}</div>${modal.id?`<p class="mu sm">Créée par ${esc(uname(r.by))} le ${fd(r.t)}${r.mt?" · modifiée le "+fd(r.mt):""}</p>`:""}${extra}<p class="err" id="msg"></p>`:`${ph}<div class="kv">${R.f.map(f=>fieldH(f,r[f.k],1)).join("")}</div>${extra}`,
 foot:`${ed&&modal.id?`<button class="btn gh" onclick="regDel('${s}','${modal.id}')">Supprimer</button>`:""}<button class="btn sec" onclick="closeM()">${ed?"Annuler":"Fermer"}</button>${ed?`<button class="btn" onclick="regSave('${s}','${modal.id||""}')">Enregistrer</button>`:""}`}}

/* =================== ÉTAT CIVIL : ACTES =================== */
const EC_CATS=[["divorce","Divorce","\u{1F494}"],["naissance","Naissance","\u{1F476}"],["deces","Décès","\u{1F54A}\u{FE0F}"],["reconnaissance","Reconnaissance","\u{1F4AC}"],["associations","Associations","\u{1F465}"],["adoption","Adoption","\u{1F46A}"],["emancipation","Émancipation","\u{1F4DD}"],["identite","Changement d'identité","\u{1F3AD}"],["mariage","Mariage","\u{1F48D}"]];
const ECL=Object.fromEntries(EC_CATS.map(c=>[c[0],c]));
const norm=s=>String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function acteMatch(a,q){if(!q)return true;const hay=norm([a.num,a.nom,a.prenom,a.prenom+" "+a.nom,a.nom+" "+a.prenom,a.tel,String(a.tel||"").replace(/\D/g,""),a.naiss,fdd(a.naiss),a.dateActe,fdd(a.dateActe),(ECL[a.cat]||[])[1],a.notes].join(" | "));return norm(q).split(/\s+/).filter(Boolean).every(w=>hay.includes(w))}
function ecView(){const cat=filt.ecc||"",q=filt.ecq||"",showDel=cat=="_del";const all=vals(S.actes);const live=all.filter(a=>!a.del);
 let L=(showDel?all.filter(a=>a.del):live.filter(a=>!cat||a.cat==cat)).filter(a=>acteMatch(a,q)).sort((a,b)=>b.t-a.t);
 const cnt=k=>live.filter(a=>a.cat==k).length;
 return `<div class="ec"><aside class="ec-side card"><button class="ec-c ${!cat?"on":""}" onclick="filt.ecc='';render()"><span class="ec-h">#</span><span class="ec-e">\u{1F4DA}</span><span class="ec-s">┊</span><span class="ec-n">Tous les actes</span><span class="ec-k">${live.length}</span></button>
 ${EC_CATS.map(([k,l,e])=>`<button class="ec-c ${cat==k?"on":""}" onclick="filt.ecc='${k}';render()"><span class="ec-h">#</span><span class="ec-e">${e}</span><span class="ec-s">┊</span><span class="ec-n">${esc(l)}</span><span class="ec-k">${cnt(k)}</span></button>`).join("")}
 ${isDir()?`<button class="ec-c ${showDel?"on":""}" onclick="filt.ecc='_del';render()" style="margin-top:8px"><span class="ec-h">#</span><span class="ec-e">\u{1F5D1}\u{FE0F}</span><span class="ec-s">┊</span><span class="ec-n">Actes supprimés</span><span class="ec-k">${all.length-live.length}</span></button>`:""}</aside>

/* =================== SALAIRE =================== */
const payGlobal=()=>isDir()||can("pay.all");
const deptKey=d=>d?String(d).replace(/[.#$\/\[\]]/g,"_"):"_dir";
function payFolders(){const u=ME();if(payGlobal())return DEPTS().map(d=>[deptKey(d),d]).concat([["_dir","Direction"]]);if(can("pay.dept")&&u.dept)return [[deptKey(u.dept),u.dept]];return []}
function deptStaff(key){return vals(S.users).filter(x=>isAgent(x)&&x.active!==false&&(key=="_dir"?!x.dept:deptKey(x.dept)==key)).sort((a,b)=>((G(a)||{}).rank??99)-((G(b)||{}).rank??99)||a.nom.localeCompare(b.nom))}
const PST={brouillon:["En préparation","wa"],soumise:["Soumise pour validation","bl"]};
function lineTotal(l){return Math.round(num(l&&l.montant)+num(l&&l.prime))}
V.salaire=()=>{const F=payFolders(),T=[["moi","Mon salaire"]].concat(F.length?[["gestion","Gestion des salaires"]]:[]);const s=T.some(t=>t[0]==sub)?sub:"moi";
 return `<div class="ph"><h2>Salaire</h2></div>${T.length>1?tabsH(T,s):""}${s=="gestion"?payMgmtView(F):myPayView()}`};
function myPayView(){const u=ME(),p=payInfo(u),key=deptKey(u.dept),dr=S.paie[key],my=dr&&dr.lines&&dr.lines[u.id];
 const A=vals(S.paiearch).filter(a=>a.lines&&a.lines[u.id]).sort((a,b)=>b.t-a.t);const H=vals(S.transactions).filter(t=>t.cat=="Salaires"&&t.user==u.id&&!t.paie).sort((a,b)=>b.t-a.t);
 const tot=A.reduce((s,a)=>s+lineTotal(a.lines[u.id]),0)+H.reduce((s,t)=>s+num(t.montant),0);
 return `<div class="kpis">${kpi("Paie en préparation",my?money(lineTotal(my)):"—","gold")}${kpi("Dossiers traités (période)",p.nd)}${kpi("Heures de service (période)",p.h.toFixed(1)+" h")}${kpi("Total perçu",money(tot))}</div>
 <div class="card"><h3>Ma paie en cours</h3>${my?`<div class="kv"><div class="k">Période</div><div>${esc(dr.periode||"—")}</div><div class="k">Statut</div><div>${bdg(PST,dr.st||"brouillon")}</div><div class="k">Salaire</div><div>${money(my.montant)}</div><div class="k">Prime</div><div>${money(my.prime)}</div>${my.note?`<div class="k">Commentaire</div><div>${esc(my.note)}</div>`:""}<div class="k">Total</div><div class="b" style="font-size:18px;color:var(--gold2)">${money(lineTotal(my))}</div></div>`:`<p class="mu">Votre ministre n'a pas encore saisi votre paie pour la période en cours.</p>`}
 <p class="mu sm" style="margin-top:10px">Activité depuis votre dernier versement${u.paidAt?" ("+fd(u.paidAt)+")":""} : ${p.nd} dossier(s) traité(s), ${p.h.toFixed(1)} h de service. Grade : ${esc(gname(u))}.</p></div>
 <div class="card tw"><h3>Mes fiches de paie</h3><table><tr><th>Date<th>Période<th>Département<th class="r">Salaire<th class="r">Prime<th class="r">Total<th>Validé par</tr>${A.map(a=>{const l=a.lines[u.id];return `<tr><td class="nw">${fd(a.t)}<td>${esc(a.periode)}<td>${esc(a.deptNom)}<td class="r">${money(l.montant)}<td class="r">${money(l.prime)}<td class="r b">${money(lineTotal(l))}<td>${esc(a.byNom)}</tr>`}).join("")}${H.map(t=>`<tr><td class="nw">${fd(t.t)}<td class="mu" colspan="5">${esc(t.label)} — <b>${money(t.montant)}</b><td>${esc(t.byNom||"")}</tr>`).join("")}${!A.length&&!H.length?`<tr><td colspan="7" class="empty">Aucun versement reçu.</td></tr>`:""}</table></div>`}
function payMgmtView(F){const cur=F.some(f=>f[0]==filt.pdk)?filt.pdk:F[0][0],nm=(F.find(f=>f[0]==cur)||[])[1],st=filt.pst||"cours";
 const side=`<aside class="ec-side card">${F.map(([k,n])=>{const d=S.paie[k];return `<button class="ec-c ${k==cur?"on":""}" onclick="filt.pdk='${k}';filt.pst='cours';keep={};render()"><span class="ec-h">${ic("folder")}</span><span class="ec-n">${esc(n)}</span>${d&&d.st=="soumise"?`<span class="bdg bl" style="font-size:10px">À valider</span>`:""}</button>`}).join("")}</aside>`;
 const tabs=`<div class="tabs"><button class="${st=="cours"?"on":""}" onclick="filt.pst='cours';render()">Paie en cours</button><button class="${st=="arch"?"on":""}" onclick="filt.pst='arch';render()">Archives des salaires</button></div>`;
 return `<div class="ec">${side}<div><div class="card"><div class="inl" style="justify-content:space-between"><h3 style="margin:0">${ic("folder").replace("<svg",'<svg width="18" height="18" style="vertical-align:-3px"')} ${esc(nm)}</h3><span class="mu">${payGlobal()?"Gestion globale":"Votre département"}</span></div>${tabs}${st=="arch"?payArchView(cur,nm):payDraftView(cur,nm)}</div></div></div>`}
function payDraftView(key,nm){const d=S.paie[key]||{st:"brouillon",lines:{}},L=deptStaff(key),locked=d.st=="soumise"&&!payGlobal(),ed=!locked;
 const tot=L.reduce((s,u)=>s+lineTotal((d.lines||{})[u.id]),0);
 return `<div class="form" style="margin-top:12px"><label class="f">Période<input id="pper_${key}" data-nokeep value="${esc(d.periode||"")}" placeholder="Ex. : Semaine 41 — 2026" ${ed?"":"disabled"} onchange="paySetPeriod('${key}',this.value)"></label>
 <div class="f"><span class="mu sm">Statut</span><div style="margin-top:10px">${bdg(PST,d.st||"brouillon")}${d.updNom?` <span class="mu sm">· modifiée par ${esc(d.updNom)} le ${fd(d.updT)}</span>`:""}</div></div></div>
 ${d.st=="soumise"?`<p class="mu">Soumise par ${esc(d.subNom||"")} le ${fd(d.subT)}.${payGlobal()?" Vérifiez les montants puis validez le versement.":" En attente de validation par la gestion globale ; modification impossible."}</p>`:""}${d.retour?`<div class="card" style="border-color:var(--wa)"><b>Renvoyée pour correction</b> : ${esc(d.retour)}</div>`:""}
 <div class="tw"><table class="payt"><tr><th>Agent<th>Activité<th class="r">Indicatif<th>Salaire ($)<th>Prime ($)<th>Commentaire<th class="r">Total</tr>${L.map(u=>{const l=(d.lines||{})[u.id]||{},p=payInfo(u);return `<tr><td><b>${esc(u.nom)}</b><div class="mu sm">${esc(gname(u))}</div><td class="nw sm">${p.nd} dossier(s)<br>${p.h.toFixed(1)} h<td class="r mu" title="Calcul selon le barème du grade">${money(p.total)}
  <td>${ed?`<input type="number" min="0" data-nokeep value="${l.montant??""}" onchange="paySetLine('${key}','${u.id}','montant',this.value)">`:money(l.montant)}<td>${ed?`<input type="number" min="0" data-nokeep value="${l.prime??""}" onchange="paySetLine('${key}','${u.id}','prime',this.value)">`:money(l.prime)}
  <td>${ed?`<input data-nokeep value="${esc(l.note||"")}" onchange="paySetLine('${key}','${u.id}','note',this.value)" class="pnote">`:esc(l.note||"")}<td class="r b">${money(lineTotal(l))}</tr>`}).join("")||`<tr><td colspan="7" class="empty">Aucun agent actif dans ce département.</td></tr>`}
 <tr><td colspan="6" class="r b">Total du département<td class="r b" style="color:var(--gold2)">${money(tot)}</tr></table></div>
 <div class="inl" style="margin-top:12px;justify-content:flex-end">${ed&&L.length?`<button class="btn gh" onclick="payFillIndic('${key}')">Reprendre le calcul indicatif</button>`:""}
 ${d.st!="soumise"&&L.length?`<button class="btn bl" onclick="paySubmit('${key}','${esc(nm)}')">Soumettre pour validation</button>`:""}
 ${payGlobal()&&d.st=="soumise"?`<button class="btn sec" onclick="payReturn('${key}')">Renvoyer pour correction</button>`:""}
 ${payGlobal()&&L.length?`<button class="btn ok" onclick="payValidate('${key}','${esc(nm)}')">Valider et verser la paie</button>`:""}</div><p class="err" id="msg"></p>`}
function payArchView(key,nm){const A=vals(S.paiearch).filter(a=>a.dept==key).sort((a,b)=>b.t-a.t);
 return `<div class="tw" style="margin-top:12px"><table><tr><th>Période<th>Versée le<th>Agents<th class="r">Total versé<th>Préparée par<th>Validée par</tr>${A.map(a=>`<tr class="click" onclick="openM('paiearch','${a.id}')"><td class="b">${esc(a.periode)}<td class="nw">${fd(a.t)}<td>${Object.keys(a.lines||{}).length}<td class="r b">${money(a.total)}<td>${esc(a.subNom||"—")}<td>${esc(a.byNom)}</tr>`).join("")||`<tr><td colspan="6" class="empty">Aucune paie archivée pour ce département.</td></tr>`}</table></div>`}
function MPaieArch(a){if(!a)return null;const F=payFolders();if(!F.some(f=>f[0]==a.dept))return null;const L=Object.entries(a.lines||{}).map(([id,l])=>Object.assign({id},l)).sort((x,y)=>String(x.nom).localeCompare(y.nom));
 return {title:"Paie archivée — "+esc(a.deptNom)+" — "+esc(a.periode),wide:1,body:`<div class="kpis">${kpi("Agents payés",L.length)}${kpi("Total versé",money(a.total),"gold")}</div><p class="mu">Versée le ${fd(a.t)} · préparée par ${esc(a.subNom||"—")} · validée par ${esc(a.byNom)}</p>
 <div class="tw"><table><tr><th>Agent<th>Grade<th class="r">Dossiers<th class="r">Heures<th class="r">Salaire<th class="r">Prime<th>Commentaire<th class="r">Total</tr>${L.map(l=>`<tr><td class="b">${esc(l.nom)}<td>${esc(l.grade||"")}<td class="r">${num(l.nd)}<td class="r">${num(l.h).toFixed(1)} h<td class="r">${money(l.montant)}<td class="r">${money(l.prime)}<td>${esc(l.note||"")}<td class="r b">${money(lineTotal(l))}</tr>`).join("")}</table></div>`,
 foot:`${isDir()?`<button class="btn gh" style="margin-right:auto" onclick="openM('paiedel','${a.id}')">Supprimer l'archive</button>`:""}<button class="btn sec" onclick="payArchCSV('${a.id}')">Exporter (CSV)</button><button class="btn" onclick="closeM()">Fermer</button>`}}

V.journal=()=>{const all=can("log.all"),u=ME();let L=vals(S.logs).filter(l=>all||l.d==u.dept);if(filt.lc)L=L.filter(l=>l.cat==filt.lc);if(filt.ld)L=L.filter(l=>l.d==filt.ld);L=L.filter(l=>match(filt.lq,l.u,l.m)).sort((a,b)=>b.t-a.t).slice(0,400);
 const cats=[...new Set(vals(S.logs).map(l=>l.cat).filter(Boolean))].sort();
 return `<div class="ph"><h2>Logs</h2><span class="mu">${all?"Tous les logs":"Logs du département "+esc(u.dept)}</span></div><div class="card inl">${search("lq","Agent, action…")}${fsel("lc",cats,"Toutes catégories")}${all?fsel("ld",DEPTS(),"Tous départements"):""}</div>
 <div class="card tw"><table><tr><th>Date<th>Agent<th>Catégorie<th>Département<th>Action</tr>${L.map(l=>`<tr><td class="nw mu">${fd(l.t)}<td class="b">${esc(l.u)}<td>${esc(l.cat||"")}<td>${esc(l.d||"—")}<td>${esc(l.m)}</tr>`).join("")||`<tr><td colspan="5" class="empty">Aucune activité.</td></tr>`}</table></div>`};

/* =================== PREUVES DE PAIEMENT =================== */
function proofView(p){if(!p)return "";if((p.type||"").startsWith("image/"))return `<img class="proof-img" src="${p.data}" alt="Preuve de paiement" onclick="modal.zoom=!modal.zoom;render()" title="Cliquer pour agrandir">`;
 return `<div class="proof-file">${ic("file")}<div><b>${esc(p.name||"Document")}</b><div class="mu sm">${p.type=="application/pdf"?"Document PDF":esc(p.type)} · ${Math.round((p.size||0)/1024)} Ko</div></div><a class="btn sec sm" href="${p.data}" download="${esc(p.name||"preuve")}">Télécharger</a></div>`}
function MNotif(f){if(!f||f.ent!=meId)return null;const p=modal.proof;
 return {title:"Notifier du paiement",body:`<div class="pe-card"><div class="kv"><div class="k">Facture</div><div><b>${esc(f.num)}</b> · ${kindL(f.kind)}</div><div class="k">Motif</div><div>${esc(f.motif)}</div><div class="k">Montant à régler</div><div class="b" style="color:var(--gold2);font-size:17px">${money(f.montant)}</div></div></div>
 ${f.rejet?`<div class="card" style="border-color:var(--no)"><b>Votre précédente preuve a été refusée.</b><div class="mu">Motif : ${esc(f.rejet)}</div></div>`:""}
 <h4>Preuve de paiement</h4>
 <div class="drop ${p?"has":""}" tabindex="0" onclick="if(!event.target.closest('a'))document.getElementById('pf').click()" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();proofFile(event.dataTransfer.files[0])">
 ${p?`${proofView(p)}<div class="mu sm" style="margin-top:8px">${esc(p.name)} — cliquez pour changer de fichier</div>`:`<div class="drop-ic">${ic("file")}</div><b>Cliquez pour sélectionner votre preuve</b><div class="mu">ou glissez-déposez le fichier ici, ou collez une capture (Ctrl+V)</div><div class="mu sm" style="margin-top:6px">Images (PNG, JPG…) ou PDF</div>`}</div>
 <input type="file" id="pf" accept="image/*,application/pdf" style="display:none" onchange="proofFile(this.files[0]);this.value=''">
 ${modal.busy?`<p class="mu">Traitement du fichier…</p>`:""}
 <div class="form" style="margin-top:12px"><label class="f">Référence du paiement (facultatif)<input id="nref" placeholder="Ex. : n° de virement, reçu…"></label><label class="f">Date du paiement<input id="ndt" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="f full">Commentaire (facultatif)<textarea id="ncom" rows="2"></textarea></label></div><p class="err" id="msg"></p>`,
 foot:`<button class="btn sec" onclick="closeM()">Annuler</button><button class="btn" ${p&&!modal.busy?"":"disabled"} onclick="sendNotif('${f.id}')">Envoyer la notification</button>`}}
function MVerif(f){if(!f||!(can("fin.bill")||can("fin.view")))return null;const p=proofCache[f.id];if(p===undefined)loadProof(f.id);const v=f.st=="verif"&&canBill();
 if(modal.zoom&&p)return {title:"Preuve — "+esc(f.num),wide:1,body:`<img src="${p.data}" alt="Preuve" style="width:100%;border-radius:10px;cursor:zoom-out" onclick="modal.zoom=false;render()">`,foot:`<button class="btn sec" onclick="modal.zoom=false;render()">Retour</button>`};
 return {title:(v?"Vérification du paiement — ":"Preuve de paiement — ")+esc(f.num),wide:1,body:`<div class="pe-card"><div class="kv"><div class="k">Entreprise</div><div>${esc(f.entNom)}</div><div class="k">Nature / motif</div><div>${kindL(f.kind)} — ${esc(f.motif)}</div><div class="k">Montant</div><div class="b" style="color:var(--gold2);font-size:17px">${money(f.montant)}</div>
 <div class="k">Notifié le</div><div>${fd(f.notifT)}${f.notifDate?" · paiement déclaré le "+fdd(f.notifDate):""}</div>${f.notifRef?`<div class="k">Référence</div><div>${esc(f.notifRef)}</div>`:""}${f.notifCom?`<div class="k">Commentaire</div><div class="pre">${esc(f.notifCom)}</div>`:""}${f.st=="payee"?`<div class="k">Validé</div><div>${fd(f.paidT)}${f.vNom?" par "+esc(f.vNom):""}</div>`:""}</div></div>
 <h4>Preuve fournie</h4><div class="drop has" style="cursor:default">${p===undefined?`<p class="mu">Chargement de la preuve…</p>`:p?proofView(p)+(p.type.startsWith("image/")?`<div class="mu sm" style="margin-top:6px">Cliquez sur l'image pour l'agrandir</div>`:""):`<p class="mu">Aucune preuve trouvée.</p>`}</div>
 ${v?`<label class="f" style="margin-top:12px">Motif en cas de refus (visible par l'entreprise)<textarea id="vrj" rows="2" placeholder="Ex. : montant incorrect, preuve illisible…"></textarea></label>`:""}<p class="err" id="msg"></p>`,
 foot:v?`<button class="btn sec" onclick="closeM()">Fermer</button><button class="btn no" onclick="rejectPay('${f.id}')">Refuser la preuve</button><button class="btn ok" onclick="validatePay('${f.id}')">Valider le paiement</button>`:`<button class="btn sec" onclick="closeM()">Fermer</button>`}}

/* =================== MODALES =================== */
function modalH(){if(!modal)return "";let m=null;
 if(modal.type=="confirm")m={title:"Confirmation",sm:1,body:`<p class="pre">${esc(modal.msg)}</p>`,foot:`<button class="btn sec" onclick="askNo()">Annuler</button><button class="btn no" onclick="askOk()">${esc(modal.label)}</button>`};
 else if(modal.type=="dossier")m=MDossier(S.dossiers[modal.id]);
 else if(modal.type=="affaire")m=MAffaire(S.affaires[modal.id]);
 else if(modal.type=="affaireNew")m=MAffaireNew();
 else if(modal.type=="reg")m=MReg();
 else if(modal.type=="grade")m=MGrade();
 else if(modal.type=="user")m=MUser(S.users[modal.id]);
 else if(modal.type=="notif")m=MNotif(S.factures[modal.id]);
 else if(modal.type=="verif")m=MVerif(S.factures[modal.id]);
 else if(modal.type=="archive")m=MArchive(S.archives[modal.id]);
 else if(modal.type=="acte")m=MActe(S.actes[modal.id]);
 else if(modal.type=="paiearch")m=MPaieArch(S.paiearch[modal.id]);
 else if(modal.type=="paiedel"){const a=S.paiearch[modal.id];m=a&&isDir()?{title:"Supprimer l'archive de paie",sm:1,body:`<p>Supprimer définitivement l'archive « <b>${esc(a.periode)}</b> » du département ${esc(a.deptNom)} (${money(a.total)}, ${Object.keys(a.lines||{}).length} agent(s)) ?</p><p class="mu sm">Si vous gardez les versements, ils restent dans le Trésor et dans l'historique des agents. Si vous les annulez, l'argent est recrédité et les fiches de paie disparaissent.</p><label class="ck"><input type="checkbox" id="pdtx"><span>Annuler aussi les versements dans le Trésor (le montant est recrédité)</span></label><p class="err" id="msg"></p>`,foot:`<button class="btn sec" onclick="openM('paiearch','${a.id}')">Annuler</button><button class="btn no" onclick="delPaieArch('${a.id}')">Supprimer</button>`}:null}
 else if(modal.type=="payret")m={title:"Renvoyer la paie pour correction",sm:1,body:`<label class="f">Ce qu'il faut corriger<textarea id="prm" rows="3"></textarea></label><p class="err" id="msg"></p>`,foot:`<button class="btn sec" onclick="closeM()">Annuler</button><button class="btn" onclick="payReturnDo()">Renvoyer</button>`};
 else if(modal.type=="acteEdit")m=MActeEdit();
 if(!m){modal=null;return ""}
 return `<div class="modal-bg" onclick="if(event.target===this)${modal.type=="confirm"?"askNo()":"closeM()"}"><div class="modal ${m.sm?"sm":""} ${m.wide?"wide":""}" role="dialog" aria-modal="true"><div class="mh"><h3>${m.title}</h3><button class="x" onclick="${modal.type=="confirm"?"askNo()":"closeM()"}" aria-label="Fermer">×</button></div><div class="mb">${m.body}</div>${m.foot?`<div class="mf">${m.foot}</div>`:""}</div></div>`}
</script>
<script>
/* =================== ACTIONS =================== */
async function login(){const l=tval("li"),p=val("lp");if(!l||!p)return say("Renseignez l'identifiant et le mot de passe.");
 const u=vals(S.users).find(x=>x.login.toLowerCase()==l.toLowerCase());
 if(!u||u.hash!==await hashPw(u.login,p))return say("Identifiant ou mot de passe incorrect.");
 if(u.active===false)return say("Ce compte est suspendu. Contactez votre hiérarchie.");
 meId=u.id;lsSet("lsgov_session",u.id);view="accueil";keep={};lastUnread=-1;DBX.update("users/"+u.id,{lastLogin:Date.now()});log("Connexion à l'intranet",u.dept,"Connexion");render()}
function logout(){meId=null;lsSet("lsgov_session",null);modal=null;keep={};convWith=null;render()}
async function forcePw(){const a=val("np1"),b=val("np2");if(a.length<4)return say("Au moins 4 caractères.");if(a!==b)return say("Les deux mots de passe diffèrent.");
 const u=ME();if(await hashPw(u.login,a)==u.hash)return say("Choisissez un mot de passe différent de l'ancien.");
 await DBX.update("users/"+u.id,{hash:await hashPw(u.login,a),mustChange:false});keep={};toast("Mot de passe défini.");render()}
async function changePw(){const u=ME();if(await hashPw(u.login,val("op"))!==u.hash)return say("Mot de passe actuel incorrect.");const a=val("np1");if(a.length<4)return say("Au moins 4 caractères.");if(a!==val("np2"))return say("Les deux mots de passe diffèrent.");
 DBX.update("users/"+u.id,{hash:await hashPw(u.login,a)});clr("op","np1","np2");toast("Mot de passe modifié.");log("Changement de mot de passe",u.dept,"Comptes")}
function saveTel(){DBX.update("users/"+meId,{tel:tval("pt")});toast("Profil enregistré.")}

/* Service */
function toggleSvc(){const u=ME(),s=Object.assign({on:false,since:0,acc:0,total:0},u.svc||{}),now=Date.now();
 if(s.on){const st=Math.max(s.since,u.paidAt||0);s.acc=(s.acc||0)+(now-st);s.total=(s.total||0)+(now-s.since);DBX.set(`users/${u.id}/svcLog/${nid()}`,{a:s.since,b:now});s.on=false;log("Fin de service ("+dur(now-s.since)+")",u.dept,"Service");toast("Fin de service enregistrée.")}
 else{s.on=true;s.since=now;log("Prise de service",u.dept,"Service");toast("Vous êtes en service.")}
 DBX.update("users/"+u.id,{svc:s})}

/* Dossiers */
function addDem(){const u=ME(),o=tval("no"),t=tval("nt"),d=val("nd");if(!o||!t)return say("Renseignez l'objet et les détails.");
 const id=nid();DBX.set("dossiers/"+id,{id,num:nextNum("dossiers","DOS"),ent:u.id,entNom:u.nom,dept:d,type:val("ny"),prio:val("np")||"normale",objet:o,det:t,st:"attente",t:Date.now()});
 log("Dépôt du dossier : "+o,d,"Dossiers");clr("no","nt");toast("Demande déposée.");go("mesdem")}
function dosComment(id){const t=tval("dc");if(!t)return;const u=ME();DBX.set(`dossiers/${id}/comments/${nid()}`,{t:Date.now(),u:u.id,nom:u.nom,txt:t,internal:!!val("dci")});clr("dc")}
function dosTake(id){const d=S.dossiers[id];DBX.update("dossiers/"+id,{st:"cours",assign:meId});log("Prise en charge : "+d.num,d.dept,"Dossiers")}
function dosAssign(id){const d=S.dossiers[id],a=val("das");DBX.update("dossiers/"+id,{assign:a||null,st:d.st=="attente"&&a?"cours":d.st});log(`Dossier ${d.num} assigné à ${a?uname(a):"personne"}`,d.dept,"Dossiers");toast("Assignation enregistrée.")}
function dosTreat(id,st){const d=S.dossiers[id],u=ME();if(!canTreat(d))return toast("Action non autorisée (service ?).",1);
 const mo=tval("dmo");if(st=="no"&&!mo)return say("Indiquez le motif du refus.");
 DBX.update("dossiers/"+id,{st,by:u.id,byNom:u.nom,tt:Date.now(),motif:mo||"",assign:d.assign||u.id});log((st=="ok"?"Dossier accepté : ":"Dossier refusé : ")+d.num+" — "+d.objet,d.dept,"Dossiers");toast(st=="ok"?"Dossier accepté.":"Dossier refusé.");closeM()}
function dosReopen(id){const d=S.dossiers[id];DBX.update("dossiers/"+id,{st:"cours",by:null,byNom:null,tt:null});log("Dossier rouvert : "+d.num,d.dept,"Dossiers")}
function dosDel(id){const d=S.dossiers[id];ask("Supprimer définitivement le dossier "+d.num+" ?",()=>{DBX.remove("dossiers/"+id);log("Dossier supprimé : "+d.num,d.dept,"Dossiers");modal=null},"Supprimer")}

/* Justice */
function affCreate(){const t=tval("an");if(!t)return say("Indiquez l'intitulé de l'affaire.");const id=nid(),u=ME(),j=val("aj");
 DBX.set("affaires/"+id,{id,num:nextNum("affaires","AFF"),titre:t,type:val("aty"),juge:j||"",plaignant:tval("apl"),accuse:tval("aac"),desc:tval("ade"),secret:!!val("ase"),st:"ouverte",t:Date.now(),by:u.id,from:modal.from||""});
 if(modal.from){const d=S.dossiers[modal.from];if(d&&(d.st=="attente"||d.st=="cours"))DBX.set(`dossiers/${d.id}/comments/${nid()}`,{t:Date.now(),u:u.id,nom:u.nom,txt:"Une affaire judiciaire a été ouverte suite à ce dossier.",internal:false})}
 log("Ouverture de l'affaire : "+t,"Justice","Justice");toast("Affaire ouverte.");modal={type:"affaire",id};keep={};render()}
function affPiece(id){const t=tval("ptx");if(!t)return say("Rédigez le contenu de la pièce.");const u=ME(),a=S.affaires[id],k=val("pk"),li=tval("pli");if(li&&!/^https?:\/\//.test(li))return say("Le lien doit commencer par http:// ou https://");
 DBX.set(`affaires/${id}/pieces/${nid()}`,{t:Date.now(),u:u.id,nom:u.nom,kind:k,txt:t,link:li});if(a.st=="ouverte")DBX.update("affaires/"+id,{st:"instruction"});
 log(`${PK[k]} versée à l'affaire ${a.num}`,"Justice","Justice");clr("ptx","pli");toast("Pièce versée au dossier.")}
function affManage(id){const a=S.affaires[id],st=val("ast2"),j=val("aj2"),au=val("aau2");const up={st,juge:j,audience:au};if(au&&st=="ouverte"||au&&st=="instruction")up.st="audience";
 DBX.update("affaires/"+id,up);log(`Affaire ${a.num} : statut « ${AST[up.st][0]} »${j?", juge "+uname(j):""}${au?", audience le "+fd(au):""}`,"Justice","Justice");toast("Affaire mise à jour.")}
function affVerdict(id){const a=S.affaires[id],u=ME(),tx=tval("vtx");if(!tx)return say("Rédigez le dispositif du jugement.");const pe=tval("vpe"),am=num(val("vam"));
 DBX.update("affaires/"+id,{st:"jugee",verdict:{txt:tx,peine:pe,amende:am,t:Date.now(),by:u.id,nom:u.nom}});
 if(val("vfa")&&am>0){const fid=nid(),acc=vals(S.users).find(x=>x.role=="entreprise"&&x.nom.toLowerCase()==(a.accuse||"").toLowerCase());DBX.set("factures/"+fid,{id:fid,num:nextNum("factures","FAC"),kind:"amende",ent:acc?acc.id:"",entNom:a.accuse||"—",motif:"Jugement "+a.num+" — "+a.titre,montant:am,ech:"",dept:"Justice",st:"due",t:Date.now(),by:u.id,byNom:u.nom})}
 log(`Jugement rendu dans l'affaire ${a.num}${pe?" : "+pe:""}`,"Justice","Justice");toast("Jugement prononcé.")}
function affReopen(id){const a=S.affaires[id];DBX.update("affaires/"+id,{st:"instruction"});log("Réouverture de l'affaire "+a.num,"Justice","Justice")}
function affDel(id){const a=S.affaires[id];ask("Supprimer définitivement l'affaire "+a.num+" et toutes ses pièces ?",()=>{DBX.remove("affaires/"+id);log("Affaire supprimée : "+a.num,"Justice","Justice");modal=null},"Supprimer")}

/* Registres */
const REGD={entreprises:"Intérieur",identites:"État-Civil"};
function regSave(s,id){if(!regCanEdit(s))return say("Seul le département Finances peut modifier ce registre.");const R=REG[s],o={};for(const f of R.f){let v=tval("rf_"+f.k);if(f.type=="number")v=v===""?"":num(v);if(f.req&&v==="")return say("Champ requis : "+f.l);o[f.k]=v}
 if(o.photo&&!/^https?:\/\//.test(o.photo))return say("Le lien de la photo doit commencer par http(s)://");
 if(id){o.mt=Date.now();DBX.update(`${s}/${id}`,o)}else{id=nid();Object.assign(o,{id,t:Date.now(),by:meId});DBX.set(`${s}/${id}`,o)}
 log(`${R.t} : fiche « ${(o.prenom?o.prenom+" ":"")+o.nom} » ${modal.id?"modifiée":"créée"}`,REGD[s],"Registres");toast("Fiche enregistrée.");closeM()}
function regDel(s,id){if(!regCanEdit(s))return;const r=S[s][id];ask("Supprimer la fiche « "+r.nom+" » ?",()=>{DBX.remove(`${s}/${id}`);log(`${REG[s].t} : fiche « ${r.nom} » supprimée`,REGD[s],"Registres");modal=null},"Supprimer")}

/* Finances */
function addTx(){const m=num(val("fm")),l=tval("fl");if(m<=0||!l)return say("Montant et libellé requis.");const id=nid(),u=ME(),dp=val("fdp");
 DBX.set("transactions/"+id,{id,t:Date.now(),type:val("ft"),cat:val("fc"),dept:dp=="Général"?"":dp,montant:m,label:l,by:u.id,byNom:u.nom});log(`Opération ${val("ft")=="in"?"recette":"dépense"} : ${l} (${money(m)})`,"Finances","Finances");clr("fm","fl");toast("Opération enregistrée.")}
function delTx(id){const t=S.transactions[id];ask("Supprimer l'opération « "+t.label+" » ("+money(t.montant)+") ?",()=>{DBX.remove("transactions/"+id);log("Opération supprimée : "+t.label,"Finances","Finances")},"Supprimer")}
function addBill(){if(!canBill())return toast("Seuls les départements Finances et Justice peuvent émettre en comptabilité.",1);const m=num(val("bm")),mo=tval("bmo"),e=val("be"),n=tval("bn");if(m<=0||!mo)return say("Montant et motif requis.");if(!e&&!n)return say("Choisissez un compte ou saisissez un nom.");
 const id=nid(),u=ME();DBX.set("factures/"+id,{id,num:nextNum("factures","FAC"),kind:val("bk"),ent:e,entNom:e?uname(e):n,motif:mo,montant:m,ech:val("bd"),dept:val("bdp"),st:"due",t:Date.now(),by:u.id,byNom:u.nom});
 log(`${kindL(val("bk"))} émise à ${e?uname(e):n} : ${money(m)}`,"Finances","Finances");clr("bm","bmo","bn","bd");toast("Émise.")}
function encaisser(f,extra){const u=ME();DBX.update("factures/"+f.id,Object.assign({st:"payee",paidT:Date.now(),vBy:u.id,vNom:u.nom,rejet:null},extra||{}));const tid=nid();DBX.set("transactions/"+tid,{id:tid,t:Date.now(),type:"in",cat:f.kind=="amende"?"Amendes":f.kind=="taxe"?"Impôts":"Factures",dept:f.dept||"Finances",montant:num(f.montant),label:`${f.num} — ${f.entNom} — ${f.motif}`,by:u.id,byNom:u.nom})}
function payFact(id){const f=S.factures[id],u=ME();if(!canBill())return;ask(`Marquer ${kindL(f.kind).toLowerCase()} ${f.num} de ${money(f.montant)} comme payée (paiement constaté directement) ?`,()=>{
 encaisser(f);
 log(`Paiement ${f.num} (${money(f.montant)}) de ${f.entNom} enregistré directement`,"Finances","Finances");toast("Paiement enregistré.")},"Marquer payée")}
function cancelFact(id){const f=S.factures[id];if(!canBill())return;ask("Annuler "+f.num+" ?",()=>{DBX.update("factures/"+id,{st:"annulee"});log("Annulation "+f.num,"Finances","Finances")},"Annuler la facture")}
function declare(){const p=tval("dp"),ca=num(val("dca"));if(!p||ca<=0)return say("Indiquez la période et un chiffre d'affaires.");const u=ME(),tx=taxRate(u),imp=Math.round(ca*tx/100),id=nid(),fid=nid();
 DBX.set("declarations/"+id,{id,ent:u.id,entNom:u.nom,periode:p,ca,taux:tx,impot:imp,st:"declaree",t:Date.now(),fac:fid});
 if(imp>0)DBX.set("factures/"+fid,{id:fid,num:nextNum("factures","FAC"),kind:"taxe",ent:u.id,entNom:u.nom,motif:"Impôt sur le CA — "+p,montant:imp,ech:new Date(Date.now()+7*864e5).toISOString().slice(0,10),dept:"Finances",st:"due",t:Date.now(),by:u.id,byNom:u.nom});
 log(`Déclaration fiscale de ${u.nom} (${p}) : CA ${money(ca)}`,"Finances","Finances");clr("dp","dca");delete keep.dca;toast("Déclaration envoyée. Facture d'impôt générée.")}
function validDecl(id){const d=S.declarations[id];DBX.update("declarations/"+id,{st:"validee",vby:meId,vt:Date.now()});log("Déclaration validée : "+d.entNom+" ("+d.periode+")","Finances","Finances")}
function setTax(){const t=Math.min(100,Math.max(0,num(val("ctax"))));DBX.update("config",{tax:t});log("Taux par défaut (sans type) fixé à "+t+" %","Finances","Finances");toast("Taux appliqué.")}
function addCat(){if(!can("fin.budget"))return;const n=tval("ncn"),r=val("ncr");if(!n)return toast("Indiquez le nom du type.",1);const id=nid(),rate=Math.min(100,Math.max(0,num(r)));
 DBX.update("config/taxCats",{[id]:{name:n,rate,rank:TCATS().length}});log(`Type d'entreprise créé : ${n} (${rate} %)`,"Finances","Taxes");clr("ncn","ncr");toast("Type ajouté.")}
function setCat(id,f,v){if(!can("fin.budget"))return;const c=S.config.taxCats[id];if(!c)return;if(f=="rate")v=Math.min(100,Math.max(0,num(v)));else{v=String(v).trim();if(!v)return render()}
 DBX.update("config/taxCats/"+id,{[f]:v});log(f=="rate"?`Taux du type « ${c.name} » : ${v} %`:`Type « ${c.name} » renommé en « ${v} »`,"Finances","Taxes")}
function delCat(id){const c=S.config.taxCats[id],L=vals(S.users).filter(u=>u.taxCat==id);ask(`Supprimer le type « ${c.name} » ?${L.length?` ${L.length} entreprise(s) passeront « Sans type ».`:""}`,()=>{L.forEach(u=>DBX.update("users/"+u.id,{taxCat:""}));DBX.remove("config/taxCats/"+id);log(`Type d'entreprise supprimé : ${c.name}`,"Finances","Taxes")},"Supprimer")}
function setEntCat(uid,cat){if(!can("fin.budget"))return;const u=S.users[uid];DBX.update("users/"+uid,{taxCat:cat||""});log(`${u.nom} classée « ${cat?S.config.taxCats[cat].name:"Sans type"} »`,"Finances","Taxes")}
function setEntRate(uid,v){if(!can("fin.budget"))return;const u=S.users[uid],own=String(v).trim()!=="";const r=own?Math.min(100,Math.max(0,num(v))):null;
 DBX.update("users/"+uid,{taxRate:r});log(own?`Taux spécifique de ${u.nom} : ${r} %`:`Taux spécifique de ${u.nom} retiré (taux du type)`,"Finances","Taxes")}
function copyTaxes(){const t=taxText();const done=()=>toast("Récapitulatif copié : collez-le dans Discord.");
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));else fallbackCopy(t,done)}
function fallbackCopy(t,cb){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");cb()}catch(e){toast("Copie impossible : sélectionnez le texte manuellement.",1)}a.remove()}
function setBudget(i,v){const d=DEPTS()[i];DBX.update("config/budgets",{[d]:num(v)});log(`Budget ${d} : ${money(v)}`,"Finances","Finances")}

/* Preuves de paiement */
const proofCache={};
function loadProof(fid){if(proofCache[fid]!==undefined||loadProof.p[fid])return;loadProof.p[fid]=1;
 const done=v=>{proofCache[fid]=v||null;delete loadProof.p[fid];render()};
 if(db)db.ref(ROOT+"/preuves/"+fid).once("value").then(s=>done(s.val()),e=>{fbErr(e);done(null)});else done(S.preuves&&S.preuves[fid])}
loadProof.p={};
function proofFile(file){if(!file||!modal||modal.type!="notif")return;
 if(file.type=="application/pdf"){if(file.size>3e6)return toast("PDF trop lourd (3 Mo max). Envoyez plutôt une capture d'écran.",1);const r=new FileReader();r.onload=()=>{modal.proof={data:r.result,name:file.name||"preuve.pdf",type:file.type,size:file.size};render()};r.readAsDataURL(file);return}
 if(!file.type.startsWith("image/"))return toast("Format non pris en charge : image ou PDF uniquement.",1);
 modal.busy=1;render();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height,mx=1600;if(w>mx||h>mx){const k=mx/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);let q=.85,d=c.toDataURL("image/jpeg",q);while(d.length>1.4e6&&q>.4){q-=.15;d=c.toDataURL("image/jpeg",q)}

  const u=ME(),now=Date.now(),id=nid(),per={};const E=vals(S.users).filter(x=>x.role=="entreprise");
  const ent=(uid,nom)=>{if(!per[uid]){const x=S.users[uid];per[uid]={nom:x?x.nom:nom,type:x?taxCatName(x):"—",taux:x?taxRate(x):0,ca:0,impot:0,paye:0,reste:0}}return per[uid]};

  P.F.forEach(f=>{const e=ent(f.ent||("x_"+f.entNom),f.entNom);if(f.st=="payee")e.paye+=num(f.montant);else e.reste+=num(f.montant)});
  const clean=k=>String(k).replace(/[.#$\/\[\]]/g,"_");const perE={};Object.entries(per).forEach(([k,v])=>perE[clean(k)]=v);
  DBX.set("archives/"+id,{id,name,note:tval("arno"),from:P.from,to:now,by:u.id,byNom:u.nom,nDecl:P.D.length,nFact:P.F.length,ca:P.ca,emis:P.emis,paye:P.paye,impaye:P.impaye,perEnt:perE});

   facts:P.F.map(f=>({num:f.num,ent:f.ent||"",entNom:f.entNom,motif:f.motif,montant:num(f.montant),st:f.st}))});
  const ud={},uf={};P.D.forEach(d=>ud[d.id+"/arch"]=id);P.F.filter(f=>f.st=="payee").forEach(f=>uf[f.id+"/arch"]=id);
  if(Object.keys(ud).length)DBX.update("declarations",ud);if(Object.keys(uf).length)DBX.update("factures",uf);

 const np=val("ep");if(np){up.hash=await hashPw(u.login,np);up.mustChange=true}
 if(dir&&(role=="fonctionnaire"||role=="encadrement"))up.xperms=finalPerms(null,false);
 if(up.active===false&&u.svc&&u.svc.on){up.svc=Object.assign({},u.svc,{on:false})}
 DBX.update("users/"+id,up);log(`Compte modifié : ${nom}${up.active===false?" (suspendu)":""}${np?" — mot de passe réinitialisé":""}`,up.dept,"Comptes");toast("Compte mis à jour.");closeM()}
function delUser(id){const u=S.users[id];ask(`Supprimer le compte de ${u.nom} (${u.login}) ? Son historique reste dans le journal.`,()=>{DBX.remove("users/"+id);log("Compte supprimé : "+u.nom,u.dept,"Comptes")},"Supprimer")}
function saveGrade(id){const dir=isDir(),name=tval("gn");if(!name)return say("Intitulé requis.");const old=id?S.grades[id]:null;
 const role=dir?val("gr"):"fonctionnaire",dept=dir?val("gd"):ME().dept;
 const g={name,role,dept,color:val("gc"),perDossier:num(val("gpd")),perHour:num(val("gph")),fixe:num(val("gfx")),rank:num(val("grk")),perms:role=="direction"?{}:finalPerms(old&&old.perms,!dir)};
 if(id)DBX.update("grades/"+id,g);else{id=nid();g.id=id;DBX.set("grades/"+id,g)}
 log(`Grade ${old?"modifié":"créé"} : ${name}`,dept,"Grades");toast("Grade enregistré.");closeM()}
function delGrade(id){const g=S.grades[id],n=vals(S.users).filter(u=>u.gradeId==id);ask(`Supprimer le grade « ${g.name} » ?${n.length?` ${n.length} agent(s) perdront ce grade.`:""}`,()=>{n.forEach(u=>DBX.update("users/"+u.id,{gradeId:""}));DBX.remove("grades/"+id);log("Grade supprimé : "+g.name,g.dept,"Grades");modal=null},"Supprimer")}
/* Administration */
function saveBanner(){DBX.update("config",{banner:{txt:tval("bt"),lvl:val("bl"),on:val("bo")=="1"}});log("Bandeau d'information mis à jour","Communication","Administration");toast("Bandeau mis à jour.")}
function saveSettings(){const dp=val("sdp").split("\n").map(s=>s.trim()).filter(Boolean);if(!dp.length)return toast("Il faut au moins un département.",1);
 DBX.update("config",{siteName:tval("sn")||"Gouvernement de Los Santos",subtitle:tval("ss"),accent:val("sa"),logo:tval("slg")||"logo.png",treasuryStart:num(val("st0")),requireService:val("srs")=="1",depts:[...new Set(dp)]});applyTheme();log("Paramètres du site modifiés","","Administration");toast("Paramètres enregistrés.")}
function resetAccent(){DBX.update("config",{accent:null});setTimeout(applyTheme,50);toast("Couleur par défaut rétablie.")}
function saveMaint(){const on=val("mo")=="1";DBX.update("config",{maintenance:{on,msg:tval("mm")}});log("Maintenance "+(on?"activée":"désactivée"),"","Administration");toast("Maintenance "+(on?"activée":"désactivée")+".")}
function exportData(){const data={config:S.config};COLS.forEach(c=>data[c]=S[c]);const b=new Blob([JSON.stringify(data,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="sauvegarde-intranet-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);log("Sauvegarde exportée","","Administration")}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){return toast("Fichier invalide.",1)}if(!d||!d.users)return toast("Ce fichier n'est pas une sauvegarde de l'intranet.",1);
 ask("Restaurer cette sauvegarde ? Toutes les données actuelles seront remplacées.",()=>{DBX.replaceAll(d).then(()=>{toast("Sauvegarde restaurée.");setTimeout(()=>log("Sauvegarde restaurée","","Administration"),500)})},"Restaurer")};r.readAsText(f);inp.value=""}
function wipeAll(){ask("Tout effacer définitivement ? Cette action est irréversible.",()=>{DBX.replaceAll({}).then(()=>{meId=null;lsSet("lsgov_session",null);ready=false;S={config:{}};COLS.forEach(c=>S[c]={});setTimeout(boot,600)})},"Tout effacer")}

/* Démarrage */
applyTheme();render();startData();
</script></body></html>
