/* =================== MODALES =================== */
function modalH(){if(!modal)return "";let m=null;
 if(modal.type=="confirm")m={title:"Confirmation",sm:1,body:`<p class="pre">${esc(modal.msg)}</p>`,foot:`<button class="btn sec" onclick="askNo()">Annuler</button><button class="btn no" onclick="askOk()">${esc(modal.label)}</button>`};
 else if(modal.type=="dossier")m=MDossier(S.dossiers[modal.id]);
 else if(modal.type=="affaire")m=MAffaire(S.affaires[modal.id]);
 else if(modal.type=="affaireNew")m=MAffaireNew();
 else if(modal.type=="reg")m=MReg();
 else if(modal.type=="grade")m=MGrade();
 else if(modal.type=="user")m=MUser(S.users[modal.id]);
 if(!m){modal=null;return ""}
 return `<div class="modal-bg" onclick="if(event.target===this)${modal.type=="confirm"?"askNo()":"closeM()"}"><div class="modal ${m.sm?"sm":""}" role="dialog" aria-modal="true"><div class="mh"><h3>${m.title}</h3><button class="x" onclick="${modal.type=="confirm"?"askNo()":"closeM()"}" aria-label="Fermer">×</button></div><div class="mb">${m.body}</div>${m.foot?`<div class="mf">${m.foot}</div>`:""}</div></div>`}
</script>
<script>
/* =================== ACTIONS =================== */
async function login(){const l=tval("li"),p=val("lp");if(!l||!p)return say("Renseignez l'identifiant et le mot de passe.");
 const u=vals(S.users).find(x=>x.login.toLowerCase()==l.toLowerCase());
 if(!u||u.hash!==await hashPw(u.login,p))return say("Identifiant ou mot de passe incorrect.");
 if(u.active===false)return say("Ce compte est suspendu. Contactez votre hiérarchie.");
 meId=u.id;lsSet("lsgov_session",u.id);view="accueil";keep={};lastUnread=-1;DBX.update("users/"+u.id,{lastLogin:Date.now()});log("Connexion à l'intranet",u.dept,"Connexion");render()}
function logout(){meId=null;lsSet("lsgov_session",null);modal=null;keep={};convWith=null;render()}
async function forcePw(){const a=val("np1"),b=val("np2");if(a.length<4)return say("Au moins 4 caractères.");if(a!==b)return say("Les deux mots de passe diffèrent.");
 const u=ME();if(await hashPw(u.login,a)==u.hash)return say("Choisissez un mot de passe différent de l'ancien.");
 await DBX.update("users/"+u.id,{hash:await hashPw(u.login,a),mustChange:false});keep={};toast("Mot de passe défini.");render()}
async function changePw(){const u=ME();if(await hashPw(u.login,val("op"))!==u.hash)return say("Mot de passe actuel incorrect.");const a=val("np1");if(a.length<4)return say("Au moins 4 caractères.");if(a!==val("np2"))return say("Les deux mots de passe diffèrent.");
 DBX.update("users/"+u.id,{hash:await hashPw(u.login,a)});clr("op","np1","np2");toast("Mot de passe modifié.");log("Changement de mot de passe",u.dept,"Comptes")}
function saveTel(){DBX.update("users/"+meId,{tel:tval("pt")});toast("Profil enregistré.")}

/* Service */
function toggleSvc(){const u=ME(),s=Object.assign({on:false,since:0,acc:0,total:0},u.svc||{}),now=Date.now();
 if(s.on){const st=Math.max(s.since,u.paidAt||0);s.acc=(s.acc||0)+(now-st);s.total=(s.total||0)+(now-s.since);DBX.set(`users/${u.id}/svcLog/${nid()}`,{a:s.since,b:now});s.on=false;log("Fin de service ("+dur(now-s.since)+")",u.dept,"Service");toast("Fin de service enregistrée.")}
 else{s.on=true;s.since=now;log("Prise de service",u.dept,"Service");toast("Vous êtes en service.")}
 DBX.update("users/"+u.id,{svc:s})}

/* Dossiers */
function addDem(){const u=ME(),o=tval("no"),t=tval("nt"),d=val("nd");if(!o||!t)return say("Renseignez l'objet et les détails.");
 const id=nid();DBX.set("dossiers/"+id,{id,num:nextNum("dossiers","DOS"),ent:u.id,entNom:u.nom,dept:d,type:val("ny"),prio:val("np")||"normale",objet:o,det:t,st:"attente",t:Date.now()});
 log("Dépôt du dossier : "+o,d,"Dossiers");clr("no","nt");toast("Demande déposée.");go("mesdem")}
function dosComment(id){const t=tval("dc");if(!t)return;const u=ME();DBX.set(`dossiers/${id}/comments/${nid()}`,{t:Date.now(),u:u.id,nom:u.nom,txt:t,internal:!!val("dci")});clr("dc")}
function dosTake(id){const d=S.dossiers[id];DBX.update("dossiers/"+id,{st:"cours",assign:meId});log("Prise en charge : "+d.num,d.dept,"Dossiers")}
function dosAssign(id){const d=S.dossiers[id],a=val("das");DBX.update("dossiers/"+id,{assign:a||null,st:d.st=="attente"&&a?"cours":d.st});log(`Dossier ${d.num} assigné à ${a?uname(a):"personne"}`,d.dept,"Dossiers");toast("Assignation enregistrée.")}
function dosTreat(id,st){const d=S.dossiers[id],u=ME();if(!canTreat(d))return toast("Action non autorisée (service ?).",1);
 const mo=tval("dmo");if(st=="no"&&!mo)return say("Indiquez le motif du refus.");
 DBX.update("dossiers/"+id,{st,by:u.id,byNom:u.nom,tt:Date.now(),motif:mo||"",assign:d.assign||u.id});log((st=="ok"?"Dossier accepté : ":"Dossier refusé : ")+d.num+" — "+d.objet,d.dept,"Dossiers");toast(st=="ok"?"Dossier accepté.":"Dossier refusé.");closeM()}
function dosReopen(id){const d=S.dossiers[id];DBX.update("dossiers/"+id,{st:"cours",by:null,byNom:null,tt:null});log("Dossier rouvert : "+d.num,d.dept,"Dossiers")}
function dosDel(id){const d=S.dossiers[id];ask("Supprimer définitivement le dossier "+d.num+" ?",()=>{DBX.remove("dossiers/"+id);log("Dossier supprimé : "+d.num,d.dept,"Dossiers");modal=null},"Supprimer")}

/* Justice */
function affCreate(){const t=tval("an");if(!t)return say("Indiquez l'intitulé de l'affaire.");const id=nid(),u=ME(),j=val("aj");
 DBX.set("affaires/"+id,{id,num:nextNum("affaires","AFF"),titre:t,type:val("aty"),juge:j||"",plaignant:tval("apl"),accuse:tval("aac"),desc:tval("ade"),secret:!!val("ase"),st:"ouverte",t:Date.now(),by:u.id,from:modal.from||""});
 if(modal.from){const d=S.dossiers[modal.from];if(d&&(d.st=="attente"||d.st=="cours"))DBX.set(`dossiers/${d.id}/comments/${nid()}`,{t:Date.now(),u:u.id,nom:u.nom,txt:"Une affaire judiciaire a été ouverte suite à ce dossier.",internal:false})}
 log("Ouverture de l'affaire : "+t,"Justice","Justice");toast("Affaire ouverte.");modal={type:"affaire",id};keep={};render()}
function affPiece(id){const t=tval("ptx");if(!t)return say("Rédigez le contenu de la pièce.");const u=ME(),a=S.affaires[id],k=val("pk"),li=tval("pli");if(li&&!/^https?:\/\//.test(li))return say("Le lien doit commencer par http:// ou https://");
 DBX.set(`affaires/${id}/pieces/${nid()}`,{t:Date.now(),u:u.id,nom:u.nom,kind:k,txt:t,link:li});if(a.st=="ouverte")DBX.update("affaires/"+id,{st:"instruction"});
 log(`${PK[k]} versée à l'affaire ${a.num}`,"Justice","Justice");clr("ptx","pli");toast("Pièce versée au dossier.")}
function affManage(id){const a=S.affaires[id],st=val("ast2"),j=val("aj2"),au=val("aau2");const up={st,juge:j,audience:au};if(au&&st=="ouverte"||au&&st=="instruction")up.st="audience";
 DBX.update("affaires/"+id,up);log(`Affaire ${a.num} : statut « ${AST[up.st][0]} »${j?", juge "+uname(j):""}${au?", audience le "+fd(au):""}`,"Justice","Justice");toast("Affaire mise à jour.")}
function affVerdict(id){const a=S.affaires[id],u=ME(),tx=tval("vtx");if(!tx)return say("Rédigez le dispositif du jugement.");const pe=tval("vpe"),am=num(val("vam"));
 DBX.update("affaires/"+id,{st:"jugee",verdict:{txt:tx,peine:pe,amende:am,t:Date.now(),by:u.id,nom:u.nom}});
 if(val("vca")&&a.accuse){const cid=nid();DBX.set("casier/"+cid,{id:cid,nom:a.accuse,date:new Date().toISOString().slice(0,10),infraction:a.titre,cat:a.type=="Pénale"?"Délit":"Contravention",peine:pe,amende:am,affaire:a.num,t:Date.now(),by:u.id})}
 if(val("vfa")&&am>0){const fid=nid(),acc=vals(S.users).find(x=>x.role=="entreprise"&&x.nom.toLowerCase()==(a.accuse||"").toLowerCase());DBX.set("factures/"+fid,{id:fid,num:nextNum("factures","FAC"),kind:"amende",ent:acc?acc.id:"",entNom:a.accuse||"—",motif:"Jugement "+a.num+" — "+a.titre,montant:am,ech:"",dept:"Justice",st:"due",t:Date.now(),by:u.id,byNom:u.nom})}
 log(`Jugement rendu dans l'affaire ${a.num}${pe?" : "+pe:""}`,"Justice","Justice");toast("Jugement prononcé.")}
function affReopen(id){const a=S.affaires[id];DBX.update("affaires/"+id,{st:"instruction"});log("Réouverture de l'affaire "+a.num,"Justice","Justice")}
function affDel(id){const a=S.affaires[id];ask("Supprimer définitivement l'affaire "+a.num+" et toutes ses pièces ?",()=>{DBX.remove("affaires/"+id);log("Affaire supprimée : "+a.num,"Justice","Justice");modal=null},"Supprimer")}

/* Registres */
const REGD={entreprises:"Intérieur",identites:"État-Civil",casier:"Justice",avis:"Sécurité"};
function regSave(s,id){const R=REG[s],o={};for(const f of R.f){let v=tval("rf_"+f.k);if(f.type=="number")v=v===""?"":num(v);if(f.req&&v==="")return say("Champ requis : "+f.l);o[f.k]=v}
 if(o.photo&&!/^https?:\/\//.test(o.photo))return say("Le lien de la photo doit commencer par http(s)://");
 if(id){o.mt=Date.now();DBX.update(`${s}/${id}`,o)}else{id=nid();Object.assign(o,{id,t:Date.now(),by:meId});DBX.set(`${s}/${id}`,o)}
 log(`${R.t} : fiche « ${(o.prenom?o.prenom+" ":"")+o.nom} » ${modal.id?"modifiée":"créée"}`,REGD[s],"Registres");toast("Fiche enregistrée.");closeM()}
function regDel(s,id){const r=S[s][id];ask("Supprimer la fiche « "+r.nom+" » ?",()=>{DBX.remove(`${s}/${id}`);log(`${REG[s].t} : fiche « ${r.nom} » supprimée`,REGD[s],"Registres");modal=null},"Supprimer")}

/* Finances */
function addTx(){const m=num(val("fm")),l=tval("fl");if(m<=0||!l)return say("Montant et libellé requis.");const id=nid(),u=ME(),dp=val("fdp");
 DBX.set("transactions/"+id,{id,t:Date.now(),type:val("ft"),cat:val("fc"),dept:dp=="Général"?"":dp,montant:m,label:l,by:u.id,byNom:u.nom});log(`Opération ${val("ft")=="in"?"recette":"dépense"} : ${l} (${money(m)})`,"Finances","Finances");clr("fm","fl");toast("Opération enregistrée.")}
function delTx(id){const t=S.transactions[id];ask("Supprimer l'opération « "+t.label+" » ("+money(t.montant)+") ?",()=>{DBX.remove("transactions/"+id);log("Opération supprimée : "+t.label,"Finances","Finances")},"Supprimer")}
function addBill(){const m=num(val("bm")),mo=tval("bmo"),e=val("be"),n=tval("bn");if(m<=0||!mo)return say("Montant et motif requis.");if(!e&&!n)return say("Choisissez un compte ou saisissez un nom.");
 const id=nid(),u=ME();DBX.set("factures/"+id,{id,num:nextNum("factures","FAC"),kind:val("bk"),ent:e,entNom:e?uname(e):n,motif:mo,montant:m,ech:val("bd"),dept:val("bdp"),st:"due",t:Date.now(),by:u.id,byNom:u.nom});
 log(`${kindL(val("bk"))} émise à ${e?uname(e):n} : ${money(m)}`,"Finances","Finances");clr("bm","bmo","bn","bd");toast("Émise.")}
function payFact(id){const f=S.factures[id],u=ME();ask(`${u.role=="entreprise"?"Payer":"Encaisser"} ${kindL(f.kind).toLowerCase()} ${f.num} de ${money(f.montant)} ?`,()=>{
 DBX.update("factures/"+id,{st:"payee",paidT:Date.now()});const tid=nid();DBX.set("transactions/"+tid,{id:tid,t:Date.now(),type:"in",cat:f.kind=="amende"?"Amendes":f.kind=="taxe"?"Impôts":"Factures",dept:f.dept||"Finances",montant:num(f.montant),label:`${f.num} — ${f.entNom} — ${f.motif}`,by:u.id,byNom:u.nom});
 log(`Paiement ${f.num} (${money(f.montant)}) par ${f.entNom}`,"Finances","Finances");toast("Paiement enregistré.")},u.role=="entreprise"?"Payer":"Encaisser")}
function cancelFact(id){const f=S.factures[id];ask("Annuler "+f.num+" ?",()=>{DBX.update("factures/"+id,{st:"annulee"});log("Annulation "+f.num,"Finances","Finances")},"Annuler la facture")}
function declare(){const p=tval("dp"),ca=num(val("dca"));if(!p||ca<=0)return say("Indiquez la période et un chiffre d'affaires.");const u=ME(),tx=num(S.config.tax),imp=Math.round(ca*tx/100),id=nid(),fid=nid();
 DBX.set("declarations/"+id,{id,ent:u.id,entNom:u.nom,periode:p,ca,taux:tx,impot:imp,st:"declaree",t:Date.now(),fac:fid});
 if(imp>0)DBX.set("factures/"+fid,{id:fid,num:nextNum("factures","FAC"),kind:"taxe",ent:u.id,entNom:u.nom,motif:"Impôt sur le CA — "+p,montant:imp,ech:new Date(Date.now()+7*864e5).toISOString().slice(0,10),dept:"Finances",st:"due",t:Date.now(),by:u.id,byNom:u.nom});
 log(`Déclaration fiscale de ${u.nom} (${p}) : CA ${money(ca)}`,"Finances","Finances");clr("dp","dca");delete keep.dca;toast("Déclaration envoyée. Facture d'impôt générée.")}
function validDecl(id){const d=S.declarations[id];DBX.update("declarations/"+id,{st:"validee",vby:meId,vt:Date.now()});log("Déclaration validée : "+d.entNom+" ("+d.periode+")","Finances","Finances")}
function setTax(){const t=Math.min(100,Math.max(0,num(val("ctax"))));DBX.update("config",{tax:t});log("Taux d'imposition fixé à "+t+" %","Finances","Finances");toast("Taux appliqué.")}
function setBudget(i,v){const d=DEPTS()[i];DBX.update("config/budgets",{[d]:num(v)});log(`Budget ${d} : ${money(v)}`,"Finances","Finances")}

/* Communication */
function addAnn(){const t=tval("at1"),x=tval("at2");if(!t||!x)return say("Titre et contenu requis.");const id=nid(),u=ME();
 DBX.set("annonces/"+id,{id,titre:t,txt:x,cible:val("at3"),pin:!!val("at4"),t:Date.now(),by:u.id,nom:u.nom+" — "+gname(u)});log("Annonce publiée : "+t,u.dept,"Communication");clr("at1","at2","at4");toast("Annonce publiée.")}
function delAnn(id){const a=S.annonces[id];ask("Supprimer l'annonce « "+a.titre+" » ?",()=>{DBX.remove("annonces/"+id);log("Annonce supprimée : "+a.titre,ME().dept,"Communication")},"Supprimer")}
function sendMsg(){const t=tval("mtx");if(!t||!convWith)return;const id=nid();DBX.set("messages/"+id,{id,from:meId,to:convWith,txt:t,t:Date.now(),read:false});clr("mtx");setTimeout(()=>{const e=$("#mtx");e&&e.focus()},60)}

/* Personnel */
async function addUser(){const dir=isDir(),nom=tval("cn"),l=tval("cl"),p=val("cp"),r=val("cr");
 if(!nom||!l||!p)return say("Nom, identifiant et mot de passe requis.");if(!/^[\w.\-@]{3,32}$/.test(l))return say("Identifiant : 3 à 32 caractères (lettres, chiffres, . - _ @).");
 if(vals(S.users).some(u=>u.login.toLowerCase()==l.toLowerCase()))return say("Cet identifiant existe déjà.");
 if(!dir&&!["entreprise","fonctionnaire"].includes(r))return say("Rôle non autorisé.");
 const dept=(r=="fonctionnaire"||r=="encadrement")?(dir?val("cd"):ME().dept):"";if((r=="fonctionnaire"||r=="encadrement")&&!dept)return say("Choisissez un département.");
 const id=nid();await DBX.set("users/"+id,{id,login:l,hash:await hashPw(l,p),nom,role:r,dept,gradeId:r=="entreprise"?"":val("cg"),matricule:r=="entreprise"?"":tval("cm"),tel:tval("ct"),active:true,mustChange:true,created:Date.now(),createdBy:meId});
 log(`Compte créé : ${nom} (${ROLES[r]}${dept?", "+dept:""})`,dept,"Comptes");clr("cn","cl","cp","cm","ct");toast("Compte créé. Identifiant : "+l)}
async function saveUser(id){const u=S.users[id],dir=isDir(),nom=tval("en");if(!nom)return say("Nom requis.");
 const role=dir?val("er"):u.role,up={nom,tel:tval("et"),active:val("ea")=="1"};up.role=role;
 if(role=="fonctionnaire"||role=="encadrement"){up.dept=dir?val("ed"):u.dept;if(!up.dept)return say("Choisissez un département.")}else up.dept="";
 if(role!="entreprise"){up.gradeId=val("eg");up.matricule=tval("em")}else{up.gradeId="";}
 const np=val("ep");if(np){up.hash=await hashPw(u.login,np);up.mustChange=true}
 if(dir&&(role=="fonctionnaire"||role=="encadrement"))up.xperms=readPerms("ex_");
 if(up.active===false&&u.svc&&u.svc.on){up.svc=Object.assign({},u.svc,{on:false})}
 DBX.update("users/"+id,up);log(`Compte modifié : ${nom}${up.active===false?" (suspendu)":""}${np?" — mot de passe réinitialisé":""}`,up.dept,"Comptes");toast("Compte mis à jour.");closeM()}
function delUser(id){const u=S.users[id];ask(`Supprimer le compte de ${u.nom} (${u.login}) ? Son historique reste dans le journal.`,()=>{DBX.remove("users/"+id);log("Compte supprimé : "+u.nom,u.dept,"Comptes")},"Supprimer")}
function saveGrade(id){const dir=isDir(),name=tval("gn");if(!name)return say("Intitulé requis.");const old=id?S.grades[id]:null;
 const role=dir?val("gr"):"fonctionnaire",dept=dir?val("gd"):ME().dept;
 const g={name,role,dept,color:val("gc"),perDossier:num(val("gpd")),perHour:num(val("gph")),fixe:num(val("gfx")),rank:num(val("grk")),perms:role=="direction"?{}:readPerms("gp_",old&&old.perms,!dir)};
 if(id)DBX.update("grades/"+id,g);else{id=nid();g.id=id;DBX.set("grades/"+id,g)}
 log(`Grade ${old?"modifié":"créé"} : ${name}`,dept,"Grades");toast("Grade enregistré.");closeM()}
function delGrade(id){const g=S.grades[id],n=vals(S.users).filter(u=>u.gradeId==id);ask(`Supprimer le grade « ${g.name} » ?${n.length?` ${n.length} agent(s) perdront ce grade.`:""}`,()=>{n.forEach(u=>DBX.update("users/"+u.id,{gradeId:""}));DBX.remove("grades/"+id);log("Grade supprimé : "+g.name,g.dept,"Grades");modal=null},"Supprimer")}
function setBonus(id,v){const u=S.users[id];DBX.update("users/"+id,{bonus:num(v)});log(`Prime de ${u.nom} : ${money(v)}`,u.dept,"Salaires")}
function doPay(u,now){const p=payInfo(u),me=ME();if(p.total<=0)return 0;const s=Object.assign({},u.svc||{});s.acc=0;if(s.on)s.since=s.since||now;
 DBX.update("users/"+u.id,{paidAt:now,bonus:0,svc:s});const tid=nid();
 DBX.set("transactions/"+tid,{id:tid,t:now,type:"out",cat:"Salaires",dept:u.dept||"",user:u.id,montant:p.total,label:`Salaire ${u.nom} — ${p.nd} dossier(s), ${p.h.toFixed(1)} h${p.fx?", fixe "+money(p.fx):""}${p.bo?", prime "+money(p.bo):""}`,by:me.id,byNom:me.nom});
 log(`Salaire versé à ${u.nom} : ${money(p.total)}`,u.dept,"Salaires");return p.total}
function payUser(id){const u=S.users[id],p=payInfo(u);ask(`Verser ${money(p.total)} à ${u.nom} ?`,()=>{doPay(u,Date.now());toast("Salaire versé.")},"Verser")}
function payAll(){const L=vals(S.users).filter(u=>isAgent(u)&&(isDir()||manageable(u))&&payInfo(u).total>0),tot=L.reduce((s,u)=>s+payInfo(u).total,0);if(!L.length)return toast("Aucun salaire à verser.");
 ask(`Verser ${money(tot)} à ${L.length} agent(s) ?`,()=>{const now=Date.now();L.forEach(u=>doPay(u,now));toast("Salaires versés.")},"Tout verser")}

/* Administration */
function saveBanner(){DBX.update("config",{banner:{txt:tval("bt"),lvl:val("bl"),on:val("bo")=="1"}});log("Bandeau d'information mis à jour","Communication","Administration");toast("Bandeau mis à jour.")}
function saveSettings(){const dp=val("sdp").split("\n").map(s=>s.trim()).filter(Boolean);if(!dp.length)return toast("Il faut au moins un département.",1);
 DBX.update("config",{siteName:tval("sn")||"Gouvernement de Los Santos",subtitle:tval("ss"),accent:val("sa"),logo:tval("slg")||"logo.png",treasuryStart:num(val("st0")),requireService:val("srs")=="1",depts:[...new Set(dp)]});applyTheme();log("Paramètres du site modifiés","","Administration");toast("Paramètres enregistrés.")}
function resetAccent(){DBX.update("config",{accent:null});setTimeout(applyTheme,50);toast("Couleur par défaut rétablie.")}
function saveMaint(){const on=val("mo")=="1";DBX.update("config",{maintenance:{on,msg:tval("mm")}});log("Maintenance "+(on?"activée":"désactivée"),"","Administration");toast("Maintenance "+(on?"activée":"désactivée")+".")}
function exportData(){const data={config:S.config};COLS.forEach(c=>data[c]=S[c]);const b=new Blob([JSON.stringify(data,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="sauvegarde-intranet-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);log("Sauvegarde exportée","","Administration")}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){return toast("Fichier invalide.",1)}if(!d||!d.users)return toast("Ce fichier n'est pas une sauvegarde de l'intranet.",1);
 ask("Restaurer cette sauvegarde ? Toutes les données actuelles seront remplacées.",()=>{DBX.replaceAll(d).then(()=>{toast("Sauvegarde restaurée.");setTimeout(()=>log("Sauvegarde restaurée","","Administration"),500)})},"Restaurer")};r.readAsText(f);inp.value=""}
function wipeAll(){ask("Tout effacer définitivement ? Cette action est irréversible.",()=>{DBX.replaceAll({}).then(()=>{meId=null;lsSet("lsgov_session",null);ready=false;S={config:{}};COLS.forEach(c=>S[c]={});setTimeout(boot,600)})},"Tout effacer")}

/* Démarrage */
applyTheme();render();startData();
</script></body></html>
